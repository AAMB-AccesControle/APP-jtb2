<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AAMB — Installation</title>
    
    <link rel="apple-touch-icon" href="icon-192.png?v=3">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json?v=3">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-color: #050811;
            background-image:
                radial-gradient(circle at 20% 20%, rgba(0, 242, 254, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 80% 70%, rgba(255, 0, 127, 0.08) 0%, transparent 45%),
                linear-gradient(to bottom, rgba(5, 8, 17, 0.95), rgba(5, 8, 17, 0.98));
            background-attachment: fixed;
            color: #e2e8f0;
        }
        .cyber-grid {
            position: fixed; inset: 0; pointer-events: none; z-index: 0;
            background-size: 40px 40px;
            background-image:
                linear-gradient(to right, rgba(56, 189, 248, 0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(56, 189, 248, 0.04) 1px, transparent 1px);
        }
        .container {
            position: relative; z-index: 1;
            background: rgba(13, 22, 41, 0.75);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(0, 242, 254, 0.25);
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 242, 254, 0.12), 0 0 1px rgba(0, 242, 254, 0.6);
        }
        .logo-wrap {
            width: 130px; height: 130px; margin: 0 auto 24px;
            background: white; border-radius: 18px; padding: 10px;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.35), inset 0 0 1px rgba(0, 242, 254, 0.5);
            border: 1px solid rgba(0, 242, 254, 0.4);
        }
        .logo-wrap img { width: 100%; height: 100%; object-fit: contain; }
        
        h1 {
            font-family: 'Orbitron', sans-serif;
            color: white;
            margin-bottom: 6px;
            font-size: 26px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        h1 .cyan { color: #00f2fe; text-shadow: 0 0 12px rgba(0, 242, 254, 0.6); }
        .subtitle {
            font-family: 'Rajdhani', sans-serif;
            color: #94a3b8;
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 18px;
        }
        p.intro {
            color: #cbd5e1;
            margin-bottom: 28px;
            line-height: 1.55;
            font-size: 14px;
        }
        
        .install-btn {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #0a0f1f;
            border: none;
            padding: 15px 20px;
            font-size: 16px;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.35);
            transition: all 0.25s;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .install-btn:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(0, 242, 254, 0.55); }
        .install-btn:active { transform: translateY(0); }
        
        .ios-btn {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            background: rgba(255, 0, 127, 0.15);
            color: #ff8ec7;
            border: 1px solid rgba(255, 0, 127, 0.5);
            padding: 13px 20px;
            font-size: 15px;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: all 0.25s;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .ios-btn:hover { background: rgba(255, 0, 127, 0.25); box-shadow: 0 0 20px rgba(255, 0, 127, 0.3); }

        .manual-instructions {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid rgba(0, 242, 254, 0.15);
            text-align: left;
        }
        .manual-instructions > p {
            color: #ff8ec7;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 13px;
            margin-bottom: 12px;
            text-align: center;
        }
        .step {
            margin: 8px 0;
            padding: 10px 12px;
            background: rgba(255, 0, 127, 0.08);
            border-left: 3px solid #ff007f;
            border-radius: 6px;
            font-size: 13px;
            color: #e2e8f0;
            line-height: 1.5;
        }
        .step strong { color: #ff8ec7; }
        
        .direct-link {
            margin-top: 20px;
            font-size: 13px;
            font-family: 'Rajdhani', sans-serif;
        }
        .direct-link a {
            color: #00f2fe;
            text-decoration: none;
            letter-spacing: 1px;
            transition: all 0.25s;
            padding: 4px 8px;
            border-radius: 4px;
        }
        .direct-link a:hover { color: #99f9ff; text-shadow: 0 0 8px rgba(0, 242, 254, 0.5); background: rgba(0, 242, 254, 0.08); }

        .pulse-dot {
            display: inline-block;
            width: 6px; height: 6px;
            background: #00f2fe;
            border-radius: 50%;
            box-shadow: 0 0 8px #00f2fe;
            animation: pulse 1.8s infinite;
            margin-right: 6px;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.3); }
        }
    </style>
</head>
<body>
    <div class="cyber-grid"></div>
    <div class="container">
        <div class="logo-wrap"><img src="logo-aamb.png" alt="AAMB"></div>
        <h1>AAMB <span class="cyan">v1.0</span></h1>
        <div class="subtitle"><span class="pulse-dot"></span>44èmes JTB · Besançon 2026</div>
        <p class="intro">Installez l'application pour accéder au scanner, au programme et aux outils de contrôle hors-ligne.</p>
        
        <button id="installBtn" class="install-btn" style="display: none;">
            <i class="fa-solid fa-bolt"></i> Installer l'application
        </button>
        
        <button id="iosBtn" class="ios-btn" style="display: none;">
            <i class="fa-brands fa-apple"></i> Instructions iPhone
        </button>
        
        <div id="iosInstructions" class="manual-instructions" style="display: none;">
            <p>Installation iOS</p>
            <div class="step"><strong>1.</strong> Appuyez sur <strong>Partager</strong> <span style="font-size:18px">⎋</span></div>
            <div class="step"><strong>2.</strong> Choisissez <strong>« Sur l'écran d'accueil »</strong></div>
            <div class="step"><strong>3.</strong> Appuyez sur <strong>Ajouter</strong></div>
        </div>

        <div class="direct-link">
            <a href="app.html">→ Ouvrir les outils sans installer</a>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) {
            window.location.replace("app.html");
        }

        const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.userAgent.includes("Mac") && "ontouchend" in document);
        const iosInstructions = document.getElementById('iosInstructions');
        const iosBtn = document.getElementById('iosBtn');

        if (isIOS && !window.navigator.standalone) {
            iosBtn.style.display = 'flex';
            iosBtn.addEventListener('click', () => {
                if (iosInstructions.style.display === 'block') {
                    iosInstructions.style.display = 'none';
                    iosBtn.innerHTML = '<i class="fa-brands fa-apple"></i> Instructions iPhone';
                } else {
                    iosInstructions.style.display = 'block';
                    iosBtn.innerHTML = '<i class="fa-brands fa-apple"></i> Masquer les instructions';
                }
            });
        }

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBtn').style.display = 'flex';
        });

        document.getElementById('installBtn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                await deferredPrompt.userChoice;
                deferredPrompt = null;
            }
        });
    </script>
</body>
</html>
