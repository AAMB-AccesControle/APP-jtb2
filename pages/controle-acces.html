<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#050811">
<title>Contrôle d'accès — AAMB JTB 2026</title>
<link rel="manifest" href="../manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100vh;
    background-color: #050811;
    background-image:
        radial-gradient(circle at 15% 15%, rgba(0, 242, 254, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 60%, rgba(255, 0, 127, 0.06) 0%, transparent 40%),
        linear-gradient(to bottom, rgba(5, 8, 17, 0.95), rgba(5, 8, 17, 0.98));
    background-attachment: fixed;
    color: #e2e8f0;
}
body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-size: 40px 40px;
    background-image:
        linear-gradient(to right, rgba(56, 189, 248, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(56, 189, 248, 0.04) 1px, transparent 1px);
}
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }

.page-header {
    position: sticky; top: 0; z-index: 50;
    background: rgba(13, 22, 41, 0.9);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(0, 242, 254, 0.25);
    padding: 12px 16px;
    display: flex; align-items: center; gap: 12px;
}
.back-btn {
    background: rgba(0, 242, 254, 0.1); border: 1px solid rgba(0, 242, 254, 0.3);
    color: #00f2fe; width: 36px; height: 36px; border-radius: 8px;
    font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.back-btn:hover { background: rgba(0, 242, 254, 0.25); color: white; }
.page-header h2 { font-family: 'Orbitron', sans-serif; font-size: 15px; letter-spacing: 2px; text-transform: uppercase; flex: 1; }
.page-header h2 .cyan { color: #00f2fe; text-shadow: 0 0 10px rgba(0, 242, 254, 0.6); }
.sync-badge {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #64748b;
    background: rgba(5, 8, 17, 0.6); padding: 4px 8px; border-radius: 6px;
    border: 1px solid rgba(100, 116, 139, 0.3); display: flex; align-items: center; gap: 6px;
}
.sync-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 6px #4ade80; }
.sync-badge .dot.syncing { background: #fbbf24; box-shadow: 0 0 6px #fbbf24; animation: pulse 1s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

.page-content { position: relative; z-index: 1; padding: 14px; max-width: 700px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

/* ==== BANDEAU SESSION ACTIVE ==== */
.slot-banner {
    border-radius: 14px; padding: 3px;
    background: linear-gradient(135deg, rgba(0, 242, 254, 0.5), rgba(255, 0, 127, 0.4));
    box-shadow: 0 0 20px rgba(0, 242, 254, 0.15);
}
.slot-inner {
    background: rgba(13, 22, 41, 0.9); border-radius: 11px; padding: 14px 16px;
}
.slot-time {
    font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #00f2fe;
    letter-spacing: 1px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px;
}
.slot-time .clock { font-size: 18px; font-weight: 700; color: #fff; }
.slot-sessions { display: flex; flex-wrap: wrap; gap: 6px; }
.slot-tag {
    font-family: 'Rajdhani', sans-serif; font-size: 11px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase;
    padding: 5px 10px; border-radius: 6px;
}
.slot-tag.conf { background: rgba(0, 242, 254, 0.12); border: 1px solid rgba(0, 242, 254, 0.4); color: #67e8f9; }
.slot-tag.atel { background: rgba(255, 0, 127, 0.12); border: 1px solid rgba(255, 0, 127, 0.4); color: #ff8ec7; }
.slot-empty { font-size: 13px; color: #94a3b8; }
.slot-next { font-size: 12px; color: #64748b; margin-top: 8px; font-style: italic; }

/* ==== PANNEAUX ==== */
.panel {
    background: rgba(13, 22, 41, 0.75); backdrop-filter: blur(10px);
    border: 1px solid rgba(56, 189, 248, 0.18); border-radius: 14px; padding: 16px;
}
.panel-header h3 {
    font-family: 'Rajdhani', sans-serif; font-size: 14px; font-weight: 700;
    letter-spacing: 1.5px; text-transform: uppercase; color: #f1f5f9;
    display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
}
.panel-header h3 i { color: #00f2fe; }
#reader {
    border: 2px solid rgba(0, 242, 254, 0.4); border-radius: 12px; overflow: hidden;
    background: #000; margin-bottom: 12px; min-height: 250px;
    box-shadow: inset 0 0 20px rgba(0, 242, 254, 0.1);
}
#reader video { border-radius: 10px; width: 100% !important; height: auto !important; }
.manual-section { border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 14px; }
.manual-section h4 { font-family: 'Rajdhani', sans-serif; font-size: 12px; color: #94a3b8; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
.input-group { display: flex; gap: 8px; }
input[type="text"] {
    flex: 1; padding: 10px 14px; background: rgba(5, 8, 17, 0.6);
    border: 1px solid rgba(0, 242, 254, 0.3); border-radius: 8px; color: #00f2fe;
    font-family: 'JetBrains Mono', monospace; font-size: 14px; letter-spacing: 1px; text-transform: uppercase;
}
input[type="text"]:focus { outline: none; border-color: #00f2fe; box-shadow: 0 0 12px rgba(0, 242, 254, 0.2); }
.btn-sm {
    padding: 10px 16px; border: none; border-radius: 8px;
    font-family: 'Rajdhani', sans-serif; font-size: 13px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: all 0.2s;
}
.btn-primary { background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%); color: #0a0f1f; box-shadow: 0 0 10px rgba(0, 242, 254, 0.2); }
.btn-primary:hover { box-shadow: 0 0 18px rgba(0, 242, 254, 0.5); transform: translateY(-1px); }

/* ==== RÉSULTAT ==== */
.result-card {
    padding: 24px; border-radius: 14px; text-align: center;
    animation: zoomIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    border: 1px solid rgba(255, 255, 255, 0.1);
}
@keyframes zoomIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
.result-card.success {
    background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(5, 150, 105, 0.05));
    border-color: rgba(16, 185, 129, 0.4); box-shadow: 0 0 25px rgba(16, 185, 129, 0.2);
}
.result-card.success .icon { color: #10b981; filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.6)); }
.result-card.success .name { color: #6ee7b7; }
.result-card.error {
    background: linear-gradient(135deg, rgba(255, 0, 127, 0.15), rgba(220, 38, 38, 0.05));
    border-color: rgba(255, 0, 127, 0.4); box-shadow: 0 0 25px rgba(255, 0, 127, 0.2);
}
.result-card.error .icon { color: #ff007f; filter: drop-shadow(0 0 8px rgba(255, 0, 127, 0.6)); }
.result-card.error .name { color: #ff8ec7; }
.result-card .icon { font-size: 48px; margin-bottom: 10px; }
.result-card .name { font-family: 'Orbitron', sans-serif; font-size: 21px; font-weight: 700; letter-spacing: 1px; margin-bottom: 6px; }
.result-card .message { font-size: 15px; color: #cbd5e1; margin-bottom: 12px; line-height: 1.4; }
.result-card .atelier {
    font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600;
    padding: 8px 14px; background: rgba(5, 8, 17, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 8px; display: inline-block; color: #e2e8f0;
}
.result-card .time { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #64748b; margin-top: 12px; }

.stats-panel { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.stat-item { background: rgba(13, 22, 41, 0.75); border: 1px solid rgba(56, 189, 248, 0.15); padding: 14px; border-radius: 12px; text-align: center; }
.stat-item .value { font-family: 'Orbitron', sans-serif; font-size: 26px; font-weight: 700; }
.stat-item .value.success { color: #10b981; text-shadow: 0 0 10px rgba(16, 185, 129, 0.4); }
.stat-item .value.error { color: #ff007f; text-shadow: 0 0 10px rgba(255, 0, 127, 0.4); }
.stat-item .label { font-family: 'Rajdhani', sans-serif; font-size: 11px; color: #94a3b8; letter-spacing: 1px; text-transform: uppercase; margin-top: 4px; }

.alert-box { padding: 10px 14px; border-radius: 8px; font-size: 13px; border-left: 3px solid #ff007f; background: rgba(255, 0, 127, 0.08); color: #ff8ec7; }
.loading { text-align: center; padding: 24px; color: #94a3b8; }
.spinner { border: 3px solid rgba(0, 242, 254, 0.1); border-top: 3px solid #00f2fe; border-radius: 50%; width: 36px; height: 36px; animation: spin 1s linear infinite; margin: 0 auto 12px; }
@keyframes spin { 100% { transform: rotate(360deg); } }
@media (max-width: 480px) { .page-content { padding: 10px; } #reader { min-height: 200px; } .result-card .name { font-size: 17px; } }
</style>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>

<div class="page-header">
    <button class="back-btn" onclick="retourAccueil()"><i class="fa-solid fa-arrow-left"></i></button>
    <h2>🔐 Contrôle <span class="cyan">d'accès</span></h2>
    <div class="sync-badge"><span class="dot" id="syncDot"></span><span id="syncText">Chargement...</span></div>
</div>

<div class="page-content">

    <!-- BANDEAU SESSION ACTIVE -->
    <div class="slot-banner">
        <div class="slot-inner">
            <div class="slot-time"><span class="clock" id="liveClock">--:--</span> <span id="slotLabel">Initialisation...</span></div>
            <div class="slot-sessions" id="slotSessions"></div>
            <div class="slot-next" id="slotNext"></div>
        </div>
    </div>

    <!-- SCANNER -->
    <div class="panel">
        <div class="panel-header"><h3><i class="fa-solid fa-qrcode"></i> Scanner le badge</h3></div>
        <div id="reader"></div>
        <div class="manual-section">
            <h4>✍️ Saisie manuelle (si QR illisible)</h4>
            <div class="input-group">
                <input type="text" id="manualCode" placeholder="Ex: X7K2M9PQ" maxlength="20" onkeydown="if(event.key==='Enter')checkManualCode()">
                <button class="btn-sm btn-primary" onclick="checkManualCode()">Vérifier</button>
            </div>
        </div>
    </div>

    <div id="alert"></div>
    <div id="result"></div>

    <div class="stats-panel">
        <div class="stat-item"><div class="value success" id="statScans">0</div><div class="label">✅ Autorisés</div></div>
        <div class="stat-item"><div class="value error" id="statRefus">0</div><div class="label">❌ Refusés</div></div>
    </div>
</div>

<script src="../js/commun.js"></script>
<script>
// ================= CONFIGURATION =================
const FENETRE_ACCUEIL_MS = 15 * 60000;   // on peut scanner 15 min avant le début
const TOLERANCE_FIN_MS   = 30 * 60000;   // on peut encore scanner 30 min après la fin (retards)

// ================= ÉTAT =================
let html5QrCode = null;
let isProcessing = false;
let sessions = [];            // [{id, libelle, date, deb, fin, startMs, endMs}]
let accessIndex = new Map();  // "TOKEN_SESSIONID" -> ligne
let lastKnownUpdate = localStorage.getItem('aamb_lastUpdate') || '0';
let stats = JSON.parse(localStorage.getItem('aamb_stats') || '{"scans":0,"refus":0}');

// Vérification organisateur
const adherent = typeof chargerAdherent === 'function' ? chargerAdherent() : null;
if (adherent && adherent.statut !== 'Organisateur') {
    document.getElementById('result').innerHTML = '<div class="result-card error"><div class="icon">⛔</div><div class="name">Accès refusé</div><div class="message">Réservé aux organisateurs.</div></div>';
    document.getElementById('reader').style.display = 'none';
    document.querySelector('.manual-section').style.display = 'none';
}

// ================= INITIALISATION =================
window.onload = async function () {
    updateStats();
    startClock();
    await loadSessions();
    await syncLocalData();
    startScanner();
    // Vérification légère toutes les 2 min (télécharge seulement si nouvelle version serveur)
    setInterval(syncLocalData, 120000);
    // Rafraîchit le bandeau session toutes les 30 s
    setInterval(updateSlotBanner, 30000);
};

function startClock() {
    const tick = () => {
        document.getElementById('liveClock').textContent = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    };
    tick(); setInterval(tick, 1000);
}

// ================= CHARGEMENT SESSIONS =================
async function loadSessions() {
    try {
        const resp = await fetch(`${SCRIPT_URL}?action=getSessions&t=${Date.now()}`);
        const data = await resp.json();
        if (data.success && Array.isArray(data.sessions)) {
            sessions = data.sessions.map(s => ({
                ...s,
                startMs: new Date(s.date + 'T' + s.deb + ':00').getTime(),
                endMs:   new Date(s.date + 'T' + s.fin + ':00').getTime()
            }));
            console.log('✅ ' + sessions.length + ' sessions chargées');
        }
    } catch (e) { console.error('Erreur sessions:', e); }
}

// ================= SYNCHRO LISTE PARTICIPANTS =================
async function syncLocalData() {
    const dot = document.getElementById('syncDot');
    const text = document.getElementById('syncText');
    try {
        const resp = await fetch(`${SCRIPT_URL}?action=getLastUpdate&t=${Date.now()}`);
        const data = await resp.json();
        if (!data.success) return;
        const serverUpdate = String(data.lastUpdate);
        if (serverUpdate !== lastKnownUpdate && serverUpdate !== '0') {
            dot.classList.add('syncing'); text.textContent = 'MAJ...';
            await downloadFullData();
            lastKnownUpdate = serverUpdate;
            localStorage.setItem('aamb_lastUpdate', serverUpdate);
        }
        dot.classList.remove('syncing');
        dot.style.background = '#4ade80';
        text.textContent = accessIndex.size ? accessIndex.size + ' entrées' : 'Vide';
    } catch (e) {
        dot.style.background = '#f87171';
        text.textContent = 'Cache';
    }
    updateSlotBanner();
}

async function downloadFullData() {
    const resp = await fetch(`${SCRIPT_URL}?action=getAccessData&t=${Date.now()}`);
    const data = await resp.json();
    if (data.success && Array.isArray(data.participants)) {
        accessIndex = new Map();
        data.participants.forEach(p => accessIndex.set(`${p.Token}_${p.SessionID}`, p));
        console.log('✅ ' + data.participants.length + ' entrées indexées');
    }
}

// ================= SESSIONS ACTIVES =================
function getActiveSessions() {
    const now = Date.now();
    return sessions.filter(s => now >= s.startMs - FENETRE_ACCUEIL_MS && now <= s.endMs + TOLERANCE_FIN_MS);
}

function updateSlotBanner() {
    const actives = getActiveSessions();
    const box = document.getElementById('slotSessions');
    const label = document.getElementById('slotLabel');
    const next = document.getElementById('slotNext');

    if (actives.length === 0) {
        label.textContent = 'Aucun créneau en cours';
        box.innerHTML = '<span class="slot-empty">En attente de la prochaine session...</span>';
        const now = Date.now();
        const prochaine = sessions.filter(s => s.startMs > now).sort((a, b) => a.startMs - b.startMs)[0];
        next.textContent = prochaine ? 'Prochaine : ' + prochaine.deb + ' — ' + prochaine.libelle : '';
        return;
    }
    label.textContent = 'Créneau en cours — scan actif';
    next.textContent = '';
    box.innerHTML = actives.map(s =>
        '<span class="slot-tag ' + (s.id.indexOf('ATEL') === 0 ? 'atel' : 'conf') + '">' + s.id + ' · ' + s.deb + '-' + s.fin + '</span>'
    ).join('');
}

// ================= SCANNER =================
function startScanner() {
    try {
        html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 250, height: 250 } },
            t => { if (!isProcessing) { isProcessing = true; html5QrCode.pause(true); verifyCode(t.trim().toUpperCase()); } },
            () => {}
        ).catch(() => showAlert('⚠️ Caméra inaccessible — utilisez la saisie manuelle.'));
    } catch (e) { showAlert('⚠️ Erreur scanner.'); }
}

function checkManualCode() {
    if (isProcessing) return;
    const code = document.getElementById('manualCode').value.trim().toUpperCase();
    if (!code) return;
    isProcessing = true;
    verifyCode(code);
    document.getElementById('manualCode').value = '';
}

// ================= VÉRIFICATION (instantanée, 100% locale) =================
async function verifyCode(token) {
    const actives = getActiveSessions();
    const idsActifs = new Set(actives.map(s => s.id));

    // On cherche le participant dans les sessions actives
    let match = null;
    for (const [key, ligne] of accessIndex.entries()) {
        if (!key.startsWith(token + '_')) continue;
        if (idsActifs.has(ligne.SessionID)) { match = ligne; break; }
    }

    if (match) {
        if (String(match.TimestampScan || '').trim()) {
            showResult(false, match.Nom + ' ' + match.Prenom, '⚠️ Déjà scanné à ' + match.TimestampScan, match.SessionLibelle);
            stats.refus++; playSound(false);
        } else {
            showResult(true, match.Nom + ' ' + match.Prenom, '✅ Accès autorisé', match.SessionLibelle);
            stats.scans++; playSound(true);
            // Horodatage local immédiat (évite le double-scan) + envoi serveur silencieux
            match.TimestampScan = new Date().toLocaleString('fr-FR');
            fetch(SCRIPT_URL, {
                method: 'POST', headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify({ action: 'markScanned', token: token, sessionId: match.SessionID, time: new Date().toISOString() })
            }).catch(() => {});
        }
    } else {
        const inscritAutre = [...accessIndex.keys()].some(k => k.startsWith(token + '_'));
        const msg = inscritAutre ? "Inscrit, mais pas à une session en cours" : "Code inconnu ou statut exclu";
        showResult(false, token, '❌ ' + msg, '');
        stats.refus++; playSound(false);
    }

    localStorage.setItem('aamb_stats', JSON.stringify(stats));
    updateStats();
    setTimeout(() => {
        isProcessing = false;
        document.getElementById('result').innerHTML = '';
        if (html5QrCode) { try { html5QrCode.resume(); } catch (e) {} }
    }, 3000);
}

// ================= AFFICHAGE =================
function showResult(autorise, nom, message, atelier) {
    const now = new Date();
    document.getElementById('result').innerHTML =
        '<div class="result-card ' + (autorise ? 'success' : 'error') + '">' +
        '<div class="icon">' + (autorise ? '✅' : '❌') + '</div>' +
        '<div class="name">' + esc(nom) + '</div>' +
        '<div class="message">' + esc(message) + '</div>' +
        (atelier ? '<div class="atelier">📍 ' + esc(atelier) + '</div>' : '') +
        '<div class="time">' + now.toLocaleDateString('fr-FR') + ' ' + now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) + '</div></div>';
}
function showAlert(m) { document.getElementById('alert').innerHTML = '<div class="alert-box">' + m + '</div>'; }
function updateStats() { document.getElementById('statScans').textContent = stats.scans; document.getElementById('statRefus').textContent = stats.refus; }
function esc(t) { const d = document.createElement('div'); d.textContent = t || ''; return d.innerHTML; }

function playSound(success) {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        if (success) {
            o.frequency.value = 880; g.gain.setValueAtTime(0.3, ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
            o.start(); o.stop(ctx.currentTime + 0.15);
            setTimeout(() => { const o2 = ctx.createOscillator(), g2 = ctx.createGain(); o2.connect(g2); g2.connect(ctx.destination); o2.frequency.value = 1100; g2.gain.setValueAtTime(0.3, ctx.currentTime); g2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1); o2.start(); o2.stop(ctx.currentTime + 0.1); }, 150);
        } else {
            o.frequency.value = 200; g.gain.setValueAtTime(0.3, ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
            o.start(); o.stop(ctx.currentTime + 0.4);
        }
    } catch (e) {}
}
function retourAccueil() { window.location.href = '../app.html'; }
</script>
</body>
</html>
