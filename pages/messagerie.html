<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messagerie</title>
<link rel="manifest" href="../manifest.json">
<script>
if (localStorage.getItem('darkMode') === '1') { document.documentElement.classList.add('dark'); }
</script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
--bg: #f5f7fa; --text: #222; --text-sub: #666; --card-bg: white;
--page-header-bg: #1a3a6b; --card-shadow: 0 2px 8px rgba(0,0,0,0.1);
--success: #10b981; --warning: #f59e0b; --primary: #1a3a6b; --danger: #dc3545;
}
body.dark {
--bg: #181c2a; --text: #eee; --text-sub: #999; --card-bg: #242840;
--page-header-bg: #0f1f3d; --card-shadow: 0 2px 8px rgba(0,0,0,0.4);
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); min-height: 100vh; }

.page-header { background: var(--page-header-bg); color: white; padding: 14px 20px; display: flex; align-items: center; gap: 12px; }
.back-btn { background: none; border: none; color: white; font-size: 22px; cursor: pointer; }
.page-header h2 { font-size: 18px; flex: 1; }
.page-content { padding: 16px; }

.sync-status { font-size: 11px; color: var(--text-sub); text-align: center; padding: 6px; display: flex; align-items: center; justify-content: center; gap: 6px; }
.sync-status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); display: inline-block; }
.sync-status .dot.syncing { background: var(--warning); animation: pulse 1s infinite; }
.sync-status .dot.error { background: #ef4444; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
.refresh-btn { background: none; border: none; color: var(--text-sub); font-size: 16px; cursor: pointer; padding: 4px 8px; }
.refresh-btn.spinning { animation: spin 1s linear infinite; }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

.filter-bar { display: flex; gap: 8px; margin-bottom: 10px; }
.filter-btn {
flex: 1; padding: 12px; border: 2px solid #ddd; border-radius: 10px;
background: var(--card-bg); color: var(--text); font-size: 13px; font-weight: 600;
cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; gap: 6px;
}
.filter-btn .count { background: rgba(0,0,0,0.1); padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; }
.filter-btn.active-non-traite { border-color: var(--danger); background: var(--danger); color: white; }
.filter-btn.active-non-traite .count { background: rgba(255,255,255,0.3); }
.filter-btn.active-traite { border-color: var(--success); background: var(--success); color: white; }
.filter-btn.active-traite .count { background: rgba(255,255,255,0.3); }

.cat-filter-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 15px; padding-bottom: 12px; border-bottom: 1px solid rgba(128,128,128,0.15); }
.cat-btn {
padding: 6px 10px; border: 2px solid #ddd; border-radius: 16px;
background: var(--card-bg); color: var(--text); font-size: 11px; font-weight: 600;
cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 4px;
}
.cat-btn .cat-count { background: rgba(0,0,0,0.1); padding: 1px 5px; border-radius: 8px; font-size: 10px; font-weight: 700; }
.cat-btn.active { border-color: var(--primary); background: var(--primary); color: white; }
.cat-btn.active .cat-count { background: rgba(255,255,255,0.3); }

.conv-card { background: var(--card-bg); border-radius: 12px; margin-bottom: 10px; box-shadow: var(--card-shadow); overflow: hidden; }
.conv-header { padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px; }
.conv-header.non-traite { background: rgba(220,53,69,0.1); }
.conv-header.traite { background: rgba(40,167,69,0.1); }
.conv-header strong { color: var(--text); font-size: 14px; }
.conv-header .conv-id { font-size: 11px; color: var(--text-sub); }
.conv-msg { padding: 8px 12px; border-bottom: 1px solid rgba(128,128,128,0.1); }
.conv-msg .msg-meta { font-size: 11px; color: var(--text-sub); margin-bottom: 2px; }
.conv-msg .msg-text { font-size: 14px; color: var(--text); }
.conv-actions { padding: 10px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.conv-actions button { padding: 8px 12px; border: none; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
.btn-repondre { background: var(--primary); color: white; }
.btn-clore { background: #6b7280; color: white; }
.btn-declore { background: var(--warning); color: white; }

/* Case à cocher "Vu" */
.vu-checkbox-wrapper {
display: flex;
align-items: center;
gap: 6px;
padding: 6px 10px;
background: var(--bg);
border-radius: 8px;
font-size: 12px;
cursor: pointer;
}
.vu-checkbox-wrapper input[type="checkbox"] {
width: 18px;
height: 18px;
accent-color: var(--success);
cursor: pointer;
}
.vu-checkbox-wrapper label {
cursor: pointer;
font-weight: 600;
color: var(--text);
}

.send-section { background: var(--card-bg); border-radius: 12px; padding: 14px; margin-bottom: 15px; box-shadow: var(--card-shadow); }
.send-section h3 { color: var(--text); font-size: 15px; margin-bottom: 12px; }
.msg-textarea { width: 100%; height: 100px; padding: 12px; border: 2px solid #ddd; border-radius: 10px; font-size: 14px; resize: vertical; outline: none; background: var(--bg); color: var(--text); margin-bottom: 10px; font-family: inherit; }
.msg-textarea:focus { border-color: var(--primary); }
.send-btn { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 6px; }
.send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.confirm-box { background: #d4edda; border-left: 4px solid var(--success); padding: 12px; border-radius: 8px; margin-top: 10px; font-size: 13px; color: #155724; }
.empty-state { text-align: center; padding: 30px 20px; color: var(--text-sub); font-size: 13px; }
.empty-state .empty-icon { font-size: 40px; margin-bottom: 10px; }

/* Sélection destinataires */
.dest-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.dest-panel { background: var(--bg); border-radius: 10px; padding: 10px; border: 2px solid #ddd; }
.dest-panel h4 { font-size: 12px; color: var(--text-sub); margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
.dest-list {
max-height: 400px; overflow-y: auto; background: var(--card-bg);
border-radius: 8px; padding: 6px; border: 1px solid rgba(128,128,128,0.2);
}
.dest-list .dest-item {
display: flex; align-items: center; gap: 6px; padding: 6px 8px;
font-size: 13px; cursor: pointer; border-radius: 4px;
}
.dest-list .dest-item:hover { background: rgba(26,58,107,0.08); }
.dest-list .dest-item input { accent-color: var(--primary); }

.statut-badge {
display: inline-block;
padding: 1px 5px;
border-radius: 4px;
font-size: 10px;
font-weight: 700;
letter-spacing: 0.5px;
margin-right: 6px;
background: #e5e7eb;
color: #374151;
}

.dest-actions { display: flex; gap: 8px; margin-bottom: 12px; }
.dest-actions button {
flex: 1; padding: 10px; border: none; border-radius: 8px;
font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s;
}
.btn-add { background: var(--success); color: white; }
.btn-remove { background: var(--danger); color: white; }

.statut-presel-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.statut-presel-btn {
padding: 8px 12px; border: 2px solid #ddd; border-radius: 16px;
background: var(--card-bg); color: var(--text); font-size: 12px; font-weight: 600;
cursor: pointer; transition: all 0.15s;
}
.statut-presel-btn:hover { border-color: var(--primary); background: rgba(26,58,107,0.05); }
.statut-presel-btn .count { background: rgba(0,0,0,0.1); padding: 1px 6px; border-radius: 8px; font-size: 10px; margin-left: 4px; }

.dest-count { font-size: 12px; color: var(--text-sub); text-align: center; padding: 6px; background: var(--bg); border-radius: 8px; margin-bottom: 10px; }
.dest-count strong { color: var(--primary); }

.cat-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.cat-chip {
padding: 8px 12px; border: 2px solid #ddd; border-radius: 16px;
background: var(--card-bg); color: var(--text); font-size: 12px; font-weight: 600;
cursor: pointer; transition: all 0.15s;
}
.cat-chip:hover { border-color: var(--primary); }
.cat-chip.active { border-color: var(--primary); background: var(--primary); color: white; }

@media (max-width: 480px) {
.dest-selector { grid-template-columns: 1fr; }
.dest-list { max-height: 250px; }
}
</style>
</head>
<body>
<div class="page-header">
<button class="back-btn" onclick="retourAccueil()">←</button>
<h2 id="messagerieTitle">Messagerie</h2>
<button class="refresh-btn" id="refreshBtn" onclick="forcerRafraichissement()">🔄</button>
</div>
<div class="sync-status">
<span class="dot" id="syncDot"></span>
<span id="syncText">Chargement...</span>
</div>
<div class="page-content" id="messagerieContent"></div>

<script src="../js/commun.js"></script>
<script>
// ============================================
// CONFIGURATION
// ============================================
const CATEGORIES = [
    { id: 'partenaire',   label: 'Partenaire',   icon: '🤝' },
    { id: 'stagiaire',    label: 'Stagiaire',    icon: '' },
    { id: 'organisation', label: 'Organisation', icon: '🏢' },
    { id: 'probleme',     label: 'Problème',     icon: '️' },
    { id: 'atelier',      label: 'Atelier',      icon: '' },
    { id: 'handicap',     label: 'Handicap',     icon: '♿' }
];

let filtreStatut = 'nonTraites';
let filtreCategorie = 'toutes';
let conversations = {};
let refreshTimer = null;
let allAdherents = [];
let statutsDisponibles = [];
let selectedDestinataires = new Set();

const adherent = verifierConnexionOuRediriger();

// ============================================
// UTILITAIRE : Formatage "ORGA - Prénom NOM"
// ============================================
function formatStatut(statut) {
    if (!statut) return '';
    return statut.substring(0, 4).toUpperCase();
}

function formatNomComplet(a) {
    // "ORGA - Sédric BLIN"
    return `${formatStatut(a.statut)} - ${a.prenom} ${a.nom}`;
}

function trierAdherentsParStatutPuisNom(liste) {
    return [...liste].sort((a, b) => {
        const compStatut = (a.statut || '').localeCompare(b.statut || '');
        if (compStatut !== 0) return compStatut;
        return (a.nom || '').localeCompare(b.nom || '');
    });
}

// ============================================
// CACHE
// ============================================
function chargerDepuisCache() {
    const cache = getMessagerieCache();
    if (cache && cache.data && cache.data.conversations) {
        conversations = cache.data.conversations;
        return true;
    }
    return false;
}

function formatTimeAgo(ts) {
    if (!ts) return 'jamais';
    const diff = Math.floor((Date.now() - ts) / 1000);
    if (diff < 10) return 'à l\'instant';
    if (diff < 60) return `il y a ${diff}s`;
    if (diff < 3600) return `il y a ${Math.floor(diff/60)}min`;
    return `il y a ${Math.floor(diff/3600)}h`;
}

// ============================================
// SYNCHRONISATION
// ============================================
async function synchroniserSilencieuse() {
    if (!adherent) return;
    try {
        const action = adherent.statut === 'Organisateur' ? 'getAllMessages' : 'getMyMessages';
        const resp = await fetch(SCRIPT_URL + '?action=' + action + '&userId=' + encodeURIComponent(adherent.id), { cache: 'no-store' });
        const data = await resp.json();
        if (data.success) {
            saveMessagerieCache(data);
            conversations = data.conversations;
            if (!messagerieFormulaireOuvert) {
                if (adherent.statut === 'Organisateur') renderOrganisateur();
                else renderParticipant();
            }
            updateSyncUI('ok', `Mis à jour ${formatTimeAgo(Date.now())}`);
        }
    } catch (e) {
        const cache = getMessagerieCache();
        if (cache) updateSyncUI('error', `Hors ligne — ${formatTimeAgo(cache.timestamp)}`);
    }
}

function forcerRafraichissement() {
    const btn = document.getElementById('refreshBtn');
    btn.classList.add('spinning');
    synchroniserSilencieuse().finally(() => {
        setTimeout(() => btn.classList.remove('spinning'), 500);
    });
}

function updateSyncUI(state, text) {
    const dot = document.getElementById('syncDot');
    const txt = document.getElementById('syncText');
    dot.className = 'dot';
    if (state === 'syncing') dot.classList.add('syncing');
    else if (state === 'error') dot.classList.add('error');
    txt.textContent = text;
}

window.addEventListener('messagerie-updated', (e) => {
    conversations = e.detail.conversations;
    if (!messagerieFormulaireOuvert) {
        if (adherent.statut === 'Organisateur') renderOrganisateur();
        else renderParticipant();
    }
    updateSyncUI('ok', `Mis à jour ${formatTimeAgo(Date.now())}`);
});

// ============================================
// UTILITAIRES
// ============================================
function texteEnCours() {
    const t = document.querySelectorAll('#messagerieContent textarea');
    for (const ta of t) { if (ta.value.trim().length > 0) return true; }
    return false;
}

function getCategorieInfo(catId) {
    return CATEGORIES.find(c => c.id === catId) || { id: 'defaut', label: catId || 'Sans catégorie', icon: '📋' };
}

function getCategorieBadgeHTML(catId) {
    const cat = getCategorieInfo(catId);
    return `<span style="display:inline-block;padding:2px 6px;border-radius:8px;font-size:10px;font-weight:600;background:#e5e7eb;color:#374151;margin-left:6px;">${cat.icon} ${cat.label}</span>`;
}

// ============================================
// CHARGEMENT LISTE ADHÉRENTS
// ============================================
async function chargerListeAdherents() {
    const cached = getAdherentsFromCache();
    if (cached) {
        allAdherents = cached.adherents;
        statutsDisponibles = cached.statuts;
        return;
    }
    try {
        const resp = await fetch(SCRIPT_URL + '?action=getAdherents&userId=' + encodeURIComponent(adherent.id));
        const data = await resp.json();
        if (data.success) {
            allAdherents = data.adherents;
            statutsDisponibles = data.statuts;
            saveAdherentsToCache({ adherents: data.adherents, statuts: data.statuts });
        }
    } catch (e) { console.warn('Erreur chargement adhérents:', e); }
}

// ============================================
// INITIALISATION
// ============================================
async function init() {
    if (!adherent) return;
    
    chargerDepuisCache();
    
    if (adherent.statut === 'Organisateur') {
        document.getElementById('messagerieTitle').textContent = '📨 Messages des participants';
        await chargerListeAdherents();
        renderOrganisateur();
    } else {
        document.getElementById('messagerieTitle').textContent = '💬 Contacter l\'AAMB';
        renderParticipant();
    }
    
    const cache = getMessagerieCache();
    if (cache) {
        updateSyncUI('ok', `Cache — ${formatTimeAgo(cache.timestamp)}`);
    } else {
        updateSyncUI('syncing', 'Premier chargement...');
    }
    
    synchroniserSilencieuse();
    
    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(() => {
        if (!texteEnCours() && !document.hidden && !messagerieFormulaireOuvert) {
            synchroniserSilencieuse();
        }
    }, 30000);
}

// ============================================
// RENDU PARTICIPANT (avec filtres Non traités/Traités basés sur "vu")
// ============================================
function renderParticipant() {
    const content = document.getElementById('messagerieContent');
    const keys = Object.keys(conversations);
    
    // Compter par statut "vu"
    let nbNonVus = 0, nbVus = 0;
    const catCounts = { 'toutes': 0, 'toutes_nv': 0, 'toutes_v': 0 };
    CATEGORIES.forEach(c => { catCounts[c.id] = 0; catCounts[c.id + '_nv'] = 0; catCounts[c.id + '_v'] = 0; });
    
    keys.forEach(convBase => {
        const msgs = conversations[convBase];
        if (!msgs || msgs.length === 0) return;
        const last = msgs[msgs.length - 1];
        const nonVu = last.vu !== 'OUI';
        const cat = last.categorie || 'defaut';
        
        if (nonVu) { nbNonVus++; catCounts['toutes_nv']++; if (catCounts[cat+'_nv'] !== undefined) catCounts[cat+'_nv']++; }
        else { nbVus++; catCounts['toutes_v']++; if (catCounts[cat+'_v'] !== undefined) catCounts[cat+'_v']++; }
        
        catCounts['toutes']++;
        if (catCounts[cat] !== undefined) catCounts[cat]++;
    });
    
    let html = '<button onclick="afficherFormulaireParticipant(null)" style="width:100%;padding:14px;background:#1a3a6b;color:white;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer;margin-bottom:12px;">✉️ Nouveau message</button>';
    
    // Niveau 1 : Filtres Non vus / Vus (comme les organisateurs)
    html += '<div class="filter-bar">';
    html += `<button class="filter-btn ${filtreStatut==='nonTraites'?'active-non-traite':''}" onclick="changerFiltreStatutParticipant('nonTraites')">🔴 Non lus <span class="count">${nbNonVus}</span></button>`;
    html += `<button class="filter-btn ${filtreStatut==='traites'?'active-traite':''}" onclick="changerFiltreStatutParticipant('traites')">✅ Lus <span class="count">${nbVus}</span></button>`;
    html += '</div>';
    
    // Niveau 2 : Filtres catégorie
    html += '<div class="cat-filter-bar">';
    const countToutes = filtreStatut === 'nonTraites' ? catCounts['toutes_nv'] : catCounts['toutes_v'];
    html += `<button class="cat-btn ${filtreCategorie==='toutes'?'active':''}" onclick="changerFiltreCategorieParticipant('toutes')"> Toutes <span class="cat-count">${countToutes}</span></button>`;
    CATEGORIES.forEach(c => {
        const count = filtreStatut === 'nonTraites' ? (catCounts[c.id+'_nv']||0) : (catCounts[c.id+'_v']||0);
        html += `<button class="cat-btn ${filtreCategorie===c.id?'active':''}" onclick="changerFiltreCategorieParticipant('${c.id}')">${c.icon} ${c.label} <span class="cat-count">${count}</span></button>`;
    });
    html += '</div>';
    
    // Filtrage combiné
    const convsFiltrees = {};
    keys.forEach(convBase => {
        const msgs = conversations[convBase];
        if (!msgs || msgs.length === 0) return;
        const last = msgs[msgs.length - 1];
        const nonVu = last.vu !== 'OUI';
        const cat = last.categorie || 'defaut';
        
        if (filtreStatut === 'nonTraites' && !nonVu) return;
        if (filtreStatut === 'traites' && nonVu) return;
        if (filtreCategorie !== 'toutes' && filtreCategorie !== cat) return;
        
        convsFiltrees[convBase] = msgs;
    });
    
    const convKeys = Object.keys(convsFiltrees);
    if (convKeys.length === 0) {
        let emptyIcon = '📭', emptyText = 'Aucun message';
        if (filtreStatut === 'nonTraites') { emptyIcon = ''; emptyText = 'Aucun message non lu'; }
        else if (filtreStatut === 'traites') { emptyIcon = ''; emptyText = 'Aucun message lu'; }
        if (filtreCategorie !== 'toutes') {
            const catInfo = getCategorieInfo(filtreCategorie);
            emptyText += ` dans ${catInfo.icon} ${catInfo.label}`;
        }
        html += `<div class="empty-state"><div class="empty-icon">${emptyIcon}</div>${emptyText}</div>`;
    } else {
        convKeys.forEach(convBase => {
            html += renderConvCardParticipant(convBase, convsFiltrees[convBase]);
        });
    }
    
    content.innerHTML = html;
}

function changerFiltreStatutParticipant(s) { filtreStatut = s; renderParticipant(); }
function changerFiltreCategorieParticipant(c) { filtreCategorie = c; renderParticipant(); }

function renderConvCardParticipant(convBase, msgs) {
    const sorted = msgs.sort((a,b) => a.idConvFull.localeCompare(b.idConvFull));
    const last = sorted[sorted.length - 1];
    const catBadge = getCategorieBadgeHTML(last.categorie);
    const nonVu = last.vu !== 'OUI';
    const reponseAutorisee = last.reponseAutorisee !== 'NON';
    
    let html = '<div class="conv-card" style="border-left:4px solid ' + (nonVu ? '#dc3545' : '#28a745') + ';">';
    html += '<div class="conv-header ' + (nonVu ? 'non-traite' : 'traite') + '">';
    html += '<div><strong>' + (nonVu ? '🔴 Non lu' : '✅ Lu') + '</strong>' + catBadge;
    html += '<span style="float:right;font-size:11px;color:var(--text-sub);">' + convBase + '</span></div></div>';
    
    sorted.forEach(m => {
        html += '<div class="conv-msg" style="background:' + (m.userId===adherent.id?'var(--card-bg)':'rgba(26,58,107,0.08)') + ';">';
        html += '<div class="msg-meta">' + (m.userId===adherent.id?'👤 Vous':'🏢 Organisation') + ' — ' + m.dateHeure + '</div>';
        html += '<div class="msg-text">' + m.message + '</div></div>';
    });
    
    // ✅ C'est ICI que se trouve la condition :
    html += '<div class="conv-actions">';
    
    if (reponseAutorisee) {
        // Si la réponse est autorisée : on affiche SEULEMENT le bouton répondre
        html += `<button class="btn-repondre" onclick="afficherFormulaireParticipant('${convBase}')">↩️ Répondre</button>`;
    } else {
        // Si la réponse N'EST PAS autorisée : on affiche la case "Vu" + le bandeau informatif
        html += `<div class="vu-checkbox-wrapper">
            <input type="checkbox" id="vu-${convBase}" ${nonVu ? '' : 'checked'} onchange="toggleVu('${convBase}', this.checked)">
            <label for="vu-${convBase}">${nonVu ? 'Marquer comme lu' : 'Lu'}</label>
        </div>`;
        html += '<div style="padding:6px 10px;background:rgba(245,158,11,0.1);border-radius:8px;font-size:11px;color:#92400e;font-weight:600;">📢 Message informatif</div>';
    }
    
    html += '</div>'; // Fin de conv-actions
    html += '</div>'; // Fin de conv-card
    return html;
}

async function toggleVu(convBase, estCoche) {
    if (!estCoche) return; // On ne peut pas "dé-cocher" (remettre en non-lu)
    try {
        const params = new URLSearchParams({ 
            action: 'marquerVu', 
            userId: adherent.id, 
            convId: convBase 
        });
        const resp = await fetch(SCRIPT_URL + '?' + params);
        const data = await resp.json();
        if (data.success) {
            // Mettre à jour le cache local immédiatement
            if (conversations[convBase]) {
                conversations[convBase].forEach(m => { m.vu = 'OUI'; });
            }
            saveMessagerieCache({ conversations: conversations });
            renderParticipant();
        }
    } catch (e) { console.warn('Erreur marquer vu:', e); }
}

function afficherFormulaireParticipant(convBase) {
    messagerieFormulaireOuvert = true;
    const content = document.getElementById('messagerieContent');
    
    let catChipsHTML = '';
    if (!convBase) {
        catChipsHTML = '<div style="font-size:13px;color:var(--text-sub);margin-bottom:6px;">Catégorie du message :</div>';
        catChipsHTML += '<div class="cat-chips" id="catChips">';
        CATEGORIES.forEach((c, idx) => {
            catChipsHTML += `<button class="cat-chip ${idx===0?'active':''}" data-cat="${c.id}" onclick="selectionnerCategorie(this)">${c.icon} ${c.label}</button>`;
        });
        catChipsHTML += '</div>';
    }
    
    let html = '<div style="margin-bottom:15px;"><button onclick="init()" style="background:none;border:none;color:#1a3a6b;font-size:16px;cursor:pointer;">← Retour</button></div>';
    html += '<div class="send-section">';
    html += '<h3>' + (convBase ? '↩️ Répondre — ' + convBase : '️ Nouveau message') + '</h3>';
    html += catChipsHTML;
    html += '<textarea id="msgTexte" class="msg-textarea" placeholder="Votre message..."></textarea>';
    html += '<button onclick="envoyerMessageParticipant(\'' + (convBase||'') + '\')" class="send-btn">📤 Envoyer</button>';
    html += '</div>';
    content.innerHTML = html;
}

function selectionnerCategorie(btn) {
    document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
}

async function envoyerMessageParticipant(convBase) {
    const texte = document.getElementById('msgTexte').value.trim();
    if (!texte) { alert('Veuillez écrire un message'); return; }
    
    const catBtn = document.querySelector('.cat-chip.active');
    const categorie = catBtn ? catBtn.dataset.cat : '';
    
    const content = document.getElementById('messagerieContent');
    content.innerHTML = '<p style="text-align:center;padding:40px;color:var(--text-sub);">⏳ Envoi en cours...</p>';
    
    try {
        const params = new URLSearchParams({ 
            action:'sendMessage', userId:adherent.id, nom:adherent.nom, prenom:adherent.prenom, 
            message:texte, categorie:categorie, convId:convBase||'', isOrganisateur:'false' 
        });
        const resp = await fetch(SCRIPT_URL + '?' + params);
        const data = await resp.json();
        if (data.success) {
            messagerieFormulaireOuvert = false;
            await synchroniserSilencieuse();
        } else { content.innerHTML = '<p style="color:red;text-align:center;padding:20px;">Erreur d\'envoi.</p>'; }
    } catch(e) { content.innerHTML = '<p style="color:red;text-align:center;padding:20px;">Erreur de connexion</p>'; }
}

// ============================================
// RENDU ORGANISATEUR
// ============================================
function renderOrganisateur() {
    const content = document.getElementById('messagerieContent');
    const keys = Object.keys(conversations);
    
    let nbNonTraites = 0, nbTraites = 0;
    const catCounts = { 'toutes': 0, 'toutes_nt': 0, 'toutes_t': 0 };
    CATEGORIES.forEach(c => { catCounts[c.id] = 0; catCounts[c.id + '_nt'] = 0; catCounts[c.id + '_t'] = 0; });
    
    keys.forEach(convBase => {
        const msgs = conversations[convBase];
        if (!msgs || msgs.length === 0) return;
        const last = msgs[msgs.length - 1];
        const nonTraite = last.traite === 'NON';
        const cat = last.categorie || 'defaut';
        
        if (nonTraite) { nbNonTraites++; catCounts['toutes_nt']++; if (catCounts[cat+'_nt'] !== undefined) catCounts[cat+'_nt']++; }
        else { nbTraites++; catCounts['toutes_t']++; if (catCounts[cat+'_t'] !== undefined) catCounts[cat+'_t']++; }
        
        catCounts['toutes']++;
        if (catCounts[cat] !== undefined) catCounts[cat]++;
    });
    
    let html = '<button onclick="afficherSectionEnvoi()" style="width:100%;padding:14px;background:#1a3a6b;color:white;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer;margin-bottom:12px;">✉️ Nouveau message</button>';
    
    html += '<div class="filter-bar">';
    html += `<button class="filter-btn ${filtreStatut==='nonTraites'?'active-non-traite':''}" onclick="changerFiltreStatut('nonTraites')">🔴 Non traités <span class="count">${nbNonTraites}</span></button>`;
    html += `<button class="filter-btn ${filtreStatut==='traites'?'active-traite':''}" onclick="changerFiltreStatut('traites')">✅ Traités <span class="count">${nbTraites}</span></button>`;
    html += '</div>';
    
    html += '<div class="cat-filter-bar">';
    const countToutes = filtreStatut === 'nonTraites' ? catCounts['toutes_nt'] : catCounts['toutes_t'];
    html += `<button class="cat-btn ${filtreCategorie==='toutes'?'active':''}" onclick="changerFiltreCategorie('toutes')">📋 Toutes <span class="cat-count">${countToutes}</span></button>`;
    CATEGORIES.forEach(c => {
        const count = filtreStatut === 'nonTraites' ? (catCounts[c.id+'_nt']||0) : (catCounts[c.id+'_t']||0);
        html += `<button class="cat-btn ${filtreCategorie===c.id?'active':''}" onclick="changerFiltreCategorie('${c.id}')">${c.icon} ${c.label} <span class="cat-count">${count}</span></button>`;
    });
    html += '</div>';
    
    const convsFiltrees = {};
    keys.forEach(convBase => {
        const msgs = conversations[convBase];
        if (!msgs || msgs.length === 0) return;
        const last = msgs[msgs.length - 1];
        const nonTraite = last.traite === 'NON';
        const cat = last.categorie || 'defaut';
        
        if (filtreStatut === 'nonTraites' && !nonTraite) return;
        if (filtreStatut === 'traites' && nonTraite) return;
        if (filtreCategorie !== 'toutes' && filtreCategorie !== cat) return;
        
        convsFiltrees[convBase] = msgs;
    });
    
    const convKeys = Object.keys(convsFiltrees);
    if (convKeys.length === 0) {
        let emptyIcon = '📭', emptyText = 'Aucune conversation';
        if (filtreStatut === 'nonTraites') { emptyIcon = '🎉'; emptyText = 'Aucun message en attente'; }
        else if (filtreStatut === 'traites') { emptyIcon = '📂'; emptyText = 'Aucun message traité'; }
        if (filtreCategorie !== 'toutes') {
            const catInfo = getCategorieInfo(filtreCategorie);
            emptyText += ` dans ${catInfo.icon} ${catInfo.label}`;
        }
        html += `<div class="empty-state"><div class="empty-icon">${emptyIcon}</div>${emptyText}</div>`;
    } else {
        convKeys.forEach(convBase => {
            html += renderConvCardOrga(convBase, convsFiltrees[convBase], convsFiltrees[convBase][convsFiltrees[convBase].length-1].traite === 'NON');
        });
    }
    
    content.innerHTML = html;
}

function changerFiltreStatut(s) { filtreStatut = s; renderOrganisateur(); }
function changerFiltreCategorie(c) { filtreCategorie = c; renderOrganisateur(); }

function renderConvCardOrga(convBase, msgs, nonTraite) {
    const sorted = msgs.sort((a,b) => a.idConvFull.localeCompare(b.idConvFull));
    const pm = sorted.find(m => m.userId !== adherent.id) || sorted[0];
    const last = sorted[sorted.length - 1];
    const catBadge = getCategorieBadgeHTML(last.categorie);
    
    let html = '<div class="conv-card" style="border-left:4px solid ' + (nonTraite ? '#dc3545' : '#28a745') + ';">';
    html += '<div class="conv-header ' + (nonTraite ? 'non-traite' : 'traite') + '">';
    // ✅ Format : "ORGA - Prénom NOM"
    html += '<div><strong>👤 ' + formatNomComplet(pm) + '</strong>' + catBadge;
    html += '<span class="conv-id">' + convBase + '</span></div></div>';
    
    sorted.forEach(m => {
        html += '<div class="conv-msg" style="background:' + (m.userId===adherent.id?'rgba(26,58,107,0.08)':'var(--card-bg)') + ';">';
        html += '<div class="msg-meta">' + (m.userId===adherent.id?'🏢 Vous':'👤 '+formatNomComplet(m)) + ' — ' + m.dateHeure + '</div>';
        html += '<div class="msg-text">' + m.message + '</div></div>';
    });
    
    if (nonTraite) {
        html += '<div class="conv-actions">';
        html += '<button class="btn-repondre" onclick="afficherReponseOrga(\'' + convBase + '\')">📤 Répondre</button>';
        html += '</div>';
    }
    html += '</div>';
    return html;
}

function afficherReponseOrga(convBase) {
    messagerieFormulaireOuvert = true;
    const content = document.getElementById('messagerieContent');
    let html = '<div style="margin-bottom:15px;"><button onclick="init()" style="background:none;border:none;color:#1a3a6b;font-size:16px;cursor:pointer;">← Retour</button></div>';
    html += '<div class="send-section"><h3>📤 Répondre — ' + convBase + '</h3>';
    html += '<textarea id="msgTexte" class="msg-textarea" placeholder="Votre réponse..."></textarea>';
    html += '<button onclick="envoyerReponseOrga(\'' + convBase + '\')" class="send-btn">📤 Envoyer</button></div>';
    content.innerHTML = html;
}

    if (!texte) { alert('Veuillez écrire une réponse'); return; }
    const content = document.getElementById('messagerieContent');

    } catch(e) { content.innerHTML = '<p style="color:red;text-align:center;padding:20px;">Erreur de connexion</p>'; }
}

// ============================================
// SECTION ENVOI ORGANISATEUR
// ============================================
function afficherSectionEnvoi() {
    messagerieFormulaireOuvert = true;
    selectedDestinataires.clear();
    
    const content = document.getElementById('messagerieContent');
    
    if (allAdherents.length === 0) {
        content.innerHTML = '<p style="text-align:center;padding:40px;color:var(--text-sub);">⏳ Chargement de la liste...</p>';
        chargerListeAdherents().then(() => {
            content.innerHTML = renderFormulaireEnvoiHTML();
            attacherEventsEnvoi();
        });
    } else {
        content.innerHTML = renderFormulaireEnvoiHTML();
        attacherEventsEnvoi();
    }
}

function renderFormulaireEnvoiHTML() {
    const countsByStatut = {};
    statutsDisponibles.forEach(s => { countsByStatut[s] = allAdherents.filter(a => a.statut === s).length; });
    
    const sortedAdherents = trierAdherentsParStatutPuisNom(allAdherents);
    
    // ✅ Format : "ORGA - Prénom NOM" dans les options
    const optionsHTML = sortedAdherents.map(a => 
        `<option value="${a.id}">${formatNomComplet(a)}</option>`
    ).join('');
    
    const preselButtonsHTML = statutsDisponibles.map(s => 
        `<button class="statut-presel-btn" onclick="preselectionnerStatut('${s}')">${s} <span class="count">${countsByStatut[s]||0}</span></button>`
    ).join('');
    
    const totalSansOrga = allAdherents.filter(a => a.statut !== 'Organisateur').length;
    const tousSansOrgaBtn = `<button class="statut-presel-btn" onclick="preselectionnerTousSaufOrga()" style="border-color:var(--primary);font-weight:700;">📢 TOUS (sauf orga) <span class="count">${totalSansOrga}</span></button>`;
    
    // ✅ Format : "ORGA - Prénom NOM" dans la liste destinataires
    const destListHTML = sortedAdherents
        .filter(a => selectedDestinataires.has(a.id))
        .map(a => `<label class="dest-item"><input type="checkbox" value="${a.id}" class="dest-checkbox" checked>${formatNomComplet(a)}</label>`)
        .join('') || '<div style="color:var(--text-sub);font-size:12px;text-align:center;padding:20px;">Aucun destinataire sélectionné</div>';
    
    return `
    <div style="margin-bottom:15px;">
        <button onclick="init()" style="background:none;border:none;color:#1a3a6b;font-size:16px;cursor:pointer;">← Retour aux messages</button>
    </div>
    <div class="send-section">
        <h3>✉️ Nouveau message</h3>
        
        <div style="font-size:12px;color:var(--text-sub);margin-bottom:6px;font-weight:600;">🏷️ Pré-sélectionner par statut :</div>
        <div class="statut-presel-bar">
            ${tousSansOrgaBtn}
            ${preselButtonsHTML}
        </div>
        
        <div class="dest-selector">
            <div class="dest-panel">
                <h4>📋 Liste des participants</h4>
                <select id="listeParticipants" class="dest-list" multiple size="16">
                    ${optionsHTML}
                </select>
            </div>
            <div class="dest-panel">
                <h4>✅ Destinataires (${selectedDestinataires.size})</h4>
                <div id="destinatairesList" class="dest-list">
                    ${destListHTML}
                </div>
            </div>
        </div>
        
        <div class="dest-actions">
            <button class="btn-add" onclick="ajouterSelectionnes()">➕ Ajouter à la liste</button>
            <button class="btn-remove" onclick="retirerSelectionnes()">➖ Retirer de la liste</button>
        </div>
        
        <div class="dest-count">📨 <strong>${selectedDestinataires.size}</strong> destinataire(s) dans la liste de diffusion</div>
        
        <div style="display:flex;align-items:center;gap:10px;padding:12px;background:var(--bg);border-radius:10px;margin-bottom:12px;border:2px solid #ddd;">
            <input type="checkbox" id="reponseAutorisee" checked style="width:20px;height:20px;accent-color:var(--primary);">
            <label for="reponseAutorisee" style="font-size:14px;color:var(--text);cursor:pointer;flex:1;">
                <strong>✉️ Autoriser les réponses</strong>
                <div style="font-size:11px;color:var(--text-sub);margin-top:2px;">Si décoché, le message sera marqué comme "informatif" et les destinataires ne pourront pas y répondre.</div>
            </label>
        </div>
        
        <textarea id="msgTexte" class="msg-textarea" placeholder="Votre message..."></textarea>
        
        <button class="send-btn" id="btnSend" onclick="envoyerMessageGroupe()">📤 Envoyer à ${selectedDestinataires.size} personne(s)</button>
    </div>`;
}

function attacherEventsEnvoi() {
    updateDestCount();
}

function preselectionnerTousSaufOrga() {
    const select = document.getElementById('listeParticipants');
    if (!select) return;
    Array.from(select.options).forEach(opt => opt.selected = false);
    allAdherents.filter(a => a.statut !== 'Organisateur').forEach(a => {
        const opt = select.querySelector(`option[value="${a.id}"]`);
        if (opt) opt.selected = true;
    });
}

function preselectionnerStatut(statut) {
    const select = document.getElementById('listeParticipants');
    if (!select) return;
    Array.from(select.options).forEach(opt => opt.selected = false);
    allAdherents.filter(a => a.statut === statut).forEach(a => {
        const opt = select.querySelector(`option[value="${a.id}"]`);
        if (opt) opt.selected = true;
    });
}

function ajouterSelectionnes() {
    const select = document.getElementById('listeParticipants');
    if (!select) return;
    let ajoutes = 0;
    Array.from(select.selectedOptions).forEach(opt => {
        if (!selectedDestinataires.has(opt.value)) {
            selectedDestinataires.add(opt.value);
            ajoutes++;
        }
    });
    Array.from(select.options).forEach(opt => opt.selected = false);
    refreshDestinatairesList();
    if (ajoutes > 0) {
        const btn = document.querySelector('.btn-add');
        const originalText = btn.textContent;
        btn.textContent = `✅ ${ajoutes} ajouté(s)`;
        setTimeout(() => { btn.textContent = originalText; }, 1000);
    }
}

function retirerSelectionnes() {
    const checkboxes = document.querySelectorAll('.dest-checkbox:checked');
    if (checkboxes.length === 0) {
        alert('Veuillez sélectionner au moins un destinataire à retirer');
        return;
    }
    let retires = 0;
    checkboxes.forEach(cb => {
        selectedDestinataires.delete(cb.value);
        retires++;
    });
    refreshDestinatairesList();
    const btn = document.querySelector('.btn-remove');
    const originalText = btn.textContent;
    btn.textContent = `✅ ${retires} retiré(s)`;
    setTimeout(() => { btn.textContent = originalText; }, 1000);
}

function refreshDestinatairesList() {
    const destList = document.getElementById('destinatairesList');
    if (!destList) return;
    const sortedAdherents = trierAdherentsParStatutPuisNom(allAdherents);
    const destListHTML = sortedAdherents
        .filter(a => selectedDestinataires.has(a.id))
        .map(a => `<label class="dest-item"><input type="checkbox" value="${a.id}" class="dest-checkbox" checked>${formatNomComplet(a)}</label>`)
        .join('') || '<div style="color:var(--text-sub);font-size:12px;text-align:center;padding:20px;">Aucun destinataire sélectionné</div>';
    destList.innerHTML = destListHTML;
    updateDestCount();
}

function updateDestCount() {
    const countEl = document.querySelector('.dest-count');
    const btnSend = document.getElementById('btnSend');
    const nb = selectedDestinataires.size;
    if (countEl) countEl.innerHTML = `📨 <strong>${nb}</strong> destinataire(s) dans la liste de diffusion`;
    if (btnSend) btnSend.textContent = ` Envoyer à ${nb} personne(s)`;
    const destPanelTitle = document.querySelector('#destinatairesList')?.previousElementSibling;
    if (destPanelTitle) destPanelTitle.innerHTML = `✅ Destinataires (${nb})`;
}

async function envoyerMessageGroupe() {
    const texte = document.getElementById('msgTexte').value.trim();
    if (!texte) { alert('Veuillez écrire un message'); return; }
    if (selectedDestinataires.size === 0) { alert('Veuillez sélectionner au moins un destinataire'); return; }
    
    const reponseAutoriseeCheckbox = document.getElementById('reponseAutorisee');
    const reponseAutorisee = reponseAutoriseeCheckbox ? reponseAutoriseeCheckbox.checked : true;
    
    const btn = document.getElementById('btnSend');
    btn.disabled = true;
    btn.textContent = '⏳ Envoi en cours...';
    
    const destinataires = allAdherents.filter(a => selectedDestinataires.has(a.id));
    const destIds = destinataires.map(d => d.id).join(',');
    
    const content = document.getElementById('messagerieContent');
    content.innerHTML = `
        <div style="margin-bottom:15px;">
            <button onclick="init()" style="background:none;border:none;color:#1a3a6b;font-size:16px;cursor:pointer;">← Retour</button>
        </div>
        <div class="send-section">
            <h3>📤 Envoi groupé en cours...</h3>
            <div style="text-align:center;padding:20px;">
                <div style="font-size:48px;margin-bottom:10px;"></div>
                <div style="font-size:16px;color:var(--text);">Envoi à <strong>${destinataires.length}</strong> destinataire(s)...</div>
                <div style="font-size:13px;color:var(--text-sub);margin-top:8px;">${reponseAutorisee ? '✉️ Réponses autorisées' : '📢 Message informatif (sans réponse)'}</div>
            </div>
        </div>
    `;
    
    try {
        const params = new URLSearchParams({ 
            action: 'sendBulkMessage',
            userId: adherent.id,
            nom: adherent.nom,
            prenom: adherent.prenom,
            message: texte,
            categorie: 'organisation',
            destIds: destIds,
            reponseAutorisee: reponseAutorisee ? 'true' : 'false',
            isOrganisateur: 'true'
        });
        
        const resp = await fetch(SCRIPT_URL + '?' + params);
        const data = await resp.json();
        
        if (data.success) {
            messagerieFormulaireOuvert = false;
            selectedDestinataires.clear();
            
            content.innerHTML = `
                <div class="confirm-box">
                    ✅ Envoi groupé terminé !<br>
                    <strong>${data.nbMessages}</strong> message(s) envoyé(s) en une seule opération<br>
                    ${reponseAutorisee ? '✉️ Les destinataires peuvent répondre' : ' Message informatif - réponses désactivées'}
                </div>
                <button onclick="init()" class="send-btn" style="margin-top:15px;">← Retour aux messages</button>
            `;
        } else {
            content.innerHTML = `<p style="color:red;text-align:center;padding:20px;">Erreur : ${data.message || 'inconnue'}</p>
                <button onclick="init()" class="send-btn" style="margin-top:15px;">← Retour</button>`;
        }
    } catch(e) {
        content.innerHTML = `<p style="color:red;text-align:center;padding:20px;">Erreur de connexion</p>
            <button onclick="init()" class="send-btn" style="margin-top:15px;">← Retour</button>`;
    }
}

// ============================================
// VISIBILITÉ & NETTOYAGE
// ============================================
document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; } }
    else {
        synchroniserSilencieuse();
        if (!refreshTimer) {
            refreshTimer = setInterval(() => {
                if (!texteEnCours() && !document.hidden && !messagerieFormulaireOuvert) synchroniserSilencieuse();
            }, 30000);
        }
    }
});
window.addEventListener('beforeunload', () => { if (refreshTimer) clearInterval(refreshTimer); });

// ============================================
// DÉMARRAGE
// ============================================
init();
</script>
</body>
</html>
