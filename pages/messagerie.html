<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messagerie v0.23</title>
<link rel="manifest" href="../manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    background-color: #050811;
    background-image:
        radial-gradient(circle at 15% 15%, rgba(0, 242, 254, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 60%, rgba(255, 0, 127, 0.06) 0%, transparent 40%),
        linear-gradient(to bottom, rgba(5, 8, 17, 0.95), rgba(5, 8, 17, 0.98));
    background-attachment: fixed;
    color: #e2e8f0;
}
body::before {
    content: '';
    position: fixed; inset: 0;
    pointer-events: none; z-index: 0;
    background-size: 40px 40px;
    background-image:
        linear-gradient(to right, rgba(56, 189, 248, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(56, 189, 248, 0.04) 1px, transparent 1px);
}

.glass-panel {
    background: rgba(13, 22, 41, 0.65);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(56, 189, 248, 0.18);
}

/* ==== HEADER ==== */
.page-header {
    position: sticky; top: 0; z-index: 50;
    background: rgba(13, 22, 41, 0.85);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(0, 242, 254, 0.25);
    color: white;
    padding: 12px 16px;
    display: flex; align-items: center; gap: 12px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
}
.back-btn {
    background: rgba(0, 242, 254, 0.1);
    border: 1px solid rgba(0, 242, 254, 0.3);
    color: #00f2fe;
    width: 36px; height: 36px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.25s;
    display: flex; align-items: center; justify-content: center;
}
.back-btn:hover { background: rgba(0, 242, 254, 0.25); color: white; box-shadow: 0 0 12px rgba(0, 242, 254, 0.4); }
.page-header h2 {
    font-family: 'Orbitron', sans-serif;
    font-size: 16px;
    letter-spacing: 2px;
    text-transform: uppercase;
    flex: 1;
}
.page-header h2 .cyan { color: #00f2fe; text-shadow: 0 0 10px rgba(0, 242, 254, 0.6); }
.refresh-btn {
    background: rgba(0, 242, 254, 0.1);
    border: 1px solid rgba(0, 242, 254, 0.3);
    color: #00f2fe;
    width: 36px; height: 36px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.25s;
    display: flex; align-items: center; justify-content: center;
}
.refresh-btn:hover { background: rgba(0, 242, 254, 0.25); color: white; }
.refresh-btn.spinning { animation: spin 1s linear infinite; }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

/* ==== SYNC STATUS ==== */
.sync-status {
    font-size: 11px;
    color: #64748b;
    text-align: center;
    padding: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-family: 'Rajdhani', sans-serif;
    letter-spacing: 0.5px;
}
.sync-status .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #10b981;
    box-shadow: 0 0 8px #10b981;
    display: inline-block;
}
.sync-status .dot.syncing { background: #f59e0b; box-shadow: 0 0 8px #f59e0b; animation: pulse 1s infinite; }
.sync-status .dot.error { background: #ef4444; box-shadow: 0 0 8px #ef4444; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

.page-content { position: relative; z-index: 1; padding: 16px; max-width: 900px; margin: 0 auto; }

/* ==== FILTERS ==== */
.filter-sticky-wrapper {
    position: sticky;
    top: 70px;
    background: rgba(5, 8, 17, 0.95);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 12px 0;
    z-index: 80;
    border-bottom: 1px solid rgba(0, 242, 254, 0.15);
}
.filter-bar { display: flex; gap: 8px; margin-bottom: 10px; }
.filter-btn {
    flex: 1;
    padding: 12px;
    border: 2px solid rgba(56, 189, 248, 0.25);
    border-radius: 10px;
    background: rgba(13, 22, 41, 0.65);
    color: #e2e8f0;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-family: 'Rajdhani', sans-serif;
    letter-spacing: 0.5px;
}
.filter-btn .count {
    background: rgba(0, 242, 254, 0.15);
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 700;
    color: #00f2fe;
}
.filter-btn.active-non-traite {
    border-color: #ff007f;
    background: rgba(255, 0, 127, 0.25);
    color: white;
    box-shadow: 0 0 15px rgba(255, 0, 127, 0.35);
}
.filter-btn.active-non-traite .count { background: rgba(255, 255, 255, 0.25); color: white; }
.filter-btn.active-traite {
    border-color: #10b981;
    background: rgba(16, 185, 129, 0.25);
    color: white;
    box-shadow: 0 0 15px rgba(16, 185, 129, 0.35);
}
.filter-btn.active-traite .count { background: rgba(255, 255, 255, 0.25); color: white; }
.filter-btn.active-cloture {
    border-color: #6b7280;
    background: rgba(107, 114, 128, 0.25);
    color: white;
}
.filter-btn.active-cloture .count { background: rgba(255, 255, 255, 0.25); color: white; }

.cat-filter-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 0; }
.cat-btn {
    padding: 6px 10px;
    border: 1px solid rgba(56, 189, 248, 0.25);
    border-radius: 16px;
    background: rgba(13, 22, 41, 0.65);
    color: #e2e8f0;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 4px;
    font-family: 'Rajdhani', sans-serif;
}
.cat-btn .cat-count {
    background: rgba(0, 242, 254, 0.15);
    padding: 1px 5px;
    border-radius: 8px;
    font-size: 10px;
    font-weight: 700;
    color: #00f2fe;
}
.cat-btn.active {
    border-color: #00f2fe;
    background: rgba(0, 242, 254, 0.25);
    color: white;
    box-shadow: 0 0 12px rgba(0, 242, 254, 0.35);
}
.cat-btn.active .cat-count { background: rgba(255, 255, 255, 0.25); color: white; }

/* ==== CONVERSATION CARDS ==== */
.conv-card {
    border-radius: 12px;
    margin-bottom: 12px;
    overflow: hidden;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(56, 189, 248, 0.18);
}
.conv-header {
    padding: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px;
    border-bottom: 1px solid rgba(56, 189, 248, 0.1);
}
.conv-header.non-traite { background: rgba(255, 0, 127, 0.08); }
.conv-header.traite { background: rgba(16, 185, 129, 0.08); }
.conv-header.cloture { background: rgba(107, 114, 128, 0.08); }
.conv-header strong { color: #f1f5f9; font-size: 14px; font-family: 'Rajdhani', sans-serif; font-weight: 700; letter-spacing: 0.3px; }
.conv-header .conv-id { font-size: 11px; color: #64748b; font-family: monospace; }
.conv-msg {
    padding: 10px 12px;
    border-bottom: 1px solid rgba(56, 189, 248, 0.08);
    background: rgba(5, 8, 17, 0.4);
}
.conv-msg:nth-child(even) { background: rgba(13, 22, 41, 0.4); }
.conv-msg .msg-meta { font-size: 11px; color: #64748b; margin-bottom: 4px; font-family: 'Rajdhani', sans-serif; letter-spacing: 0.3px; }
.conv-msg .msg-text { font-size: 14px; color: #e2e8f0; line-height: 1.5; }
.conv-actions {
    padding: 10px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    background: rgba(5, 8, 17, 0.6);
}
.conv-actions button {
    padding: 9px 14px;
    border: none;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Rajdhani', sans-serif;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    transition: all 0.2s;
}
.btn-repondre {
    background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
    color: #0a0f1f;
    box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
}
.btn-repondre:hover { box-shadow: 0 0 18px rgba(0, 242, 254, 0.5); transform: translateY(-1px); }
.btn-clore {
    background: rgba(107, 114, 128, 0.25);
    color: white;
    border: 1px solid rgba(107, 114, 128, 0.5);
}
.btn-clore:hover { background: rgba(107, 114, 128, 0.4); }
.btn-declore {
    background: rgba(245, 158, 11, 0.25);
    color: #fbbf24;
    border: 1px solid rgba(245, 158, 11, 0.5);
}
.btn-declore:hover { background: rgba(245, 158, 11, 0.4); }
.vu-checkbox-wrapper {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    background: rgba(16, 185, 129, 0.12);
    border: 1px solid rgba(16, 185, 129, 0.3);
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
}
.vu-checkbox-wrapper input[type="checkbox"] {
    width: 18px; height: 18px;
    accent-color: #10b981;
    cursor: pointer;
}
.vu-checkbox-wrapper label { cursor: pointer; font-weight: 600; color: #10b981; font-family: 'Rajdhani', sans-serif; }

/* ==== SEND SECTION ==== */
.send-section {
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 15px;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.3);
}
.send-section h3 {
    color: #00f2fe;
    font-size: 16px;
    margin-bottom: 14px;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
}
.msg-textarea {
    width: 100%;
    height: 100px;
    padding: 12px;
    border: 2px solid rgba(0, 242, 254, 0.25);
    border-radius: 10px;
    font-size: 14px;
    resize: vertical;
    outline: none;
    background: rgba(5, 8, 17, 0.6);
    color: #e2e8f0;
    margin-bottom: 10px;
    font-family: inherit;
    transition: border-color 0.25s, box-shadow 0.25s;
}
.msg-textarea:focus { border-color: #00f2fe; box-shadow: 0 0 15px rgba(0, 242, 254, 0.25); }
.msg-textarea::placeholder { color: #475569; }
.send-btn {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
    color: #0a0f1f;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 6px;
    font-family: 'Rajdhani', sans-serif;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
    transition: all 0.25s;
}
.send-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 0 22px rgba(0, 242, 254, 0.5); }
.send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.confirm-box {
    background: rgba(16, 185, 129, 0.15);
    border-left: 4px solid #10b981;
    padding: 14px;
    border-radius: 8px;
    margin-top: 10px;
    font-size: 13px;
    color: #86efac;
    box-shadow: 0 0 15px rgba(16, 185, 129, 0.25);
}
.empty-state {
    text-align: center;
    padding: 40px 20px;
    color: #64748b;
    font-size: 13px;
}
.empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; color: rgba(0, 242, 254, 0.35); }

/* ==== DEST SELECTOR (envoi groupé) ==== */
.dest-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.dest-panel {
    background: rgba(5, 8, 17, 0.5);
    border-radius: 10px;
    padding: 12px;
    border: 1px solid rgba(56, 189, 248, 0.25);
}
.dest-panel h4 {
    font-size: 12px;
    color: #00f2fe;
    margin-bottom: 8px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-family: 'Rajdhani', sans-serif;
}
.dest-list {
    max-height: 400px;
    overflow-y: auto;
    background: rgba(13, 22, 41, 0.65);
    border-radius: 8px;
    padding: 6px;
    border: 1px solid rgba(56, 189, 248, 0.18);
}
.dest-list .dest-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    font-size: 13px;
    cursor: pointer;
    border-radius: 6px;
    transition: background 0.2s;
}
.dest-list .dest-item:hover { background: rgba(0, 242, 254, 0.08); }
.dest-list .dest-item input { accent-color: #00f2fe; width: 18px; height: 18px; }
.statut-badge {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.5px;
    margin-right: 6px;
    background: rgba(0, 242, 254, 0.15);
    color: #00f2fe;
    border: 1px solid rgba(0, 242, 254, 0.3);
}
.dest-actions { display: flex; gap: 8px; margin-bottom: 12px; }
.dest-actions button {
    flex: 1;
    padding: 11px;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Rajdhani', sans-serif;
    letter-spacing: 0.5px;
    text-transform: uppercase;
}
.btn-add {
    background: rgba(16, 185, 129, 0.25);
    color: #10b981;
    border: 1px solid rgba(16, 185, 129, 0.5);
}
.btn-add:hover { background: rgba(16, 185, 129, 0.4); }
.btn-remove {
    background: rgba(255, 0, 127, 0.25);
    color: #ff8ec7;
    border: 1px solid rgba(255, 0, 127, 0.5);
}
.btn-remove:hover { background: rgba(255, 0, 127, 0.4); }
.statut-presel-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.statut-presel-btn {
    padding: 8px 12px;
    border: 1px solid rgba(56, 189, 248, 0.3);
    border-radius: 16px;
    background: rgba(13, 22, 41, 0.65);
    color: #e2e8f0;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Rajdhani', sans-serif;
}
.statut-presel-btn:hover { border-color: #00f2fe; background: rgba(0, 242, 254, 0.08); }
.statut-presel-btn .count {
    background: rgba(0, 242, 254, 0.15);
    padding: 1px 6px;
    border-radius: 8px;
    font-size: 10px;
    margin-left: 4px;
    color: #00f2fe;
}
.dest-count {
    font-size: 13px;
    color: #94a3b8;
    text-align: center;
    padding: 10px;
    background: rgba(5, 8, 17, 0.5);
    border-radius: 8px;
    margin-bottom: 12px;
    border: 1px solid rgba(56, 189, 248, 0.15);
}
.dest-count strong { color: #00f2fe; font-size: 16px; }
.cat-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.cat-chip {
    padding: 9px 14px;
    border: 1px solid rgba(56, 189, 248, 0.3);
    border-radius: 16px;
    background: rgba(13, 22, 41, 0.65);
    color: #e2e8f0;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Rajdhani', sans-serif;
}
.cat-chip:hover { border-color: #00f2fe; background: rgba(0, 242, 254, 0.08); }
.cat-chip.active {
    border-color: #00f2fe;
    background: rgba(0, 242, 254, 0.25);
    color: white;
    box-shadow: 0 0 12px rgba(0, 242, 254, 0.35);
}

@media (max-width: 768px) {
    .dest-selector { grid-template-columns: 1fr; }
    .dest-list { max-height: 250px; }
    .filter-sticky-wrapper { top: 70px; }
}
</style>
</head>
<body>
<div class="page-header">
    <button class="back-btn" onclick="retourAccueil()"><i class="fa-solid fa-arrow-left"></i></button>
    <h2 id="messagerieTitle">Messagerie</h2>
    <button class="refresh-btn" id="refreshBtn" onclick="forcerRafraichissement()"><i class="fa-solid fa-arrows-rotate"></i></button>
</div>
<div class="sync-status">
    <span class="dot" id="syncDot"></span>
    <span id="syncText">Chargement...</span>
</div>
<div class="page-content" id="messagerieContent"></div>

<script src="../js/commun.js"></script>
<script>
// ============================================
// FILETS DE SÉCURITÉ : si commun.js est cassé ou absent
// ============================================
if (typeof SCRIPT_URL === 'undefined') {
    window.SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxPaLIE0rlYV9VPLboL1ysI38E1GY6D8I6-eZJnZBr_UNhUt86i3Zv64WuondDbyt2ymw/exec';
}
if (typeof chargerAdherent !== 'function') {
    window.chargerAdherent = function() {
        try { return JSON.parse(localStorage.getItem('aamb_adherent')); } catch (e) { return null; }
    };
}
if (typeof verifierConnexionOuRediriger !== 'function') {
    window.verifierConnexionOuRediriger = function() {
        const a = chargerAdherent();
        if (!a) { window.location.href = '../app.html'; return null; }
        return a;
    };
}
if (typeof getMessagerieCache !== 'function') {
    window.getMessagerieCache = function() {
        try {
            const c = JSON.parse(localStorage.getItem('aamb_messagerie_cache'));
            const a = chargerAdherent();
            if (!a || !c || c.userId !== a.id) return null;
            return c;
        } catch (e) { return null; }
    };
}
if (typeof saveMessagerieCache !== 'function') {
    window.saveMessagerieCache = function(d) {
        try {
            const a = chargerAdherent();
            if (a) localStorage.setItem('aamb_messagerie_cache', JSON.stringify({ userId: a.id, timestamp: Date.now(), data: d }));
        } catch (e) {}
    };
}
if (typeof getAdherentsFromCache !== 'function') {
    window.getAdherentsFromCache = function() {
        try {
            const c = JSON.parse(localStorage.getItem('aamb_adherents_cache'));
            if (!c || Date.now() - c.timestamp > 3600000) return null;
            return c.data;
        } catch (e) { return null; }
    };
}
if (typeof saveAdherentsToCache !== 'function') {
    window.saveAdherentsToCache = function(d) {
        try { localStorage.setItem('aamb_adherents_cache', JSON.stringify({ timestamp: Date.now(), data: d })); } catch (e) {}
    };
}
if (typeof messagerieFormulaireOuvert === 'undefined') {
    window.messagerieFormulaireOuvert = false;
}

function avecTimeout(promise, ms) {
    return Promise.race([
        promise,
        new Promise((_, reject) => setTimeout(() => reject(new Error('Délai dépassé (' + ms + 'ms)')), ms))
    ]);
}

const CATEGORIES = [
    { id: 'partenaire', label: 'Partenaire', icon: '🤝' }, { id: 'stagiaire', label: 'Stagiaire', icon: '🎓' },
    { id: 'organisation', label: 'Organisation', icon: '🏢' }, { id: 'probleme', label: 'Problème', icon: '⚠️' },
    { id: 'atelier', label: 'Atelier', icon: '🔬' }, { id: 'handicap', label: 'Handicap', icon: '♿' }
];

let filtreStatut = 'nonTraites';
let filtreCategorie = 'toutes';
let conversations = {};
let refreshTimer = null;
let allAdherents = [];
let statutsDisponibles = [];
let selectedDestinataires = new Set();
const adherent = verifierConnexionOuRediriger();

function formatStatut(statut) { if (!statut) return ''; return statut.substring(0, 4).toUpperCase(); }
function formatNomComplet(a) { return `${formatStatut(a.statut)} - ${a.prenom} ${a.nom}`; }
function trierAdherentsParStatutPuisNom(liste) {
    return [...liste].sort((a, b) => {
        const compStatut = (a.statut || '').localeCompare(b.statut || '');
        if (compStatut !== 0) return compStatut;
        return (a.nom || '').localeCompare(b.nom || '');
    });
}

function chargerDepuisCache() {
    const cache = getMessagerieCache();
    if (cache && cache.data && cache.data.conversations) { conversations = cache.data.conversations; return true; }
    return false;
}

function formatTimeAgo(ts) {
    if (!ts) return 'jamais';
    const diff = Math.floor((Date.now() - ts) / 1000);
    if (diff < 10) return 'à l\'instant';
    if (diff < 60) return `il y a ${diff}s`;
    if (diff < 3600) return `il y a ${Math.floor(diff/60)}min`;
    return `il y a ${Math.floor(diff/3600)}h`;
}

async function synchroniserSilencieuse() {
    if (!adherent) return;
    try {
        const action = adherent.statut === 'Organisateur' ? 'getAllMessages' : 'getMyMessages';
        const resp = await fetch(SCRIPT_URL + '?action=' + action + '&userId=' + encodeURIComponent(adherent.id), { cache: 'no-store' });
        const data = await resp.json();
        if (data.success) {
            saveMessagerieCache(data);
            conversations = data.conversations;
            if (!messagerieFormulaireOuvert) {
                if (adherent.statut === 'Organisateur') renderOrganisateur();
                else renderParticipant();
            }
            updateSyncUI('ok', `Mis à jour ${formatTimeAgo(Date.now())}`);
        }
    } catch (e) {
        console.warn('[Messagerie] synchro échouée:', e);
        const cache = getMessagerieCache();
        if (cache) updateSyncUI('error', `Hors ligne — ${formatTimeAgo(cache.timestamp)}`);
    }
}

function forcerRafraichissement() {
    const btn = document.getElementById('refreshBtn');
    btn.classList.add('spinning');
    avecTimeout(synchroniserSilencieuse(), 20000).finally(() => { setTimeout(() => btn.classList.remove('spinning'), 500); });
}

function updateSyncUI(state, text) {
    const dot = document.getElementById('syncDot');
    const txt = document.getElementById('syncText');
    if (!dot || !txt) return;
    dot.className = 'dot';
    if (state === 'syncing') dot.classList.add('syncing');
    else if (state === 'error') dot.classList.add('error');
    txt.textContent = text;
}

window.addEventListener('messagerie-updated', (e) => {
    conversations = e.detail.conversations;
    if (!messagerieFormulaireOuvert) {
        if (adherent.statut === 'Organisateur') renderOrganisateur();
        else renderParticipant();
    }
    updateSyncUI('ok', `Mis à jour ${formatTimeAgo(Date.now())}`);
});

function texteEnCours() {
    const t = document.querySelectorAll('#messagerieContent textarea');
    for (const ta of t) { if (ta.value.trim().length > 0) return true; }
    return false;
}

function getCategorieInfo(catId) {
    return CATEGORIES.find(c => c.id === catId) || { id: 'defaut', label: catId || 'Sans catégorie', icon: '📋' };
}
function getCategorieBadgeHTML(catId) {
    const cat = getCategorieInfo(catId);
    return `<span style="display:inline-block;padding:3px 8px;border-radius:8px;font-size:10px;font-weight:700;background:rgba(0,242,254,0.15);color:#00f2fe;margin-left:6px;border:1px solid rgba(0,242,254,0.3);">${cat.icon} ${cat.label}</span>`;
}

async function chargerListeAdherents() {
    const cached = getAdherentsFromCache();
    if (cached) { allAdherents = cached.adherents; statutsDisponibles = cached.statuts; return; }
    const resp = await fetch(SCRIPT_URL + '?action=getAdherents&userId=' + encodeURIComponent(adherent.id));
    const data = await resp.json();
    if (data.success) {
        allAdherents = data.adherents; statutsDisponibles = data.statuts;
        saveAdherentsToCache({ adherents: data.adherents, statuts: data.statuts });
    }
}

async function init() {
    console.log('[Messagerie] init() démarrage, statut:', adherent ? adherent.statut : 'aucun');
    try {
        if (!adherent) return;

        const hadCache = chargerDepuisCache();
        console.log('[Messagerie] cache utilisé:', hadCache, '- conversations:', Object.keys(conversations).length);

        if (adherent.statut === 'Organisateur') {
            document.getElementById('messagerieTitle').innerHTML = '📨 Messages des <span class="cyan">participants</span>';
            renderOrganisateur();
            avecTimeout(chargerListeAdherents(), 10000).catch(e => console.warn('[Messagerie] liste adhérents non chargée:', e.message));
        } else {
            document.getElementById('messagerieTitle').innerHTML = '💬 Contacter l\'<span class="cyan">AAMB</span>';
            renderParticipant();
        }

        const cache = getMessagerieCache();
        if (cache) updateSyncUI('ok', `Cache — ${formatTimeAgo(cache.timestamp)}`);
        else updateSyncUI('syncing', 'Premier chargement...');

        avecTimeout(synchroniserSilencieuse(), 20000).catch(e => {
            console.error('[Messagerie] synchro:', e.message);
            updateSyncUI('error', 'Erreur de synchro');
        });

        if (refreshTimer) clearInterval(refreshTimer);
        refreshTimer = setInterval(() => {
            if (!texteEnCours() && !document.hidden && !messagerieFormulaireOuvert) synchroniserSilencieuse();
        }, 30000);
    } catch (e) {
        console.error('[Messagerie] ERREUR init():', e);
        updateSyncUI('error', 'Erreur: ' + e.message);
    }
}

function renderParticipant() {
    const content = document.getElementById('messagerieContent');
    const keys = Object.keys(conversations);
    let nbNonTraites = 0, nbTraites = 0, nbClotures = 0;
    const catCounts = { 'toutes': 0, 'toutes_nt': 0, 'toutes_t': 0, 'toutes_c': 0 };
    CATEGORIES.forEach(c => { catCounts[c.id] = 0; catCounts[c.id + '_nt'] = 0; catCounts[c.id + '_t'] = 0; catCounts[c.id + '_c'] = 0; });
    keys.forEach(convBase => {
        const msgs = conversations[convBase];
        if (!msgs || msgs.length === 0) return;
        const last = msgs[msgs.length - 1];
        const cat = last.categorie || 'defaut';
        if (last.traite === 'NON') { nbNonTraites++; catCounts['toutes_nt']++; if (catCounts[cat+'_nt'] !== undefined) catCounts[cat+'_nt']++; }
        else if (last.traite === 'OUI') { nbTraites++; catCounts['toutes_t']++; if (catCounts[cat+'_t'] !== undefined) catCounts[cat+'_t']++; }
        else if (last.traite === 'CLOS') { nbClotures++; catCounts['toutes_c']++; if (catCounts[cat+'_c'] !== undefined) catCounts[cat+'_c']++; }
        catCounts['toutes']++;
        if (catCounts[cat] !== undefined) catCounts[cat]++;
    });
    let html = '<div class="filter-sticky-wrapper glass-panel" style="padding:12px;border-radius:12px;">';
    html += '<button onclick="afficherFormulaireParticipant(null)" class="send-btn" style="margin-bottom:12px;"><i class="fa-solid fa-pen-to-square"></i> Nouveau message</button>';
    html += '<div class="filter-bar">';
    html += `<button class="filter-btn ${filtreStatut==='nonTraites'?'active-non-traite':''}" onclick="changerFiltreStatut('nonTraites')"><i class="fa-solid fa-circle-exclamation"></i> Non traités <span class="count">${nbNonTraites}</span></button>`;
    html += `<button class="filter-btn ${filtreStatut==='traites'?'active-traite':''}" onclick="changerFiltreStatut('traites')"><i class="fa-solid fa-circle-check"></i> Traités <span class="count">${nbTraites}</span></button>`;
    html += `<button class="filter-btn ${filtreStatut==='clotures'?'active-cloture':''}" onclick="changerFiltreStatut('clotures')"><i class="fa-solid fa-lock"></i> Clôturés <span class="count">${nbClotures}</span></button>`;
    html += '</div>';
    html += '<div class="cat-filter-bar">';
    const countToutes = filtreStatut === 'nonTraites' ? catCounts['toutes_nt'] : (filtreStatut === 'traites' ? catCounts['toutes_t'] : catCounts['toutes_c']);
    html += `<button class="cat-btn ${filtreCategorie==='toutes'?'active':''}" onclick="changerFiltreCategorie('toutes')">📋 Toutes <span class="cat-count">${countToutes}</span></button>`;
    CATEGORIES.forEach(c => {
        const count = filtreStatut === 'nonTraites' ? (catCounts[c.id+'_nt']||0) : (filtreStatut === 'traites' ? (catCounts[c.id+'_t']||0) : (catCounts[c.id+'_c']||0));
        html += `<button class="cat-btn ${filtreCategorie===c.id?'active':''}" onclick="changerFiltreCategorie('${c.id}')">${c.icon} ${c.label} <span class="cat-count">${count}</span></button>`;
    });
    html += '</div>';
    html += '</div>';
    const convsFiltrees = {};
    keys.forEach(convBase => {
        const msgs = conversations[convBase];
        if (!msgs || msgs.length === 0) return;
        const last = msgs[msgs.length - 1];
        const cat = last.categorie || 'defaut';
        if (filtreStatut === 'nonTraites' && last.traite !== 'NON') return;
        if (filtreStatut === 'traites' && last.traite !== 'OUI') return;
        if (filtreStatut === 'clotures' && last.traite !== 'CLOS') return;
        if (filtreCategorie !== 'toutes' && filtreCategorie !== cat) return;
        convsFiltrees[convBase] = msgs;
    });
    const convKeys = Object.keys(convsFiltrees);
    if (convKeys.length === 0) {
        let emptyText = 'Aucun message';
        if (filtreStatut === 'nonTraites') emptyText = 'Aucun message non traité';
        else if (filtreStatut === 'traites') emptyText = 'Aucun message traité';
        else if (filtreStatut === 'clotures') emptyText = 'Aucun sujet clôturé';
        if (filtreCategorie !== 'toutes') emptyText += ` dans ${getCategorieInfo(filtreCategorie).label}`;
        html += `<div class="empty-state glass-panel" style="border-radius:12px;margin-top:12px;"><div class="empty-icon"><i class="fa-regular fa-folder-open"></i></div>${emptyText}</div>`;
    } else {
        convKeys.forEach(convBase => { html += renderConvCardParticipant(convBase, convsFiltrees[convBase]); });
    }
    content.innerHTML = html;
}

function changerFiltreStatut(s) { filtreStatut = s; renderParticipant(); }
function changerFiltreCategorie(c) { filtreCategorie = c; renderParticipant(); }

function renderConvCardParticipant(convBase, msgs) {
    const sorted = msgs.sort((a,b) => a.idConvFull.localeCompare(b.idConvFull));
    const last = sorted[sorted.length - 1];
    const catBadge = getCategorieBadgeHTML(last.categorie);
    const reponseAutorisee = last.reponseAutorisee !== 'NON';
    let headerClass = last.traite === 'NON' ? 'non-traite' : (last.traite === 'OUI' ? 'traite' : 'cloture');
    let statusText = last.traite === 'NON' ? '🔴 Non traité' : (last.traite === 'OUI' ? '✅ Traité' : '🔒 Clôturé');
    let borderColor = last.traite === 'NON' ? '#ff007f' : (last.traite === 'OUI' ? '#10b981' : '#6b7280');
    const lastSender = last.userId === adherent.id ? '👤 Vous' : '🏢 Organisation';
    let html = '<div class="conv-card glass-panel" style="border-left:4px solid ' + borderColor + ';">';
    html += '<div class="conv-header ' + headerClass + '">';
    html += '<div><strong>' + lastSender + '</strong>' + catBadge;
    html += '<span style="font-size:11px;color:' + borderColor + ';margin-left:8px;font-weight:600;">' + statusText + '</span>';
    html += '<span style="float:right;font-size:11px;color:#64748b;font-family:monospace;">' + convBase + '</span></div></div>';
    sorted.forEach(m => {
        const isMine = m.userId === adherent.id;
        html += '<div class="conv-msg" style="background:' + (isMine ? 'rgba(0,242,254,0.08)' : 'rgba(13,22,41,0.4)') + ';">';
        html += '<div class="msg-meta">' + (isMine ? '👤 Vous' : '🏢 Organisation') + ' — ' + m.dateHeure + '</div>';
        html += '<div class="msg-text">' + m.message + '</div></div>';
    });
    html += '<div class="conv-actions">';
    if (last.traite === 'CLOS') {
        html += '<div style="padding:8px 12px;background:rgba(107,114,128,0.15);border-radius:8px;font-size:11px;color:#9ca3af;font-weight:700;border:1px solid rgba(107,114,128,0.3);">🔒 Sujet clôturé</div>';

        }
        html += `<button class="btn-clore" onclick="cloturerSujet('${convBase}')">🔒 Clôturer</button>`;
    }
    html += '</div></div>';
    return html;
}

async function toggleVu(convBase, estCoche) {
    if (!estCoche) return;
    try {
        const params = new URLSearchParams({ action: 'marquerVu', userId: adherent.id, convId: convBase });
        const resp = await fetch(SCRIPT_URL + '?' + params);
        const data = await resp.json();
        if (data.success) {
            if (conversations[convBase]) conversations[convBase].forEach(m => { m.vu = 'OUI'; });
            saveMessagerieCache({ conversations: conversations });
            renderParticipant();
        }
    } catch (e) { console.warn('Erreur marquer vu:', e); }
}

async function cloturerSujet(convBase) {
    if (!confirm('Voulez-vous vraiment clôturer ce sujet ? Il sera archivé et ne nécessitera plus de réponse.')) return;
    try {
        const params = new URLSearchParams({ action: 'cloturerSujet', userId: adherent.id, convId: convBase });
        const resp = await fetch(SCRIPT_URL + '?' + params);
        const data = await resp.json();
        if (data.success) {
            if (conversations[convBase]) conversations[convBase].forEach(m => { m.traite = 'CLOS'; });
            saveMessagerieCache({ conversations: conversations });
            if (adherent.statut === 'Organisateur') renderOrganisateur();
            else renderParticipant();
        }
    } catch (e) { alert('Erreur de connexion'); }
}

async function reouvrirSujet(convBase) {
    try {
        const params = new URLSearchParams({ action: 'reouvrirSujet', userId: adherent.id, convId: convBase });
        const resp = await fetch(SCRIPT_URL + '?' + params);
        const data = await resp.json();
        if (data.success) {
            if (conversations[convBase]) conversations[convBase].forEach(m => { m.traite = 'NON'; });
            saveMessagerieCache({ conversations: conversations });
            if (adherent.statut === 'Organisateur') renderOrganisateur();
            else renderParticipant();

}

async function envoyerMessageParticipant(convBase) {
    const texte = document.getElementById('msgTexte').value.trim();

    const catBtn = document.querySelector('.cat-chip.active');
    const categorie = catBtn ? catBtn.dataset.cat : '';
    const content = document.getElementById('messagerieContent');
    content.innerHTML = '<div class="glass-panel" style="padding:40px;text-align:center;border-radius:12px;"><div style="font-size:48px;margin-bottom:10px;">⏳</div><div style="color:#94a3b8;font-size:14px;">Envoi en cours...</div></div>';
    try {
        const params = new URLSearchParams({ action:'sendMessage', userId:adherent.id, nom:adherent.nom, prenom:adherent.prenom, message:texte, categorie:categorie, convId:convBase||'', isOrganisateur:'false' });
        const resp = await fetch(SCRIPT_URL + '?' + params);
        const data = await resp.json();
        if (data.success) {
            messagerieFormulaireOuvert = false;
            await avecTimeout(synchroniserSilencieuse(), 20000);
        } else { content.innerHTML = '<p style="color:#ff8ec7;text-align:center;padding:20px;">Erreur d\'envoi.</p>'; }

    html += '<div class="conv-actions">';
    if (last.traite === 'CLOS') {
        html += '<div style="padding:8px 12px;background:rgba(107,114,128,0.15);border-radius:8px;font-size:11px;color:#9ca3af;font-weight:700;border:1px solid rgba(107,114,128,0.3);">🔒 Sujet clôturé</div>';
        html += `<button class="btn-declore" onclick="reouvrirSujet('${convBase}')">🔓 Rouvrir</button>`;
    } else {
        html += `<button class="btn-repondre" onclick="afficherReponseOrga('${convBase}')"><i class="fa-solid fa-paper-plane"></i> Répondre</button>`;
        html += `<button class="btn-clore" onclick="cloturerSujet('${convBase}')">🔒 Clôturer</button>`;
    }
    html += '</div></div>';
    return html;
}

function afficherReponseOrga(convBase) {
    messagerieFormulaireOuvert = true;
    const content = document.getElementById('messagerieContent');
    let html = '<div style="margin-bottom:15px;"><button onclick="init()" style="background:none;border:none;color:#00f2fe;font-size:16px;cursor:pointer;"><i class="fa-solid fa-arrow-left"></i> Retour</button></div>';
    html += '<div class="send-section glass-panel"><h3><i class="fa-solid fa-reply"></i> Répondre — ' + convBase + '</h3>';
    html += '<textarea id="msgTexte" class="msg-textarea" placeholder="Votre réponse..."></textarea>';
    html += '<button onclick="envoyerReponseOrga(\'' + convBase + '\')" class="send-btn"><i class="fa-solid fa-paper-plane"></i> Envoyer</button></div>';
    content.innerHTML = html;
}

async function envoyerReponseOrga(convBase) {
    const texte = document.getElementById('msgTexte').value.trim();
    if (!texte) { alert('Veuillez écrire une réponse'); return; }
    const content = document.getElementById('messagerieContent');
    content.innerHTML = '<div class="glass-panel" style="padding:40px;text-align:center;border-radius:12px;"><div style="font-size:48px;margin-bottom:10px;">⏳</div><div style="color:#94a3b8;font-size:14px;">Envoi en cours...</div></div>';
    try {
        const params = new URLSearchParams({ action:'sendMessage', userId:adherent.id, nom:adherent.nom, prenom:adherent.prenom, message:texte, convId:convBase, isOrganisateur:'true' });
        const resp = await fetch(SCRIPT_URL + '?' + params);
        const data = await resp.json();
        if (data.success) {
            messagerieFormulaireOuvert = false;
            await avecTimeout(synchroniserSilencieuse(), 20000);
        } else { content.innerHTML = '<p style="color:#ff8ec7;text-align:center;padding:20px;">Erreur d\'envoi.</p>'; }
    } catch(e) { content.innerHTML = '<p style="color:#ff8ec7;text-align:center;padding:20px;">Erreur de connexion</p>'; }
}

function afficherSectionEnvoi() {
    messagerieFormulaireOuvert = true;
    selectedDestinataires.clear();
    const content = document.getElementById('messagerieContent');
    if (allAdherents.length === 0) {
        content.innerHTML = '<div class="glass-panel" style="padding:40px;text-align:center;border-radius:12px;"><div style="font-size:48px;margin-bottom:10px;">⏳</div><div style="color:#94a3b8;font-size:14px;">Chargement de la liste...</div></div>';
        avecTimeout(chargerListeAdherents(), 15000)
            .then(() => { content.innerHTML = renderFormulaireEnvoiHTML(); attacherEventsEnvoi(); })
            .catch(() => { content.innerHTML = '<p style="color:#ff8ec7;text-align:center;padding:20px;">Impossible de charger la liste des participants</p><button onclick="init()" class="send-btn" style="margin-top:15px;"><i class="fa-solid fa-arrow-left"></i> Retour</button>'; });
    } else {
        content.innerHTML = renderFormulaireEnvoiHTML();
        attacherEventsEnvoi();
    }
}

function renderFormulaireEnvoiHTML() {
    const countsByStatut = {};
    statutsDisponibles.forEach(s => { countsByStatut[s] = allAdherents.filter(a => a.statut === s).length; });
    const sortedAdherents = trierAdherentsParStatutPuisNom(allAdherents);
    const optionsHTML = sortedAdherents.map(a => `<option value="${a.id}">${formatNomComplet(a)}</option>`).join('');
    const preselButtonsHTML = statutsDisponibles.map(s => `<button class="statut-presel-btn" onclick="preselectionnerStatut('${s}')">${s} <span class="count">${countsByStatut[s]||0}</span></button>`).join('');
    const totalSansOrga = allAdherents.filter(a => a.statut !== 'Organisateur').length;
    const tousSansOrgaBtn = `<button class="statut-presel-btn" onclick="preselectionnerTousSaufOrga()" style="border-color:#00f2fe;font-weight:700;">📢 TOUS (sauf orga) <span class="count">${totalSansOrga}</span></button>`;
    const destListHTML = sortedAdherents.filter(a => selectedDestinataires.has(a.id)).map(a => `<label class="dest-item"><input type="checkbox" value="${a.id}" class="dest-checkbox" checked>${formatNomComplet(a)}</label>`).join('') || '<div style="color:#64748b;font-size:12px;text-align:center;padding:20px;">Aucun destinataire sélectionné</div>';
    return `<div style="margin-bottom:15px;"><button onclick="init()" style="background:none;border:none;color:#00f2fe;font-size:16px;cursor:pointer;"><i class="fa-solid fa-arrow-left"></i> Retour aux messages</button></div>
    <div class="send-section glass-panel">
        <h3><i class="fa-solid fa-bullhorn"></i> Nouveau message groupé</h3>
        <div style="font-size:12px;color:#94a3b8;margin-bottom:8px;font-weight:700;text-transform:uppercase;letter-spacing:1px;">🏷️ Pré-sélectionner par statut :</div>
        <div class="statut-presel-bar">${tousSansOrgaBtn}${preselButtonsHTML}</div>
        <div class="dest-selector">
            <div class="dest-panel"><h4><i class="fa-solid fa-list"></i> Liste des participants</h4><select id="listeParticipants" class="dest-list" multiple size="16">${optionsHTML}</select></div>
            <div class="dest-panel"><h4><i class="fa-solid fa-check"></i> Destinataires (${selectedDestinataires.size})</h4><div id="destinatairesList" class="dest-list">${destListHTML}</div></div>
        </div>
        <div class="dest-actions">
            <button class="btn-add" onclick="ajouterSelectionnes()"><i class="fa-solid fa-plus"></i> Ajouter</button>
            <button class="btn-remove" onclick="retirerSelectionnes()"><i class="fa-solid fa-minus"></i> Retirer</button>
        </div>
        <div class="dest-count">📨 <strong>${selectedDestinataires.size}</strong> destinataire(s) dans la liste de diffusion</div>
        <div style="display:flex;align-items:center;gap:10px;padding:12px;background:rgba(5,8,17,0.5);border-radius:10px;margin-bottom:12px;border:1px solid rgba(56,189,248,0.2);">
            <input type="checkbox" id="reponseAutorisee" checked style="width:20px;height:20px;accent-color:#00f2fe;">
            <label for="reponseAutorisee" style="font-size:14px;color:#e2e8f0;cursor:pointer;flex:1;">
                <strong>✉️ Autoriser les réponses</strong>
                <div style="font-size:11px;color:#64748b;margin-top:2px;">Si décoché, le message sera marqué comme "informatif" et les destinataires ne pourront pas y répondre.</div>
            </label>
        </div>
        <textarea id="msgTexte" class="msg-textarea" placeholder="Votre message..."></textarea>
        <button class="send-btn" id="btnSend" onclick="envoyerMessageGroupe()"><i class="fa-solid fa-paper-plane"></i> Envoyer à ${selectedDestinataires.size} personne(s)</button>
    </div>`;
}

function attacherEventsEnvoi() { updateDestCount(); }
function preselectionnerTousSaufOrga() {
    const select = document.getElementById('listeParticipants');
    if (!select) return;
    Array.from(select.options).forEach(opt => opt.selected = false);
    allAdherents.filter(a => a.statut !== 'Organisateur').forEach(a => {
        const opt = select.querySelector(`option[value="${a.id}"]`);
        if (opt) opt.selected = true;
    });
}
function preselectionnerStatut(statut) {
    const select = document.getElementById('listeParticipants');
    if (!select) return;
    Array.from(select.options).forEach(opt => opt.selected = false);
    allAdherents.filter(a => a.statut === statut).forEach(a => {
        const opt = select.querySelector(`option[value="${a.id}"]`);
        if (opt) opt.selected = true;
    });
}
function ajouterSelectionnes() {
    const select = document.getElementById('listeParticipants');
    if (!select) return;
    let ajoutes = 0;
    Array.from(select.selectedOptions).forEach(opt => {
        if (!selectedDestinataires.has(opt.value)) { selectedDestinataires.add(opt.value); ajoutes++; }
    });
    Array.from(select.options).forEach(opt => opt.selected = false);
    refreshDestinatairesList();
    if (ajoutes > 0) {
        const btn = document.querySelector('.btn-add');
        const originalText = btn.innerHTML;
        btn.innerHTML = `✅ ${ajoutes} ajouté(s)`;
        setTimeout(() => { btn.innerHTML = originalText; }, 1000);
    }
}
function retirerSelectionnes() {
    const checkboxes = document.querySelectorAll('.dest-checkbox:checked');
    if (checkboxes.length === 0) { alert('Veuillez sélectionner au moins un destinataire à retirer'); return; }
    let retires = 0;
    checkboxes.forEach(cb => { selectedDestinataires.delete(cb.value); retires++; });
    refreshDestinatairesList();
    const btn = document.querySelector('.btn-remove');
    const originalText = btn.innerHTML;
    btn.innerHTML = `✅ ${retires} retiré(s)`;
    setTimeout(() => { btn.innerHTML = originalText; }, 1000);
}
function refreshDestinatairesList() {
    const destList = document.getElementById('destinatairesList');
    if (!destList) return;
    const sortedAdherents = trierAdherentsParStatutPuisNom(allAdherents);
    const destListHTML = sortedAdherents.filter(a => selectedDestinataires.has(a.id)).map(a => `<label class="dest-item"><input type="checkbox" value="${a.id}" class="dest-checkbox" checked>${formatNomComplet(a)}</label>`).join('') || '<div style="color:#64748b;font-size:12px;text-align:center;padding:20px;">Aucun destinataire sélectionné</div>';
    destList.innerHTML = destListHTML;
    updateDestCount();
}
function updateDestCount() {
    const countEl = document.querySelector('.dest-count');
    const btnSend = document.getElementById('btnSend');
    const nb = selectedDestinataires.size;
    if (countEl) countEl.innerHTML = `📨 <strong>${nb}</strong> destinataire(s) dans la liste de diffusion`;
    if (btnSend) btnSend.innerHTML = `<i class="fa-solid fa-paper-plane"></i> Envoyer à ${nb} personne(s)`;
    const destPanelTitle = document.querySelector('#destinatairesList')?.previousElementSibling;
    if (destPanelTitle) destPanelTitle.innerHTML = `<i class="fa-solid fa-check"></i> Destinataires (${nb})`;
}

async function envoyerMessageGroupe() {
    const texte = document.getElementById('msgTexte').value.trim();
    if (!texte) { alert('Veuillez écrire un message'); return; }
    if (selectedDestinataires.size === 0) { alert('Veuillez sélectionner au moins un destinataire'); return; }
    const reponseAutoriseeCheckbox = document.getElementById('reponseAutorisee');
    const reponseAutorisee = reponseAutoriseeCheckbox ? reponseAutoriseeCheckbox.checked : true;
    const btn = document.getElementById('btnSend');
    btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-hourglass-half"></i> Envoi en cours...';
    const destinataires = allAdherents.filter(a => selectedDestinataires.has(a.id));
    const destIds = destinataires.map(d => d.id).join(',');
    const content = document.getElementById('messagerieContent');
    content.innerHTML = `<div style="margin-bottom:15px;"><button onclick="init()" style="background:none;border:none;color:#00f2fe;font-size:16px;cursor:pointer;"><i class="fa-solid fa-arrow-left"></i> Retour</button></div>
        <div class="send-section glass-panel"><h3><i class="fa-solid fa-bullhorn"></i> Envoi groupé en cours...</h3>
        <div style="text-align:center;padding:20px;">
            <div style="font-size:48px;margin-bottom:10px;">⏳</div>
            <div style="font-size:16px;color:#e2e8f0;">Envoi à <strong style="color:#00f2fe;">${destinataires.length}</strong> destinataire(s)...</div>
            <div style="font-size:13px;color:#94a3b8;margin-top:8px;">${reponseAutorisee ? '✉️ Réponses autorisées' : '📢 Message informatif (sans réponse)'}</div>
        </div></div>`;
    try {
        const params = new URLSearchParams({ action: 'sendBulkMessage', userId: adherent.id, nom: adherent.nom, prenom: adherent.prenom, message: texte, categorie: 'organisation', destIds: destIds, reponseAutorisee: reponseAutorisee ? 'true' : 'false', isOrganisateur: 'true' });
        const resp = await fetch(SCRIPT_URL + '?' + params);
        const data = await resp.json();
        if (data.success) {
            messagerieFormulaireOuvert = false;
            selectedDestinataires.clear();
            content.innerHTML = `<div class="confirm-box glass-panel">✅ Envoi groupé terminé !<br><strong>${data.nbMessages}</strong> message(s) envoyé(s) en une seule opération<br>${reponseAutorisee ? '✉️ Les destinataires peuvent répondre' : '📢 Message informatif - réponses désactivées'}</div>
                <button onclick="init()" class="send-btn" style="margin-top:15px;"><i class="fa-solid fa-arrow-left"></i> Retour aux messages</button>`;
        } else {
            content.innerHTML = `<p style="color:#ff8ec7;text-align:center;padding:20px;">Erreur : ${data.message || 'inconnue'}</p><button onclick="init()" class="send-btn" style="margin-top:15px;"><i class="fa-solid fa-arrow-left"></i> Retour</button>`;
        }
    } catch(e) {
        content.innerHTML = `<p style="color:#ff8ec7;text-align:center;padding:20px;">Erreur de connexion</p><button onclick="init()" class="send-btn" style="margin-top:15px;"><i class="fa-solid fa-arrow-left"></i> Retour</button>`;
    }
}

document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; } }
    else {
        synchroniserSilencieuse();
        if (!refreshTimer) {
            refreshTimer = setInterval(() => {
                if (!texteEnCours() && !document.hidden && !messagerieFormulaireOuvert) synchroniserSilencieuse();
            }, 30000);
        }
    }
});
window.addEventListener('beforeunload', () => { if (refreshTimer) clearInterval(refreshTimer); });

init();
</script>
</body>
</html>
