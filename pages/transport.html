<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Transport — AAMB JTB 2026</title>
    <link rel="manifest" href="../manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            background-color: #050811;
            background-image:
                radial-gradient(circle at 15% 15%, rgba(0, 242, 254, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 60%, rgba(255, 0, 127, 0.06) 0%, transparent 40%),
                linear-gradient(to bottom, rgba(5, 8, 17, 0.95), rgba(5, 8, 17, 0.98));
            background-attachment: fixed;
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
        }
        body::before {
            content: '';
            position: fixed; inset: 0;
            pointer-events: none; z-index: 0;
            background-size: 40px 40px;
            background-image:
                linear-gradient(to right, rgba(56, 189, 248, 0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(56, 189, 248, 0.04) 1px, transparent 1px);
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #070b14; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #00f2fe; }

        .glass-panel {
            background: rgba(13, 22, 41, 0.65);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(56, 189, 248, 0.18);
        }

        /* ==== HEADER ==== */
        .page-header {
            position: sticky; top: 0; z-index: 50;
            background: rgba(13, 22, 41, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(0, 242, 254, 0.25);
            color: white;
            padding: 12px 16px;
            display: flex; align-items: center; gap: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
        .back-btn {
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid rgba(0, 242, 254, 0.3);
            color: #00f2fe;
            width: 36px; height: 36px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.25s;
            display: flex; align-items: center; justify-content: center;
            text-decoration: none;
        }
        .back-btn:hover { background: rgba(0, 242, 254, 0.25); color: white; box-shadow: 0 0 12px rgba(0, 242, 254, 0.4); }
        .page-header h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            letter-spacing: 2px;
            text-transform: uppercase;
            flex: 1;
        }
        .page-header h2 .cyan { color: #00f2fe; text-shadow: 0 0 10px rgba(0, 242, 254, 0.6); }

        /* ==== CONTENU ==== */
        .page-content { 
            position: relative; z-index: 1; 
            padding: 16px; 
            max-width: 900px; 
            margin: 0 auto; 
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .info-card {
            border-radius: 12px;
            padding: 16px;
            border: 1px solid rgba(255, 183, 3, 0.3);
            background: rgba(255, 183, 3, 0.08);
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }
        .info-card i {
            color: #fbbf24;
            font-size: 20px;
            margin-top: 2px;
        }
        .info-card p {
            font-size: 13px;
            color: #e2e8f0;
            line-height: 1.5;
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 0.3px;
        }
        .info-card strong { color: #fbbf24; }

        /* ==== PDF CONTAINER ==== */
        .pdf-card {
            border-radius: 14px;
            padding: 4px; /* Pour la bordure néon */
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.3), rgba(255, 0, 127, 0.3));
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.15);
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 60vh;
        }
        .pdf-inner {
            flex: 1;
            background: #0a0f1f;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        .pdf-inner iframe {
            width: 100%;
            height: 100%;
            min-height: 60vh;
            border: none;
            display: block;
        }

        .btn-open-external {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            background: rgba(13, 22, 41, 0.8);
            border: 1px solid rgba(0, 242, 254, 0.4);
            border-radius: 10px;
            color: #00f2fe;
            font-family: 'Rajdhani', sans-serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.25s;
        }
        .btn-open-external:hover {
            background: rgba(0, 242, 254, 0.15);
            box-shadow: 0 0 18px rgba(0, 242, 254, 0.4);
            transform: translateY(-1px);
        }

        @media (max-width: 768px) {
            .page-header h2 { font-size: 14px; }
            .pdf-inner iframe { min-height: 70vh; }
        }
    each
    </style>
</head>
<body>
    <div class="page-header">
        <button class="back-btn" onclick="retourAccueil()"><i class="fa-solid fa-arrow-left"></i></button>
        <h2>🚌 Informations <span class="cyan">Transport v0.1</span></h2>
    </div>
    
    <div class="page-content">
        <!-- Carte d'info -->
        <div class="info-card glass-panel">
            <i class="fa-solid fa-circle-info"></i>
            <p>
                Retrouvez ci-dessous le <strong>plan de transport et les navettes</a></strong> pour vous rendre sur le lieu des 44èmes JTB. 
                <br><em>(Utilisez le bouton ci-dessous si le document ne s'affiche pas correctement sur votre mobile).</em>
            </p>
        </div>

        <!-- Conteneur du PDF -->
        <div class="pdf-card">
            <div class="pdf-inner">
                <!-- Lien Google Drive converti en mode "preview" pour l'intégration iframe -->
                <iframe 
                    src="https://drive.google.com/file/d/1C2ODmiDVQzJOYoXt1A4XHigjtFM1ILFz/preview" 
                    allow="autoplay"
                    title="Plan de Transport JTB 2026">
                </iframe>
            </div>
        </div>

        <!-- Bouton de secours (indispensable pour mobile) -->
        <a href="https://drive.google.com/file/d/1C2ODmiDVQzJOYoXt1A4XHigjtFM1ILFz/view?usp=drive_link" target="_blank" class="btn-open-external glass-panel">
            <i class="fa-solid fa-external-link-alt"></i> Ouvrir le PDF en plein écran
        </a>
    </div>

    <script src="../js/commun.js"></script>
    <script>
        // La fonction retourAccueil() est fournie par commun.js
        // Si elle n'est pas définie, on met un fallback
        if (typeof retourAccueil !== 'function') {
            window.retourAccueil = function() {
                window.location.href = '../app.html';
            };
        }
    </script>
</body>
</html>
