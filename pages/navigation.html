<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation entre stands — AAMB JTB 2026</title>
    <link rel="manifest" href="../manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            background-color: #050811;
            background-image:
                radial-gradient(circle at 15% 15%, rgba(0, 242, 254, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 60%, rgba(255, 0, 127, 0.06) 0%, transparent 40%),
                linear-gradient(to bottom, rgba(5, 8, 17, 0.95), rgba(5, 8, 17, 0.98));
            background-attachment: fixed;
            color: #e2e8f0;
        }
        body::before {
            content: '';
            position: fixed; inset: 0;
            pointer-events: none; z-index: 0;
            background-size: 40px 40px;
            background-image:
                linear-gradient(to right, rgba(56, 189, 248, 0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(56, 189, 248, 0.04) 1px, transparent 1px);
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #070b14; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #00f2fe; }

        .glass-panel {
            background: rgba(13, 22, 41, 0.65);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(56, 189, 248, 0.18);
        }

        /* ==== HEADER ==== */
        .page-header {
            position: sticky; top: 0; z-index: 50;
            background: rgba(13, 22, 41, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(0, 242, 254, 0.25);
            color: white;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
        .back-btn {
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid rgba(0, 242, 254, 0.3);
            color: #00f2fe;
            width: 36px; height: 36px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.25s;
            display: flex; align-items: center; justify-content: center;
        }
        .back-btn:hover { background: rgba(0, 242, 254, 0.25); color: white; box-shadow: 0 0 12px rgba(0, 242, 254, 0.4); }
        .page-header h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            letter-spacing: 2px;
            text-transform: uppercase;
            flex: 1;
        }
        .page-header h2 .cyan { color: #00f2fe; text-shadow: 0 0 10px rgba(0, 242, 254, 0.6); }

        .page-content { position: relative; z-index: 1; padding: 16px; max-width: 700px; margin: 0 auto; }

        /* ==== NAV SECTION ==== */
        .nav-section {
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 15px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(56, 189, 248, 0.18);
            background: rgba(13, 22, 41, 0.65);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .nav-section h3 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 12px;
            color: #00f2fe;
            margin-bottom: 10px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            display: flex; align-items: center; gap: 8px;
        }
        .nav-section select {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid rgba(0, 242, 254, 0.25);
            border-radius: 10px;
            font-size: 14px;
            background: rgba(5, 8, 17, 0.7);
            color: #e2e8f0;
            margin-bottom: 12px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: border-color 0.25s, box-shadow 0.25s;
        }
        .nav-section select:focus {
            outline: none;
            border-color: #00f2fe;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
        }
        .nav-section select option {
            background: #0a0f1f;
            color: #e2e8f0;
        }

        .btn-calculate {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #0a0f1f;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            box-shadow: 0 0 18px rgba(0, 242, 254, 0.35);
            transition: all 0.25s;
        }
        .btn-calculate:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 0 25px rgba(0, 242, 254, 0.55); }
        .btn-calculate:disabled { opacity: 0.4; cursor: not-allowed; }

        /* ==== INSTRUCTIONS ==== */
        .instructions {
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 15px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(16, 185, 129, 0.3);
            background: rgba(13, 22, 41, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: none;
            border-left: 4px solid #10b981;
            box-shadow: 0 4px 18px rgba(16, 185, 129, 0.15), 0 0 20px rgba(16, 185, 129, 0.08);
        }
        .instructions.visible { display: block; }
        .instructions h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            color: #6ee7b7;
            margin-bottom: 14px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(16, 185, 129, 0.5);
        }
        .instruction-step {
            padding: 14px;
            margin-bottom: 10px;
            background: rgba(5, 8, 17, 0.6);
            border-radius: 10px;
            border-left: 4px solid #00f2fe;
            font-size: 14px;
            color: #e2e8f0;
            line-height: 1.6;
            border: 1px solid rgba(0, 242, 254, 0.15);
        }
        .instruction-step .step-number {
            font-weight: 700;
            color: #00f2fe;
            margin-right: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            letter-spacing: 1px;
            text-shadow: 0 0 6px rgba(0, 242, 254, 0.5);
        }
        .instruction-step .action {
            font-weight: 700;
            color: #6ee7b7;
            text-shadow: 0 0 4px rgba(16, 185, 129, 0.4);
        }
        .instruction-step:last-child {
            border-left-color: #10b981;
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        .instruction-step:last-child .action { color: #fbbf24; text-shadow: 0 0 4px rgba(251, 191, 36, 0.4); }

        .stats {
            display: flex;
            gap: 12px;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid rgba(16, 185, 129, 0.2);
        }
        .stat-item {
            flex: 1;
            text-align: center;
            padding: 10px;
            background: rgba(5, 8, 17, 0.5);
            border-radius: 10px;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }
        .stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 22px;
            font-weight: 700;
            color: #6ee7b7;
            text-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }
        .stat-label {
            font-size: 10px;
            color: #94a3b8;
            margin-top: 2px;
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* ==== DEBUG SECTION (terminal style) ==== */
        .debug-section {
            background: rgba(5, 8, 17, 0.95);
            color: #00ff41;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: 11px;
            line-height: 1.7;
            max-height: 400px;
            overflow-y: auto;
            display: none;
            white-space: pre-wrap;
            word-wrap: break-word;
            border: 1px solid rgba(0, 255, 65, 0.3);
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.15), inset 0 0 30px rgba(0, 255, 65, 0.05);
        }
        .debug-section.visible { display: block; }
        .debug-section::before {
            content: '> TERMINAL DEBUG';
            display: block;
            color: #00ff41;
            font-weight: 700;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(0, 255, 65, 0.3);
            letter-spacing: 2px;
        }
        .debug-section .debug-title {
            color: #fbbf24;
            font-weight: 700;
            font-size: 12px;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(251, 191, 36, 0.3);
            padding-bottom: 5px;
            letter-spacing: 1px;
        }
        .debug-section .obstacle { color: #ff8ec7; text-shadow: 0 0 4px rgba(255, 0, 127, 0.4); }
        .debug-section .chemin { color: #00f2fe; text-shadow: 0 0 4px rgba(0, 242, 254, 0.4); }
        .debug-section .info { color: #94a3b8; }
        .debug-section .entree { color: #c084fc; text-shadow: 0 0 4px rgba(168, 85, 247, 0.4); }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #64748b;
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 13px;
        }
        .loading::before {
            content: '';
            display: inline-block;
            width: 40px; height: 40px;
            border: 3px solid rgba(0, 242, 254, 0.15);
            border-top-color: #00f2fe;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .page-header h2 { font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="page-header">
        <button class="back-btn" onclick="retourAccueil()"><i class="fa-solid fa-arrow-left"></i></button>
        <h2>🗺️ Navigation <span class="cyan">entre stands</span></h2>
    </div>
    <div class="page-content">
        <div id="loading" class="loading">Chargement du plan de la salle...</div>
        <div class="nav-section" id="navForm" style="display:none;">
            <h3><i class="fa-solid fa-location-dot"></i> Je suis au stand :</h3>
            <select id="standDepart"><option value="">-- Sélectionnez --</option></select>
            <h3><i class="fa-solid fa-flag-checkered"></i> Je veux aller au stand :</h3>
            <select id="standArrivee"><option value="">-- Sélectionnez --</option></select>
            <button class="btn-calculate" id="btnCalculate" onclick="calculerItineraire()" disabled>
                <i class="fa-solid fa-route"></i> Calculer l'itinéraire
            </button>
        </div>
        <div id="debugSection" class="debug-section"></div>
        <div id="instructions" class="instructions">
            <h3><i class="fa-solid fa-map-signs"></i> Itinéraire</h3>
            <div id="instructionsList"></div>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="statDistance">-</div>
                    <div class="stat-label">Distance (m)</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="statTime">-</div>
                    <div class="stat-label">Temps (sec)</div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/commun.js"></script>
    <script>
        verifierConnexionOuRediriger();
        
        let stands = [];
        let grille = [];
        const PENALITE_VIRAGE = 3;
        
        async function chargerDonnees() {
            try {
                const respStands = await fetch(SCRIPT_URL + '?action=getStands');
                const dataStands = await respStands.json();
                if (dataStands.success) {
                    stands = dataStands.stands.sort((a, b) => a.numero - b.numero);
                    remplirSelects();
                    console.log('[Nav] ' + stands.length + ' stands chargés');
                }
                const respGrille = await fetch(SCRIPT_URL + '?action=getGrilleSalle');
                const dataGrille = await respGrille.json();
                if (dataGrille.success) {
                    grille = dataGrille.grille;
                    console.log('[Nav] Grille chargée: ' + grille.length + ' x ' + grille[0].length);
                }
                document.getElementById('loading').style.display = 'none';
                document.getElementById('navForm').style.display = 'block';
            } catch (e) {
                console.error('[Nav] Erreur:', e);
                document.getElementById('loading').textContent = 'Erreur de chargement. Vérifiez votre connexion.';
            }
        }
        
        function remplirSelects() {
            const selectDepart = document.getElementById('standDepart');
            const selectArrivee = document.getElementById('standArrivee');
            stands.forEach(stand => {
                const text = stand.numero + ' - ' + stand.nom;
                selectDepart.add(new Option(text, stand.numero));
                selectArrivee.add(new Option(text, stand.numero));
            });
            const verifier = () => {
                const d = selectDepart.value;
                const a = selectArrivee.value;
                document.getElementById('btnCalculate').disabled = !(d && a && d !== a);
            };
            selectDepart.addEventListener('change', verifier);
            selectArrivee.addEventListener('change', verifier);
        }
        
        function estObstacle(cellule) {
            if (!cellule) return false;
            const texte = String(cellule).trim();
            if (texte.toUpperCase() === 'X') return true;
            if (/^\d{1,2}[\s\n]*[A-Za-zÀ-ÿ]/.test(texte)) return true;
            if (texte.toUpperCase() === 'PAUSE') return true;
            if (texte.toUpperCase() === 'AAMB') return true;
            return false;
        }
        
        function trouverEntreeStandAvecDirection(numeroStand) {
            const numStr = String(numeroStand);
            const entrees = [];
            for (let y = 0; y < grille.length; y++) {
                for (let x = 0; x < grille[0].length; x++) {
                    const cellule = grille[y][x];
                    const texte = String(cellule || '').trim();
                    if (texte === numStr) {
                        const directions = [
                            {dx: 0, dy: -1, dir: 'haut'},
                            {dx: 0, dy: 1, dir: 'bas'},
                            {dx: -1, dy: 0, dir: 'gauche'},
                            {dx: 1, dy: 0, dir: 'droite'}
                        ];
                        for (const d of directions) {
                            const sx = x + d.dx;
                            const sy = y + d.dy;
                            if (sy >= 0 && sy < grille.length && sx >= 0 && sx < grille[0].length) {
                                const celluleStand = grille[sy][sx];
                                const texteStand = String(celluleStand || '').trim();
                                if (/^\d{1,2}[\s\n]+[A-Za-zÀ-ÿ]/.test(texteStand) && texteStand.startsWith(numStr)) {
                                    const directionOpposee = {'haut':'bas','bas':'haut','gauche':'droite','droite':'gauche'}[d.dir];
                                    entrees.push({x: x, y: y, directionRegard: d.dir, directionDepart: directionOpposee});
                                    console.log('[Nav] ✅ Entrée en (' + x + ', ' + y + ') - Regard: ' + d.dir + ' - Départ: ' + directionOpposee);
                                    break;
                                }
                            }
                        }
                    }
                }
            }
            return entrees;
        }
        
        function aStar(start, end, grid, directionInitiale) {
            if (!start || !end) return null;
            const openSet = [{x: start.x, y: start.y, g: 0, h: 0, f: 0, parent: null, direction: directionInitiale, nbVirages: 0}];
            const closedSet = new Set();
            const height = grid.length;
            const width = grid[0].length;
            let iterations = 0;
            while (openSet.length > 0) {
                iterations++;
                if (iterations > 50000) return null;
                openSet.sort((a, b) => a.f - b.f);
                const current = openSet.shift();
                const key = current.x + ',' + current.y + ',' + (current.direction || 'null');
                if (current.x === end.x && current.y === end.y) {
                    const chemin = [];
                    let node = current;
                    while (node) { chemin.unshift({x: node.x, y: node.y}); node = node.parent; }
                    console.log('[Nav] ✅ Chemin: ' + chemin.length + ' cellules, ' + current.nbVirages + ' virages');
                    return chemin;
                }
                if (closedSet.has(key)) continue;
                closedSet.add(key);
                const voisins = [
                    {x: current.x+1, y: current.y, dir: 'droite'},
                    {x: current.x-1, y: current.y, dir: 'gauche'},
                    {x: current.x, y: current.y+1, dir: 'bas'},
                    {x: current.x, y: current.y-1, dir: 'haut'}
                ];
                for (const v of voisins) {
                    if (v.x < 0 || v.x >= width || v.y < 0 || v.y >= height) continue;
                    const vKey = v.x + ',' + v.y + ',' + v.dir;
                    if (closedSet.has(vKey)) continue;
                    const voisin = grid[v.y][v.x];
                    const estDestination = (v.x === end.x && v.y === end.y);
                    if (estObstacle(voisin) && !estDestination) continue;
                    let coutDeplacement = 1;
                    let estVirage = false;
                    if (current.direction !== null && current.direction !== v.dir) {
                        coutDeplacement = 1 + PENALITE_VIRAGE;
                        estVirage = true;
                    }
                    const g = current.g + coutDeplacement;
                    const h = Math.abs(v.x - end.x) + Math.abs(v.y - end.y);
                    const f = g + h;
                    const nbVirages = current.nbVirages + (estVirage ? 1 : 0);
                    const existing = openSet.find(n => n.x === v.x && n.y === v.y && n.direction === v.dir);
                    if (existing) {
                        if (g < existing.g) {
                            existing.g = g; existing.f = f; existing.parent = current;
                            existing.direction = v.dir; existing.nbVirages = nbVirages;
                        }
                    } else {
                        openSet.push({x: v.x, y: v.y, g: g, h: h, f: f, parent: current, direction: v.dir, nbVirages: nbVirages});
                    }
                }
            }
            return null;
        }
        
        function calculerItineraire() {
            const numDepart = parseInt(document.getElementById('standDepart').value);
            const numArrivee = parseInt(document.getElementById('standArrivee').value);
            if (!numDepart || !numArrivee) { alert('Veuillez sélectionner les deux stands'); return; }
            if (numDepart === numArrivee) { alert('Veuillez sélectionner deux stands différents'); return; }
            
            const entreesDepart = trouverEntreeStandAvecDirection(numDepart);
            const entreesArrivee = trouverEntreeStand(numArrivee);
            
            let debugHtml = '<div class="debug-title">🔍 RAISONNEMENT</div>';
            debugHtml += '<div class="info">═══════════════════════════════════════</div>';
            debugHtml += '<div class="info">🚩 DÉPART : stand ' + numDepart + '</div>';
            debugHtml += '<div class="info">🏁 ARRIVÉE : stand ' + numArrivee + '</div>';
            debugHtml += '<div class="info">═══════════════════════════════════════</div>';
            
            if (entreesDepart.length === 0) {
                debugHtml += '<div class="obstacle">❌ Aucune entrée "' + numDepart + '" trouvée</div>';
            } else {
                debugHtml += '<div class="entree">✅ ' + entreesDepart.length + ' entrée(s) :</div>';
                entreesDepart.forEach(e => { debugHtml += '<div class="entree">   → (' + e.x + ', ' + e.y + ') - Regard: ' + e.directionRegard + ' - Départ: ' + e.directionDepart + '</div>'; });
            }
            if (entreesArrivee.length === 0) {
                debugHtml += '<div class="obstacle">❌ Aucune entrée "' + numArrivee + '" trouvée</div>';
            } else {
                debugHtml += '<div class="entree">✅ ' + entreesArrivee.length + ' entrée(s) :</div>';
                entreesArrivee.forEach(e => { debugHtml += '<div class="entree">   → (' + e.x + ', ' + e.y + ')</div>'; });
            }
            debugHtml += '<div class="info">═══════════════════════════════════════</div>';
            
            if (entreesDepart.length === 0 || entreesArrivee.length === 0) {
                document.getElementById('debugSection').innerHTML = debugHtml;
                document.getElementById('debugSection').classList.add('visible');
                alert('❌ Entrée(s) manquante(s).');
                return;
            }
            
            let meilleurCout = Infinity, meilleurStart = null, meilleurEnd = null, meilleureDirection = null;
            for (const entreeD of entreesDepart) {
                for (const entreeA of entreesArrivee) {
                    const dist = Math.abs(entreeD.x - entreeA.x) + Math.abs(entreeD.y - entreeA.y);
                    if (dist < meilleurCout) {
                        meilleurCout = dist; meilleurStart = entreeD; meilleurEnd = entreeA;
                        meilleureDirection = entreeD.directionDepart;
                    }
                }
            }
            
            debugHtml += '<div class="chemin">📍 Départ: (' + meilleurStart.x + ', ' + meilleurStart.y + ')</div>';
            debugHtml += '<div class="chemin">👁️ Regard: ' + meilleurStart.directionRegard + ' | Départ: ' + meilleureDirection + '</div>';
            debugHtml += '<div class="chemin">🏁 Arrivée: (' + meilleurEnd.x + ', ' + meilleurEnd.y + ')</div>';
            debugHtml += '<div class="info">═══════════════════════════════════════</div>';
            
            const chemin = aStar(meilleurStart, meilleurEnd, grille, meilleureDirection);
            
            if (chemin) {
                debugHtml += '<div class="chemin">✅ CHEMIN: ' + chemin.length + ' cellules (' + (chemin.length * 0.5).toFixed(1) + ' m)</div>';
                afficherInstructions(chemin, numDepart, numArrivee, meilleureDirection);
            } else {
                debugHtml += '<div class="obstacle">❌ AUCUN CHEMIN TROUVÉ</div>';
            }
            
            document.getElementById('debugSection').innerHTML = debugHtml;
            document.getElementById('debugSection').classList.add('visible');
        }
        
        function trouverEntreeStand(numeroStand) {
            const numStr = String(numeroStand);
            const entrees = [];
            for (let y = 0; y < grille.length; y++) {
                for (let x = 0; x < grille[0].length; x++) {
                    if (String(grille[y][x] || '').trim() === numStr) entrees.push({x: x, y: y});
                }
            }
            return entrees;
        }
        
        function afficherInstructions(chemin, numDepart, numArrivee, directionDepart) {
            if (!chemin || chemin.length < 2) return;
            
            const instructions = [];
            const standArrivee = stands.find(s => s.numero === numArrivee);
            
            let segments = [];
            let currentDir = null;
            let currentDist = 0;
            
            for (let i = 1; i < chemin.length; i++) {
                const prev = chemin[i-1];
                const curr = chemin[i];
                const dx = curr.x - prev.x;
                const dy = curr.y - prev.y;
                const dir = dx === 1 ? 'droite' : dx === -1 ? 'gauche' : dy === 1 ? 'bas' : 'haut';
                
                if (currentDir === null) {
                    currentDir = dir;
                    currentDist = 1;
                } else if (dir === currentDir) {
                    currentDist++;
                } else {
                    segments.push({direction: currentDir, distance: currentDist});
                    currentDir = dir;
                    currentDist = 1;
                }
            }
            if (currentDir !== null) {
                segments.push({direction: currentDir, distance: currentDist});
            }
            
            console.log('[Nav]  Segments:', segments.map(s => s.direction + ' ' + (s.distance*0.5).toFixed(1) + 'm'));
            console.log('[Nav] 👁️ Direction de départ:', directionDepart);
            
            let totalDistance = 0;
            let etape = 1;
            
            if (segments.length > 0) {
                const premierSegment = segments[0];
                const metres = (premierSegment.distance * 0.5).toFixed(1);
                totalDistance += premierSegment.distance;
                
                const premierVirage = calculerVirage(directionDepart, premierSegment.direction);
                
                if (premierVirage === 'tout droit') {
                    instructions.push({
                        numero: etape++,
                        texte: '<span class="action">Avancez tout droit</span> sur ' + metres + ' m'
                    });
                } else if (premierVirage === 'demi-tour') {
                    instructions.push({
                        numero: etape++,
                        texte: '<span class="action">Faites demi-tour</span> et avancez sur ' + metres + ' m'
                    });
                } else {
                    instructions.push({
                        numero: etape++,
                        texte: '<span class="action">Tournez à ' + premierVirage + '</span> et avancez sur ' + metres + ' m'
                    });
                }
            }
            
            for (let i = 1; i < segments.length; i++) {
                const seg = segments[i];
                const metres = (seg.distance * 0.5).toFixed(1);
                totalDistance += seg.distance;
                
                const virage = calculerVirage(segments[i-1].direction, seg.direction);
                
                instructions.push({
                    numero: etape++,
                    texte: '<span class="action">Tournez à ' + virage + '</span> et avancez sur ' + metres + ' m'
                });
            }
            
            instructions.push({
                numero: etape++,
                texte: '<span class="action">Vous êtes arrivé au stand <strong>' + numArrivee + ' - ' + standArrivee.nom + '</strong></span>'
            });
            
            const distanceMetres = (totalDistance * 0.5).toFixed(1);
            const tempsSecondes = Math.round(totalDistance * 0.5 / 1.2);
            
            let html = '';
            instructions.forEach(function(inst) {
                html += '<div class="instruction-step"><span class="step-number">' + inst.numero + '.</span>' + inst.texte + '</div>';
            });
            
            document.getElementById('instructionsList').innerHTML = html;
            document.getElementById('statDistance').textContent = distanceMetres;
            document.getElementById('statTime').textContent = tempsSecondes;
            document.getElementById('instructions').classList.add('visible');
        }
        
        function calculerVirage(directionActuelle, nouvelleDirection) {
            const ordres = ['haut', 'droite', 'bas', 'gauche'];
            const idxActuel = ordres.indexOf(directionActuelle);
            const idxNouveau = ordres.indexOf(nouvelleDirection);
            const diff = (idxNouveau - idxActuel + 4) % 4;
            if (diff === 1) return 'droite';
            if (diff === 3) return 'gauche';
            if (diff === 2) return 'demi-tour';
            return 'tout droit';
        }
        
        chargerDonnees();
    </script>
