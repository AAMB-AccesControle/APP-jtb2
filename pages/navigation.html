<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation entre stands v0.06</title>
    <link rel="manifest" href="../manifest.json">
    <script>
    if (localStorage.getItem('darkMode') === '1') { document.documentElement.classList.add('dark'); }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #f5f7fa; --text: #222; --text-sub: #666; --card-bg: white;
            --page-header-bg: #1a3a6b; --primary: #1a3a6b; --success: #10b981;
        }
        body.dark {
            --bg: #181c2a; --text: #eee; --text-sub: #999; --card-bg: #242840;
            --page-header-bg: #0f1f3d; --primary: #2a5f9f;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); min-height: 100vh; }
        
        .page-header { background: var(--page-header-bg); color: white; padding: 14px 20px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 10; }
        .back-btn { background: none; border: none; color: white; font-size: 22px; cursor: pointer; }
        .page-header h2 { font-size: 18px; flex: 1; }
        .page-content { padding: 16px; max-width: 600px; margin: 0 auto; }
        
        .nav-section {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .nav-section h3 { font-size: 13px; color: var(--text-sub); margin-bottom: 10px; font-weight: 600; }
        .nav-section select {
            width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 8px;
            font-size: 14px; background: var(--bg); color: var(--text); margin-bottom: 10px;
        }
        .nav-section select:focus { border-color: var(--primary); outline: none; }
        
        .btn-calculate {
            width: 100%; padding: 12px; background: var(--primary); color: white;
            border: none; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer;
        }
        .btn-calculate:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .instructions {
            background: var(--card-bg); border-radius: 12px; padding: 15px;
            margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: none;
        }
        .instructions.visible { display: block; }
        .instructions h3 { font-size: 14px; color: var(--text); margin-bottom: 12px; font-weight: 700; }
        
        .instruction-step {
            padding: 10px; margin-bottom: 8px; background: var(--bg); border-radius: 8px;
            border-left: 4px solid var(--primary); font-size: 13px; color: var(--text);
        }
        .instruction-step .step-number { font-weight: bold; color: var(--primary); margin-right: 8px; }
        
        .stats {
            display: flex; gap: 15px; margin-top: 12px; padding-top: 12px;
            border-top: 1px solid rgba(128,128,128,0.2);
        }
        .stat-item { flex: 1; text-align: center; }
        .stat-value { font-size: 18px; font-weight: bold; color: var(--primary); }
        .stat-label { font-size: 11px; color: var(--text-sub); }
        .loading { text-align: center; padding: 20px; color: var(--text-sub); }
        
        @media (max-width: 480px) { .page-header { top: 90px; } }
    </style>
</head>
<body>
    <div class="page-header">
        <button class="back-btn" onclick="retourAccueil()">←</button>
        <h2>🗺️ Navigation entre stands</h2>
    </div>
    <div class="page-content">
        <div id="loading" class="loading">Chargement du plan de la salle...</div>
        
        <div class="nav-section" id="navForm" style="display:none;">
            <h3>📍 Je suis au stand :</h3>
            <select id="standDepart"><option value="">-- Sélectionnez --</option></select>
            
            <h3>🎯 Je veux aller au stand :</h3>
            <select id="standArrivee"><option value="">-- Sélectionnez --</option></select>
            
            <button class="btn-calculate" id="btnCalculate" onclick="calculerItineraire()" disabled>
                 Calculer l'itinéraire
            </button>
        </div>
        
        <div id="instructions" class="instructions">
            <h3>📋 Itinéraire :</h3>
            <div id="instructionsList"></div>
            <div class="stats">
                <div class="stat-item"><div class="stat-value" id="statDistance">-</div><div class="stat-label">Distance (m)</div></div>
                <div class="stat-item"><div class="stat-value" id="statTime">-</div><div class="stat-label">Temps (sec)</div></div>
            </div>
        </div>
    </div>

    <script src="../js/commun.js"></script>
    <script>
        verifierConnexionOuRediriger();
        
        let stands = [];
        let grille = [];
        
        // ============================================
        // CHARGEMENT DES DONNÉES
        // ============================================
        async function chargerDonnees() {
            try {
                const respStands = await fetch(SCRIPT_URL + '?action=getStands');
                const dataStands = await respStands.json();
                if (dataStands.success) {
                    stands = dataStands.stands.sort((a, b) => a.numero - b.numero);
                    remplirSelects();
                    console.log('[Nav] ' + stands.length + ' stands chargés');
                }
                
                const respGrille = await fetch(SCRIPT_URL + '?action=getGrilleSalle');
                const dataGrille = await respGrille.json();
                if (dataGrille.success) {
                    grille = dataGrille.grille;
                    console.log('[Nav] Grille chargée: ' + grille.length + ' x ' + grille[0].length);
                }
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('navForm').style.display = 'block';
            } catch (e) {
                console.error('[Nav] Erreur:', e);
                document.getElementById('loading').textContent = 'Erreur de chargement. Vérifiez votre connexion.';
            }
        }
        
        function remplirSelects() {
            const selectDepart = document.getElementById('standDepart');
            const selectArrivee = document.getElementById('standArrivee');
            
            stands.forEach(stand => {
                const text = stand.numero + ' - ' + stand.nom;
                selectDepart.add(new Option(text, stand.numero));
                selectArrivee.add(new Option(text, stand.numero));
            });
            
            const verifier = () => {
                const d = selectDepart.value;
                const a = selectArrivee.value;
                document.getElementById('btnCalculate').disabled = !(d && a && d !== a);
            };
            selectDepart.addEventListener('change', verifier);
            selectArrivee.addEventListener('change', verifier);
        }
        
        // ============================================
        // TROUVER L'ENTRÉE D'UN STAND
        // ============================================
        function trouverEntreeStand(numeroStand) {
            const numStr = String(numeroStand);
            console.log('[Nav] 🔍 Recherche entrée stand ' + numeroStand + '...');
            
            let celluleTrouvee = null;
            
            for (let y = 0; y < grille.length; y++) {
                for (let x = 0; x < grille[0].length; x++) {
                    const cellule = String(grille[y][x] || '').trim();
                    
                    if (cellule.startsWith(numStr + ' ') || cellule.startsWith(numStr + '\n') || cellule === numStr) {
                        console.log('[Nav] ✅ Cellule stand trouvée en (' + x + ', ' + y + '): "' + cellule + '"');
                        celluleTrouvee = {x: x, y: y};
                        
                        const voisins = [
                            {x: x+1, y: y}, {x: x-1, y: y},
                            {x: x, y: y+1}, {x: x, y: y-1}
                        ];
                        
                        for (const v of voisins) {
                            if (v.y >= 0 && v.y < grille.length && v.x >= 0 && v.x < grille[0].length) {
                                const valVoisin = String(grille[v.y][v.x] || '').trim();
                                if (valVoisin === '' || valVoisin === 'PAUSE') {
                                    console.log('[Nav] ✅ Entrée trouvée en (' + v.x + ', ' + v.y + ')');
                                    return {x: v.x, y: v.y};
                                }
                            }
                        }
                    }
                }
            }
            
            if (celluleTrouvee) {
                console.log('[Nav] ⚠️ Stand trouvé mais aucune allée adjacente');
                return celluleTrouvee;
            }
            
            console.error('[Nav] ❌ Stand ' + numeroStand + ' NON TROUVÉ dans la grille');
            return null;
        }
        
        // ============================================
        // ALGORITHME A* (plus court chemin)
        // ============================================
        function aStar(start, end, grid) {
            if (!start || !end) {
                console.error('[Nav] ❌ Points de départ ou d\'arrivée invalides');
                return null;
            }
            
            console.log('[Nav] 🚀 A* démarré: (' + start.x + ',' + start.y + ') → (' + end.x + ',' + end.y + ')');
            
            const openSet = [{x: start.x, y: start.y, g: 0, h: 0, f: 0, parent: null}];
            const closedSet = new Set();
            const height = grid.length;
            const width = grid[0].length;
            let iterations = 0;
            
            while (openSet.length > 0) {
                iterations++;
                if (iterations > 10000) {
                    console.error('[Nav] ❌ Trop d\'itérations (10000), abandon');
                    return null;
                }
                
                openSet.sort((a, b) => a.f - b.f);
                const current = openSet.shift();
                const key = current.x + ',' + current.y;
                
                if (current.x === end.x && current.y === end.y) {
                    const chemin = [];
                    let node = current;
                    while (node) {
                        chemin.unshift({x: node.x, y: node.y});
                        node = node.parent;
                    }
                    console.log('[Nav] ✅ Chemin trouvé: ' + chemin.length + ' cellules en ' + iterations + ' itérations');
                    return chemin;
                }
                
                closedSet.add(key);
                const voisins = [
                    {x: current.x+1, y: current.y},
                    {x: current.x-1, y: current.y},
                    {x: current.x, y: current.y+1},
                    {x: current.x, y: current.y-1}
                ];
                
                for (const v of voisins) {
                    if (v.x < 0 || v.x >= width || v.y < 0 || v.y >= height) continue;
                    const vKey = v.x + ',' + v.y;
                    if (closedSet.has(vKey)) continue;
                    
                    const val = String(grid[v.y][v.x] || '').trim();
                    const estAllee = val === '' || val === 'PAUSE';
                    if (!estAllee) continue;
                    
                    const g = current.g + 1;
                    const h = Math.abs(v.x - end.x) + Math.abs(v.y - end.y);
                    const f = g + h;
                    
                    const existing = openSet.find(n => n.x === v.x && n.y === v.y);
                    if (existing) {
                        if (g < existing.g) {
                            existing.g = g;
                            existing.f = f;
                            existing.parent = current;
                        }
                    } else {
                        openSet.push({x: v.x, y: v.y, g: g, h: h, f: f, parent: current});
                    }
                }
            }
            
            console.error('[Nav] ❌ Aucun chemin trouvé après ' + iterations + ' itérations');
            return null;
        }
        
        // ============================================
        // CALCULER L'ITINÉRAIRE
        // ============================================
        function calculerItineraire() {
            const numDepart = parseInt(document.getElementById('standDepart').value);
            const numArrivee = parseInt(document.getElementById('standArrivee').value);
            
            console.log('[Nav] 🧭 Calcul itinéraire: stand ' + numDepart + ' → stand ' + numArrivee);
            
            if (!numDepart || !numArrivee) {
                alert('Veuillez sélectionner les deux stands');
                return;
            }
            
            if (numDepart === numArrivee) {
                alert('Veuillez sélectionner deux stands différents');
                return;
            }
            
            const start = trouverEntreeStand(numDepart);
            const end = trouverEntreeStand(numArrivee);
            
            if (!start) {
                alert('❌ Impossible de trouver le stand ' + numDepart + ' dans le plan.');
                return;
            }
            if (!end) {
                alert('❌ Impossible de trouver le stand ' + numArrivee + ' dans le plan.');
                return;
            }
            
            console.log('[Nav]  Départ: (' + start.x + ', ' + start.y + ')');
            console.log('[Nav]  Arrivée: (' + end.x + ', ' + end.y + ')');
            
            const chemin = aStar(start, end, grille);
            
            if (chemin) {
                afficherInstructions(chemin, numDepart, numArrivee);
            } else {
                alert('❌ Impossible de trouver un chemin entre ces deux stands.\n\nVérifiez que les allées sont bien vides dans la grille.');
            }
        }
        
        // ============================================
        // AFFICHER LES INSTRUCTIONS
        // ============================================
        function afficherInstructions(chemin, numDepart, numArrivee) {
            if (!chemin || chemin.length < 2) return;
            
            const instructions = [];
            const standArrivee = stands.find(s => s.numero === numArrivee);
            
            // Vérifie si une cellule est une allée (vide ou "PAUSE")
            const estAllee = function(x, y) {
                if (y < 0 || y >= grille.length || x < 0 || x >= grille[0].length) return false;
                const val = String(grille[y][x] || '').trim();
                return val === '' || val === 'PAUSE';
            };
            
            // Détecte une VRAIE allée (intersection) : espace vide significatif sur le côté perpendiculaire
            // Une vraie allée = au moins 3 cellules de large (1.5m) sur le côté
            const estVraieAllee = function(x, y, direction) {
                let count = 0;
                if (direction === 'droite' || direction === 'gauche') {
                    let up = 0;
                    for (let i = y - 1; i >= 0 && estAllee(x, i); i--) up++;
                    let down = 0;
                    for (let i = y + 1; i < grille.length && estAllee(x, i); i++) down++;
                    count = up + down;
                } else {
                    let left = 0;
                    for (let i = x - 1; i >= 0 && estAllee(i, y); i--) left++;
                    let right = 0;
                    for (let i = x + 1; i < grille[0].length && estAllee(i, y); i++) right++;
                    count = left + right;
                }
                return count >= 3;
            };
            
            const getOrdinal = function(n) {
                return n === 1 ? '1ère' : n + 'ème';
            };
            
            // Analyser le chemin par segments de direction
            let segments = [];
            let currentDir = null;
            let currentDist = 0;
            let currentAllees = 0;
            
            for (let i = 1; i < chemin.length; i++) {
                const prev = chemin[i-1];
                const curr = chemin[i];
                const dx = curr.x - prev.x;
                const dy = curr.y - prev.y;
                const dir = dx === 1 ? 'droite' : dx === -1 ? 'gauche' : dy === 1 ? 'bas' : 'haut';
                
                if (currentDir === null) {
                    currentDir = dir;
                    currentDist = 1;
                    currentAllees = 0;
                } else if (dir === currentDir) {
                    currentDist++;
                    if (estVraieAllee(curr.x, curr.y, currentDir)) {
                        currentAllees++;
                    }
                } else {
                    segments.push({ direction: currentDir, distance: currentDist, allees: currentAllees });
                    currentDir = dir;
                    currentDist = 1;
                    currentAllees = 0;
                }
            }
            if (currentDir !== null) {
                segments.push({ direction: currentDir, distance: currentDist, allees: currentAllees });
            }
            
            console.log('[Nav] 📊 Segments:', segments.map(s => s.direction + ' ' + (s.distance*0.5).toFixed(1) + 'm (' + s.allees + ' allées)'));
            
            // Générer les instructions
            let totalDistance = 0;
            
            for (let i = 0; i < segments.length; i++) {
                const seg = segments[i];
                const metres = (seg.distance * 0.5).toFixed(1);
                totalDistance += seg.distance;
                
                if (i === 0) {
                    if (segments.length > 1) {
                        const virage = calculerVirage(seg.direction, segments[1].direction);
                        if (seg.allees > 0) {
                            instructions.push('Dirigez-vous vers le ' + seg.direction.toUpperCase() + '. À la ' + getOrdinal(seg.allees) + ' allée (' + metres + ' m), tournez à ' + virage);
                        } else {
                            instructions.push('Dirigez-vous vers le ' + seg.direction.toUpperCase() + ' sur ' + metres + ' m, puis tournez à ' + virage);
                        }
                    } else {
                        instructions.push('Dirigez-vous vers le ' + seg.direction.toUpperCase() + ' sur ' + metres + ' m');
                    }
                } else if (i < segments.length - 1) {
                    const nextVirage = calculerVirage(seg.direction, segments[i+1].direction);
                    if (seg.allees > 0) {
                        instructions.push('Continuez tout droit. À la ' + getOrdinal(seg.allees) + ' allée (' + metres + ' m), tournez à ' + nextVirage);
                    } else {
                        instructions.push('Avancez de ' + metres + ' m, puis tournez à ' + nextVirage);
                    }
                } else {
                    const virage = calculerVirage(segments[i-1].direction, seg.direction);
                    instructions.push('Tournez à ' + virage + ' et avancez de ' + metres + ' m');
                    instructions.push('Vous êtes arrivé au stand ' + numArrivee + ' (' + standArrivee.nom + ')');
                }
            }
            
            const distanceMetres = (totalDistance * 0.5).toFixed(1);
            const tempsSecondes = Math.round(totalDistance * 0.5 / 1.2);
            
            let html = '';
            instructions.forEach(function(inst, idx) {
                html += '<div class="instruction-step"><span class="step-number">' + (idx + 1) + '.</span>' + inst + '</div>';
            });
            
            document.getElementById('instructionsList').innerHTML = html;
            document.getElementById('statDistance').textContent = distanceMetres;
            document.getElementById('statTime').textContent = tempsSecondes;
            document.getElementById('instructions').classList.add('visible');
        }
        
        // ============================================
        // CALCULER LE VIRAGE
        // ============================================
        function calculerVirage(directionActuelle, nouvelleDirection) {
            const ordres = ['haut', 'droite', 'bas', 'gauche'];
            const idxActuel = ordres.indexOf(directionActuelle);
            const idxNouveau = ordres.indexOf(nouvelleDirection);
            const diff = (idxNouveau - idxActuel + 4) % 4;
            
            if (diff === 1) return 'DROITE';
            if (diff === 3) return 'GAUCHE';
            if (diff === 2) return 'DEMI-TOUR';
            return 'TOUT DROIT';
        }
        
        // ============================================
        // INITIALISATION
        // ============================================
        chargerDonnees();
    </script>
</body>
</html>
