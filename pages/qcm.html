* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    background-color: #050811;
    background-image:
        radial-gradient(circle at 15% 15%, rgba(0, 242, 254, 0.08) 0%, transparent 40%),

}
body::before {
    content: '';

    pointer-events: none; z-index: 0;
    background-size: 40px 40px;

.glass-panel {

.loading {

    font-family: 'Rajdhani', sans-serif;

    font-size: 13px;
}
.loading::before {
    content: '';

    width: 40px; height: 40px;

}

.q-societe {

        </div>
    </div>
</div>

<script>
verifierConnexionOuRediriger();
const adherent = chargerAdherent();

let state = null;
let offsetMs = 0;
let tickTimer = null;
let quiz = null;
let envoiEnCours = false;
let reloadFlag = false;

function clientNow() { return Date.now() + offsetMs; }
function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
function draftKey(token) { return 'aamb_qcm_draft_' + token; }
function penalitePoints(retardSec) { return 0.25 * Math.ceil(retardSec / 10); }
function fmtDuree(ms) {
    if (ms < 0) ms = 0;
    const s = Math.floor(ms / 1000);
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    return (h > 0 ? h + 'h ' : '') + String(m).padStart(2, '0') + 'min ' + String(sec).padStart(2, '0') + 's';
}

async function chargerEtat(silent) {
    try {
        const resp = await fetch(SCRIPT_URL + '?action=getQCMState&userId=' + encodeURIComponent(adherent.id));
        const data = await resp.json();
        if (!data.success) throw new Error(data.message || 'Erreur inconnue');
        offsetMs = data.nowMs - Date.now();
        state = data.pauses;
        if (!quiz) renderListe();
    } catch (e) {
        if (!silent) document.getElementById('errorBox').innerHTML = '<div class="error-msg">❌ Erreur : ' + escapeHtml(e.message) + '</div>';
        document.getElementById('loading').style.display = 'none';
    }
}

function statutLive(p) {
    if (p.statut === 'envoye') return 'envoye';
    if (!p.debutMs || !p.finMs) return 'nonconfigure';
    const now = clientNow();
    if (now < p.debutMs) return 'avant';
    if (now <= p.finMs) return 'ouvert';
    return 'clos';
}

function renderListe() {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('listView').style.display = 'block';
    document.getElementById('quizView').style.display = 'none';
    quiz = null;

    const g = state.length ? state[0].groupe : '?';
    document.getElementById('userInfo').innerHTML =
        '<i class="fa-solid fa-user"></i> ' + escapeHtml(adherent.prenom) + ' ' + escapeHtml(adherent.nom) + ' — Groupe <strong>' + escapeHtml(g) + '</strong>';

    const labels = { avant: 'À venir', ouvert: 'EN COURS', clos: 'Terminée', envoye: 'Envoyée', nonconfigure: 'Horaires non définis' };
    const icons = { avant: 'fa-clock', ouvert: 'fa-play', clos: 'fa-flag-checkered', envoye: 'fa-check', nonconfigure: 'fa-gear' };
    let html = '';
    state.forEach(p => {
        const st = statutLive(p);
        html += '<div class="pause-card ' + st + '">';
        html += '<div class="pause-head"><span class="pause-title">Pause ' + p.pause + '</span><span><span class="couleur-chip couleur-' + p.couleur + '">' + p.couleur + '</span><span class="badge ' + st + '"><i class="fa-solid ' + icons[st] + '"></i> ' + labels[st] + '</span></span></div>';
        let info = '<i class="fa-regular fa-calendar"></i> ' + (p.jour || '—') + ' • <i class="fa-regular fa-clock"></i> ' + (p.debut || '--:--') + ' → ' + (p.fin || '--:--');
        if (st === 'envoye' && p.soumission) {
            info += ' • <i class="fa-solid fa-check-double"></i> Envoyé le ' + p.soumission.horodatage + (Number(p.soumission.retard) > 0 ? ' (retard ' + p.soumission.retard + ' s)' : ' (à l\'heure)');
        }
        html += '<div class="pause-info">' + info + '</div>';
        if (st === 'avant') {
            html += '<div class="countdown" id="cd-' + p.pause + '" data-mode="avant" data-target="' + p.debutMs + '">Ouverture dans<span class="big">--</span></div>';
        } else if (st === 'ouvert') {
            html += '<button class="btn-open" onclick="ouvrirQuestionnaire(' + p.pause + ')"><i class="fa-solid fa-pen-to-square"></i> Ouvrir mon questionnaire</button>';
        } else if (st === 'clos') {
            html += '<div class="countdown" id="cd-' + p.pause + '" data-mode="clos" data-target="' + p.finMs + '"></div>';
            html += '<button class="btn-open late" style="margin-top:10px;" onclick="ouvrirQuestionnaire(' + p.pause + ')"><i class="fa-solid fa-triangle-exclamation"></i> Ouvrir (retard pénalisé)</button>';
        }
        html += '</div>';
    });
    document.getElementById('pausesContainer').innerHTML = html;
    majCountdowns();
}

function majCountdowns() {
    document.querySelectorAll('.countdown').forEach(el => {
        const mode = el.dataset.mode;
        const target = Number(el.dataset.target);
        const now = clientNow();
        if (mode === 'avant') {
            const reste = target - now;
            el.innerHTML = 'Ouverture dans<span class="big">' + fmtDuree(reste) + '</span>';
            if (reste <= 0 && !reloadFlag) { reloadFlag = true; chargerEtat(true).then(() => { reloadFlag = false; }); }
        } else if (mode === 'clos') {
            const ret = Math.max(0, Math.floor((now - target) / 1000));
            el.innerHTML = '⚠️ Retard actuel : ' + ret + ' s<span class="big">Pénalité : -' + penalitePoints(ret).toFixed(2) + ' pts</span>';
        }
    });
}

async function ouvrirQuestionnaire(pauseNum) {
    const p = state.find(x => x.pause === pauseNum);
    if (!p) return;
    try {
        const resp = await fetch(SCRIPT_URL + '?action=getQuestionnaire&token=' + encodeURIComponent(p.token));
        const data = await resp.json();
        if (!data.success) { alert(data.message); return; }
        quiz = { pause: p.pause, token: p.token, couleur: p.couleur, finMs: p.finMs, questions: data.questions, answers: {} };
        const draft = localStorage.getItem(draftKey(p.token));
        if (draft) { try { quiz.answers = JSON.parse(draft).answers || {}; } catch (e) { quiz.answers = {}; } }
        renderQuiz();
    } catch (e) {
        alert('Erreur de connexion');
    }
}

function renderQuiz() {
    document.getElementById('listView').style.display = 'none';
    document.getElementById('quizView').style.display = 'block';
    // Infos de la pause (sans le barème)
    document.getElementById('quizMeta').innerHTML =
        'Pause ' + quiz.pause + ' • Stands <strong>' + quiz.couleur + '</strong> • ' + quiz.questions.length + ' questions • Plusieurs réponses possibles par question';

    // Barème de notation (élément séparé et sticky)
    let scoringHTML = document.getElementById('scoringLegend');
    if (!scoringHTML) {
        scoringHTML = document.createElement('div');
        scoringHTML.id = 'scoringLegend';
        scoringHTML.className = 'scoring-legend';
        // Insérer juste après quizMeta
        document.getElementById('quizMeta').parentNode.insertBefore(scoringHTML, document.getElementById('quizMeta').nextSibling);
    }
    scoringHTML.innerHTML =
        '<div class="legend-title"><i class="fa-solid fa-scale-balanced"></i> Barème de notation</div>' +
        '<div class="scoring-rule rule-3pts"><span class="pts">+3 pts</span><span class="desc">Toutes les bonnes réponses, aucune mauvaise</span></div>' +
        '<div class="scoring-rule rule-1pt"><span class="pts">+1 pt</span><span class="desc">Que des bonnes réponses, mais il en manque</span></div>' +
        '<div class="scoring-rule rule-0pt"><span class="pts">0 pt</span><span class="desc">Aucune réponse cochée</span></div>' +
        '<div class="scoring-rule rule-minus2"><span class="pts">−2 pts</span><span class="desc">Au moins 1 mauvaise réponse cochée</span></div>' +
        '<div class="scoring-rule rule-penalty"><span class="pts">−0,25 pt</span><span class="desc">Par tranche de 10 s de retard</span></div>';

    let html = '';
    quiz.questions.forEach((q, i) => {
        html += '<div class="q-card">';
        html += '<div class="q-head"><span class="q-societe"><i class="fa-solid fa-building"></i> ' + escapeHtml(q.societe) + '</span><span class="q-num">Q' + (i + 1) + '/' + quiz.questions.length + '</span></div>';
        html += '<div class="q-texte">' + escapeHtml(q.texte) + '</div>';
        html += '<div class="q-props">';
        q.props.forEach(pr => {
            const checked = (quiz.answers[q.questionId] || '').indexOf(pr.lettre) !== -1 ? ' checked' : '';
            html += '<label class="q-prop"><input type="checkbox" data-q="' + q.questionId + '" value="' + pr.lettre + '"' + checked + ' onchange="majReponse(this)"><span class="q-lettre">' + pr.lettre + '</span><span>' + escapeHtml(pr.texte) + '</span></label>';
        });
        html += '</div></div>';
    });
    document.getElementById('quizQuestions').innerHTML = html;
    majProgress();
    majQuizTimer();
}

function majReponse(cb) {
    const qid = cb.dataset.q;
    let lettres = '';
    document.querySelectorAll('input[data-q="' + qid + '"]').forEach(b => { if (b.checked) lettres += b.value; });
    lettres = lettres.split('').sort().join('');
    if (lettres) quiz.answers[qid] = lettres; else delete quiz.answers[qid];
    localStorage.setItem(draftKey(quiz.token), JSON.stringify({ answers: quiz.answers, savedAt: Date.now() }));
    majProgress();
}

function majProgress() {
    const done = Object.keys(quiz.answers).length;
    document.getElementById('quizProgress').innerHTML =
        '<i class="fa-solid fa-circle-check"></i> ' + done + '/' + quiz.questions.length + ' questions complétées • <i class="fa-solid fa-floppy-disk"></i> Brouillon enregistré';
}

function majQuizTimer() {
    const el = document.getElementById('quizTimer');
    if (!quiz || !el) return;
    const now = clientNow();
    if (!quiz.finMs) { el.textContent = ''; return; }
    if (now <= quiz.finMs) {
        const reste = quiz.finMs - now;
        el.className = 'quiz-timer' + (reste <= 5 * 60 * 1000 ? ' warn' : '');
        el.innerHTML = '<i class="fa-solid fa-hourglass-half"></i> ' + fmtDuree(reste);
    } else {
        const ret = Math.floor((now - quiz.finMs) / 1000);
        el.className = 'quiz-timer late';
        el.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Retard ' + ret + 's → -' + penalitePoints(ret).toFixed(2) + ' pts';
    }
}

function quitterQuestionnaire() {
    quiz = null;
    chargerEtat(true);
    renderListe();
}

async function envoyerQuestionnaire() {
    if (envoiEnCours || !quiz) return;
    const total = quiz.questions.length;
    const done = Object.keys(quiz.answers).length;
    const ret = quiz.finMs ? Math.max(0, Math.floor((clientNow() - quiz.finMs) / 1000)) : 0;

    let msg = 'Envoyer DÉFINITIVEMENT ce questionnaire ?\n\n' + done + '/' + total + ' questions complétées.';
    if (done < total) msg += '\n⚠️ ' + (total - done) + ' question(s) sans réponse (0 point).';
    if (ret > 0) msg += '\n⚠️ Retard : ' + ret + ' s → pénalité -' + penalitePoints(ret).toFixed(2) + ' pts.';
    if (!confirm(msg)) return;

    envoiEnCours = true;
    const btn = document.getElementById('btnSubmit');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-hourglass-half"></i> Envoi en cours...';
    try {
        const params = new URLSearchParams({
            action: 'submitQCM',
            userId: adherent.id,
            token: quiz.token,
            answers: JSON.stringify(quiz.answers)
        });
        const resp = await fetch(SCRIPT_URL + '?' + params);
        const data = await resp.json();
        if (data.success) {
            // On efface le brouillon local
            localStorage.removeItem(draftKey(quiz.token));
            
            // On affiche un message de succès simple, SANS montrer le score
            document.getElementById('quizView').innerHTML =
                '<div class="success-card"><div class="big">✅</div><h3>Questionnaire envoyé !</h3>' +
                '<p style="margin:12px 0;font-size:14px;">Merci pour votre participation. Vos réponses ont été enregistrées avec succès.</p>' +
                '<button class="btn-open" onclick="window.location.reload()" style="margin-top:15px;"><i class="fa-solid fa-arrow-rotate-left"></i> Retour à mes pauses</button></div>';
            quiz = null;
            
        } else {
            // Ce bloc doit absolument rester pour gérer les erreurs
            alert('Erreur : ' + data.message);
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Envoyer mes réponses';
        }
    } catch (e) {
        alert('Erreur de connexion');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Envoyer mes réponses';
    }
    envoiEnCours = false;
}

function tick() {
    if (quiz) majQuizTimer();
    else majCountdowns();
}
tickTimer = setInterval(tick, 1000);
setInterval(() => { if (!quiz) chargerEtat(true); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !quiz) chargerEtat(true); });

chargerEtat();
</script>
</body>
</html>
