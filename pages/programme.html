<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Programme JTB 2026 v0.33</title>
<link rel="manifest" href="../manifest.json">
<script>
if (localStorage.getItem('darkMode') === '1') { document.documentElement.classList.add('dark'); }
</script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
--bg: #f5f7fa; --text: #222; --text-sub: #666; --card-bg: white;
--page-header-bg: #1a3a6b; --heure-bg: #555;
--conf-bg: #ffcdd5; --conf-border: #c0002a;
--atelier-bg: #c8e0f7; --atelier-border: #1565c0; --atelier-text: #1a3a6b;
--jour-btn-bg: #dde3ef; --jour-btn-text: #333;
--badge-en-cours-bg: #2d2d2d; --badge-en-cours-text: white;
--conf-en-cours-bg: #7a1520; --conf-en-cours-border: #5a0f18;
--atelier-en-cours-bg: #1e6090; --atelier-en-cours-border: #144a70;
}
body.dark {
--bg: #181c2a; --text: #eee; --text-sub: #999; --card-bg: #242840;
--page-header-bg: #0f1f3d; --heure-bg: #3a3d55;
--conf-bg: #3d1525; --conf-border: #c0002a;
--atelier-bg: #1e2d42; --atelier-border: #1565c0; --atelier-text: #90caf9;
--jour-btn-bg: #2a2d45; --jour-btn-text: #ccc;
--badge-en-cours-bg: #2d2d2d; --badge-en-cours-text: white;
--conf-en-cours-bg: #7a1520; --conf-en-cours-border: #5a0f18;
--atelier-en-cours-bg: #1e6090; --atelier-en-cours-border: #144a70;
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); min-height: 100vh; }

.page-header { background: var(--page-header-bg); color: white; padding: 14px 20px; display: flex; align-items: center; gap: 12px; }
.back-btn { background: none; border: none; color: white; font-size: 22px; cursor: pointer; }
.page-header h2 { font-size: 18px; }
.page-content { padding: 10px; }

.jour-btns { display: flex; gap: 7px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 4px; }
.jour-btn { background: var(--jour-btn-bg); color: var(--jour-btn-text); border: none; padding: 7px 13px; border-radius: 18px; cursor: pointer; font-size: 12px; white-space: nowrap; font-weight: 500; }
.jour-btn.active { background: #1a3a6b; color: white; }

.prog-slot { margin-bottom: 10px; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
.prog-heure { background: var(--heure-bg); color: white; padding: 5px 12px; font-size: 12px; font-weight: bold; display: flex; align-items: center; justify-content: space-between; }
.badge-en-cours {
    background: var(--badge-en-cours-bg);
    color: var(--badge-en-cours-text);
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: bold;
    letter-spacing: 0.5px;
    display: none;
}
.prog-slot.en-cours .badge-en-cours { display: inline-block; }

.prog-conf { background: var(--conf-bg); padding: 10px 12px; font-size: 13px; color: var(--text); border-left: 4px solid var(--conf-border); transition: all 0.3s; }
.prog-ateliers { display: flex; }
.atelier { flex: 1; background: var(--atelier-bg); padding: 7px 10px; font-size: 11px; color: var(--atelier-text); border-top: 1px solid rgba(128,128,128,0.2); border-left: 4px solid var(--atelier-border); transition: all 0.3s; }
.atelier:last-child { border-left: 1px solid rgba(128,128,128,0.2); }
.atelier strong { font-size: 12px; }

.prog-slot.en-cours .prog-heure { background: var(--badge-en-cours-bg) !important; }
.prog-slot.en-cours .prog-conf {
    background: var(--conf-en-cours-bg) !important;
    border-left: 4px solid var(--conf-en-cours-border) !important;
    font-weight: bold;
    color: white !important;
}
.prog-slot.en-cours .prog-conf small { color: rgba(255,255,255,0.85) !important; }
.prog-slot.en-cours .atelier {
    background: var(--atelier-en-cours-bg) !important;
    border-left: 4px solid var(--atelier-en-cours-border) !important;
    color: white !important;
    font-weight: bold;
}
.prog-slot.en-cours .atelier strong { color: white !important; }

#zoneSwipe { overflow: hidden; position: relative; }
.jour-content { transition: none; }
.jour-content.slide-out-left { animation: slideOutLeft 0.3s ease forwards; }
.jour-content.slide-out-right { animation: slideOutRight 0.3s ease forwards; }
.jour-content.slide-in-left { animation: slideInLeft 0.3s ease forwards; }
.jour-content.slide-in-right { animation: slideInRight 0.3s ease forwards; }

@keyframes slideOutLeft { from { transform: translateX(0); opacity: 1; } to { transform: translateX(-100%); opacity: 0; } }
@keyframes slideOutRight { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
@keyframes slideInLeft { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
@keyframes slideInRight { from { transform: translateX(-100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

.loading { text-align: center; padding: 40px; color: var(--text-sub); }
.spinner { border: 4px solid rgba(128,128,128,0.2); border-top: 4px solid var(--page-header-bg); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 12px; }
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

@media (max-width: 480px) {
    .page-header { top: 90px; }
}
</style>
</head>
<body>
<div class="page-header">
<button class="back-btn" onclick="retourAccueil()">←</button>
<h2>Programme JTB 2026</h2>
</div>
<div class="page-content">
<p style="text-align:center;color:var(--text-sub);font-size:13px;margin-bottom:10px;">43èmes JTB 2026 — Besançon</p>

<div id="loading" class="loading">
    <div class="spinner"></div>
    <div>Chargement du programme...</div>
</div>

<div id="programmeContent" style="display:none;">
    <div class="jour-btns">
        <button class="jour-btn" id="btn-mardi" onclick="afficherJour('mardi')">Mardi</button>
        <button class="jour-btn" id="btn-mercredi" onclick="afficherJour('mercredi')">Mercredi</button>
        <button class="jour-btn" id="btn-jeudi" onclick="afficherJour('jeudi')">Jeudi</button>
        <button class="jour-btn" id="btn-vendredi" onclick="afficherJour('vendredi')">Vendredi</button>
    </div>
    <div style="text-align:center;color:var(--text-sub);font-size:11px;margin-bottom:8px;">← Balayez pour changer de journée →</div>
    <div id="zoneSwipe">
        <div id="jour-mardi" class="jour-content" style="display:none;"></div>
        <div id="jour-mercredi" class="jour-content" style="display:none;"></div>
        <div id="jour-jeudi" class="jour-content" style="display:none;"></div>
        <div id="jour-vendredi" class="jour-content" style="display:none;"></div>
    </div>
</div>
</div>

<script src="../js/commun.js"></script>
<script>
verifierConnexionOuRediriger();

let programmeData = {};
const jours = ['mardi', 'mercredi', 'jeudi', 'vendredi'];
let isAnimating = false;
let jourActif = 'mardi';

async function chargerProgramme() {
    try {
        const cache = getProgrammeFromCache();
        let data;
        
        if (cache) {
            console.log('[Programme] Chargement depuis le cache');
            data = { success: true, programme: cache };
        } else {
            console.log('[Programme] Cache vide - Chargement depuis le serveur');
            const resp = await fetch(SCRIPT_URL + '?action=getProgramme');
            data = await resp.json();
        }
        
        if (data.success) {
            programmeData = {};
            data.programme.forEach(item => {
                const jour = item.jour.toLowerCase();
                if (!programmeData[jour]) programmeData[jour] = [];
                programmeData[jour].push(item);
            });
            
            for (const jour in programmeData) {
                programmeData[jour].sort((a, b) => a.heureDebut.localeCompare(b.heureDebut));
            }
            
            genererAffichage();
            
            document.getElementById('loading').style.display = 'none';
            document.getElementById('programmeContent').style.display = 'block';
            
            afficherJour('mardi');
            
            surbrillanceEnCours();
            setInterval(surbrillanceEnCours, 30000);
        } else {
            document.getElementById('loading').innerHTML = '<p style="color:red;">Erreur : ' + data.message + '</p>';
        }
    } catch (e) {
        document.getElementById('loading').innerHTML = '<p style="color:red;">Erreur de connexion</p>';
        console.error(e);
    }
}

function extraireHeure(str) {
    if (!str) return '';
    const match = String(str).match(/(\d{1,2}):(\d{2})/);
    if (match) {
        const h = String(parseInt(match[1])).padStart(2, '0');
        const m = match[2];
        return `${h}h${m}`;
    }
    return str;
}

function genererAffichage() {
    jours.forEach(jour => {
        const container = document.getElementById('jour-' + jour);
        const items = programmeData[jour] || [];
        
        const groupes = {};
        items.forEach(item => {
            const key = item.heureDebut + '-' + item.heureFin;
            if (!groupes[key]) groupes[key] = { horaire: key, items: [] };
            groupes[key].items.push(item);
        });
        
        let html = '';
        for (const key in groupes) {
            const groupe = groupes[key];
            const [debut, fin] = groupe.horaire.split('-');
            const heureFormatted = extraireHeure(debut) + ' - ' + extraireHeure(fin);
            
            const conference = groupe.items.find(i => i.type === 'Conference' || i.type === 'Accueil' || i.type === 'Pause' || i.type === 'Visite' || i.type === 'AG' || i.type === 'Ouverture' || i.type === 'Cloture' || i.type === 'Soiree');
            const atelier1 = groupe.items.find(i => i.type === 'Atelier1');
            const atelier2 = groupe.items.find(i => i.type === 'Atelier2');
            
            html += '<div class="prog-slot" data-id="' + (conference ? conference.id : '') + '" data-debut="' + debut + '" data-fin="' + fin + '">';
            html += '<div class="prog-heure"><span>' + heureFormatted + '</span><span class="badge-en-cours">🔴 EN COURS</span></div>';
            
            if (conference) {
                const desc = conference.description ? '<br><small>' + conference.description + '</small>' : '';
                html += '<div class="prog-conf"><strong>' + conference.nom + '</strong>' + desc + '</div>';
            }
            
            if (atelier1 || atelier2) {
                html += '<div class="prog-ateliers">';
                if (atelier1) {
                    const desc = atelier1.description ? '<br><strong>' + atelier1.description + '</strong>' : '';
                    html += '<div class="atelier">' + atelier1.nom + desc + '</div>';
                }
                if (atelier2) {
                    const desc = atelier2.description ? '<br><strong>' + atelier2.description + '</strong>' : '';
                    html += '<div class="atelier">' + atelier2.nom + desc + '</div>';
                }
                html += '</div>';
            }
            
            html += '</div>';
        }
        
        container.innerHTML = html;
    });
}

function afficherJour(jour, direction = null) {
    if (isAnimating) return;
    const ancienJour = jourActif;
    if (ancienJour === jour) return;
    
    if (!direction) {
        const ia = jours.indexOf(ancienJour);
        const in2 = jours.indexOf(jour);
        direction = in2 > ia ? 'left' : 'right';
    }
    
    const ancienEl = document.getElementById('jour-' + ancienJour);
    const nouveauEl = document.getElementById('jour-' + jour);
    
    isAnimating = true;
    document.querySelectorAll('.jour-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-' + jour).classList.add('active');
    
    nouveauEl.style.display = 'block';
    nouveauEl.style.position = 'absolute';
    nouveauEl.style.width = '100%';
    nouveauEl.style.top = '0';
    
    ancienEl.classList.add(direction === 'left' ? 'slide-out-left' : 'slide-out-right');
    nouveauEl.classList.add(direction === 'left' ? 'slide-in-left' : 'slide-in-right');
    
    setTimeout(() => {
        ancienEl.classList.remove('slide-out-left', 'slide-out-right');
        nouveauEl.classList.remove('slide-in-left', 'slide-in-right');
        ancienEl.style.display = 'none';
        nouveauEl.style.position = '';
        nouveauEl.style.width = '';
        nouveauEl.style.top = '';
        isAnimating = false;
    }, 300);
    
    jourActif = jour;
}

function surbrillanceEnCours() {
    const maintenant = new Date();
    const hNow = maintenant.getHours() * 60 + maintenant.getMinutes();
    
    document.querySelectorAll('.prog-slot').forEach(s => s.classList.remove('en-cours'));
    
    if (!jourActif) return;
    
    const slots = document.getElementById('jour-' + jourActif).querySelectorAll('.prog-slot');
    slots.forEach(slot => {
        const debut = slot.dataset.debut;
        const fin = slot.dataset.fin;
        if (debut && fin) {
            const [dh, dm] = debut.split(':').map(Number);
            const [fh, fm] = fin.split(':').map(Number);
            const debutMin = dh * 60 + dm;
            const finMin = fh * 60 + fm;
            
            if (hNow >= debutMin && hNow < finMin) {
                slot.classList.add('en-cours');
                setTimeout(() => slot.scrollIntoView({ behavior: 'smooth', block: 'center' }), 300);
            }
        }
    });
}

let touchStartX = 0, touchStartY = 0;
document.addEventListener('DOMContentLoaded', () => {
    const zoneSwipe = document.getElementById('zoneSwipe');
    if (zoneSwipe) {
        zoneSwipe.addEventListener('touchstart', e => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });
        
        zoneSwipe.addEventListener('touchend', e => {
            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;
            if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
                const idx = jours.indexOf(jourActif);
                let ni = idx + (dx < 0 ? 1 : -1);
                ni = Math.max(0, Math.min(3, ni));
                if (ni !== idx) afficherJour(jours[ni], dx < 0 ? 'left' : 'right');
            }
        }, { passive: true });
    }
});

chargerProgramme();
</script>
</body>
</html>
