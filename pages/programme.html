/* ---- Structure des cartes : anneau extérieur + contenu intérieur ---- */

/* ---- 6 COULEURS DE CATÉGORIES (prononcées / claires) ---- */

.cat-conf   { border-left: 4px solid #ff4da6; }

/* Soirées / AG = VIOLET vif */

/* Autres (Accueil, Inscription, Présentation, Ouverture, Clôture) = GRIS clair */

/* Ateliers = CYAN vif clair */
.atelier-block { border-left: 3px solid #33f5ff; background: linear-gradient(90deg, rgba(51, 245, 255, 0.08) 0%, transparent 70%); }
.atelier-block:hover { background: linear-gradient(90deg, rgba(51, 245, 255, 0.15) 0%, rgba(51, 245, 255, 0.04) 70%, transparent 100%); }

/* ---- SESSION "EN COURS" : glow pulsant + CHENILLARD (1 tour / 1 s) ---- */
.session-card.en-cours::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 200%;
    height: 200%;
    z-index: 1;
    pointer-events: none;
    background: conic-gradient(
        from 0deg,
        #ff1493 0deg,
        #ff8ec7 20deg,
        rgba(255, 140, 199, 0.45) 55deg,
        rgba(255, 140, 199, 0.15) 90deg,
        transparent 120deg,
        transparent 360deg
    );
    transform: translate(-50%, -50%) rotate(0deg);
    animation: rotateChenillard 1s linear infinite;
}
@keyframes rotateChenillard {
    0%   { transform: translate(-50%, -50%) rotate(0deg); }
    100% { transform: translate(-50%, -50%) rotate(360deg); }
}
.session-card.en-cours {
    border-color: rgba(255, 20, 147, 0.55) !important;
    animation: pulseLive 2.5s infinite ease-in-out;
}
@keyframes pulseLive {
    0%, 100% { box-shadow: 0 0 22px rgba(255, 20, 147, 0.30); }

}
.session-card.en-cours .live-badge { display: inline-flex !important; }
.live-badge {

    gap: 6px;

    box-shadow: 0 0 10px #ff1493, 0 0 20px rgba(255, 20, 147, 0.8);
    animation: blink 1.2s infinite;
}
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

/* ---- Swipe entre journées ---- */
#zoneSwipe { overflow: hidden; position: relative; }
.jour-content { transition: none; }
.jour-content.slide-out-left { animation: slideOutLeft 0.3s ease forwards; }
.jour-content.slide-out-right { animation: slideOutRight 0.3s ease forwards; }
.jour-content.slide-in-left { animation: slideInLeft 0.3s ease forwards; }
.jour-content.slide-in-right { animation: slideInRight 0.3s ease forwards; }
@keyframes slideOutLeft { from { transform: translateX(0); opacity: 1; } to { transform: translateX(-100%); opacity: 0; } }
@keyframes slideOutRight { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
@keyframes slideInLeft { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
@keyframes slideInRight { from { transform: translateX(-100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

<script>
verifierConnexionOuRediriger();

let programmeData = {};
let datesParJour = {};
const jours = ['mardi', 'mercredi', 'jeudi', 'vendredi'];
const nomsJoursFR = { mardi:'Mardi', mercredi:'Mercredi', jeudi:'Jeudi', vendredi:'Vendredi' };
let isAnimating = false;
let jourActif = null;

// ====================================================================
// CATÉGORISATION PAR CODE COLONNE A (6 catégories)
// ====================================================================
function categoriserItem(item) {
    const idUp = String(item.id || '').trim().toUpperCase();
    const typeUp = String(item.type || '').trim().toUpperCase();
    const lettreFin = (idUp.match(/([A-Z])$/) || [, ''])[1];

    // Ateliers (cyan)
    if (idUp.indexOf('ATEL') === 0) return { cat: 'atelier', subType: 'atelier', letter: lettreFin || 'A' };
    if (typeUp === 'ATELIER1') return { cat: 'atelier', subType: 'atelier', letter: 'A' };
    if (typeUp === 'ATELIER2') return { cat: 'atelier', subType: 'atelier', letter: 'B' };
    if (typeUp === 'ATELIER')  return { cat: 'atelier', subType: 'atelier', letter: lettreFin || 'A' };

    // Déjeuner (vert)
    if (idUp.indexOf('DEJ') === 0 || idUp.indexOf('REPAS') === 0 || idUp.indexOf('DEJEUNER') === 0) {
        return { cat: 'conf', subType: 'déjeuner', badgeLabel: 'Déjeuner', icon: 'fa-utensils' };
    }

    // Pauses + Visites stands (jaune)
    if (idUp.indexOf('PAUSE') === 0) return { cat: 'conf', subType: 'pause', badgeLabel: 'Pause', icon: 'fa-mug-hot' };
    if (idUp.indexOf('VISITE') === 0) return { cat: 'conf', subType: 'pause', badgeLabel: 'Visite des stands', icon: 'fa-store' };

    // Soirées + AG (violet)
    if (idUp.indexOf('AG') === 0 || typeUp === 'AG') return { cat: 'conf', subType: 'soiree', badgeLabel: 'Assemblée Générale', icon: 'fa-users' };
    if (idUp.indexOf('SOIREE') === 0 || typeUp === 'SOIREE' || typeUp === 'SOIRÉE') return { cat: 'conf', subType: 'soiree', badgeLabel: 'Soirée', icon: 'fa-champagne-glasses' };

    // Conférences (rose)
    if (idUp.indexOf('CONF') === 0 || typeUp === 'CONFERENCE' || typeUp === 'CONFÉRENCE') return { cat: 'conf', subType: 'conf', badgeLabel: 'Conférence', icon: 'fa-microphone' };

    // Autres : accueil, inscription, présentation, ouverture, clôture (gris)
    if (idUp.indexOf('ACC') === 0 || idUp.indexOf('INSCRIPTION') === 0 || idUp.indexOf('PRESENTATION') === 0 || idUp.indexOf('PRÉSENTATION') === 0) {
        return { cat: 'conf', subType: 'autre', badgeLabel: 'Accueil', icon: 'fa-door-open' };
    }
    if (idUp.indexOf('OUVERTURE') === 0) return { cat: 'conf', subType: 'autre', badgeLabel: 'Ouverture des JTB', icon: 'fa-flag' };
    if (idUp.indexOf('CLOTURE') === 0 || idUp.indexOf('CLÔTURE') === 0) return { cat: 'conf', subType: 'autre', badgeLabel: 'Clôture', icon: 'fa-flag-checkered' };

    return { cat: 'conf', subType: 'autre', badgeLabel: item.type || 'Session', icon: 'fa-circle-info' };
}

// ====================================================================
// CHARGEMENT DU PROGRAMME (cache + serveur)
// ====================================================================
async function chargerProgramme() {
    try {
        const cache = getProgrammeFromCache();
        let data;
        if (cache) {
            console.log('[Programme] Chargement depuis le cache');
            data = { success: true, programme: cache };
        } else {
            const resp = await fetch(SCRIPT_URL + '?action=getProgramme');
            data = await resp.json();
        }
        if (data.success) {
            programmeData = {};
            datesParJour = {};
            data.programme.forEach(item => {
                const jour = String(item.jour || '').toLowerCase();
                if (!programmeData[jour]) programmeData[jour] = [];
                programmeData[jour].push(item);
                if (item.date && !datesParJour[jour]) datesParJour[jour] = String(item.date).split('T')[0];
            });
            for (const jour in programmeData) {
                programmeData[jour].sort((a, b) => String(a.heureDebut).localeCompare(String(b.heureDebut)));
            }
            for (const j of jours) {
                const d = datesParJour[j];
                if (d) {
                    const parts = d.split('-');
                    document.getElementById('date-' + j).textContent = parts[2] + '/' + parts[1];
                }
            }
            genererAffichage();
            document.getElementById('loading').style.display = 'none';
            document.getElementById('programmeContent').style.display = 'block';
            afficherJourInitial(determinerJourAOuvrir());
            surbrillanceEnCours();
            setInterval(surbrillanceEnCours, 30000);
        } else {
            document.getElementById('loading').innerHTML = '<p class="text-rose-400">❌ Erreur : ' + data.message + '</p>';
        }
    } catch (e) {
        document.getElementById('loading').innerHTML = '<p class="text-rose-400">❌ Erreur de connexion</p>';
        console.error(e);
    }
}

function determinerJourAOuvrir() {
    const aujourdHui = new Date();
    const annee = aujourdHui.getFullYear();
    const mois = String(aujourdHui.getMonth() + 1).padStart(2, '0');
    const jourNum = String(aujourdHui.getDate()).padStart(2, '0');
    const dateAujStr = annee + '-' + mois + '-' + jourNum;
    for (const [jour, date] of Object.entries(datesParJour)) if (date === dateAujStr) return jour;
    const nomsJours = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
    const nomJourAuj = nomsJours[aujourdHui.getDay()];
    for (const [jour] of Object.entries(datesParJour)) if (jour === nomJourAuj) return jour;
    for (const jour of jours) if (programmeData[jour] && programmeData[jour].length > 0) return jour;
    return 'mardi';
}

function afficherJourInitial(jour) {
    jours.forEach(j => {
        document.getElementById('jour-' + j).style.display = 'none';
        resetTabStyle(j);
    });
    document.getElementById('jour-' + jour).style.display = 'block';
    setTabActive(jour);
    jourActif = jour;
    updateDateLabel();
}

function resetTabStyle(j) {
    document.getElementById('tab-' + j).className = 'day-tab glass-panel py-3 px-4 rounded-lg flex flex-col items-center justify-center border hover:border-cyan-400/40 transition-all duration-300 text-slate-400';
}
function setTabActive(j) {
    document.getElementById('tab-' + j).className = 'day-tab glass-panel-active py-3 px-4 rounded-lg flex flex-col items-center justify-center transition-all duration-300 text-cyan-300';
}

function updateDateLabel() {
    const d = datesParJour[jourActif];
    const el = document.getElementById('currentDateLabel');
    if (d && el) {
        const parts = d.split('-');
        el.textContent = nomsJoursFR[jourActif] + ' ' + parts[2] + '/' + parts[1] + '/' + parts[0];
    }
}

function extraireHeure(str) {
    if (!str) return '';
    const match = String(str).match(/(\d{1,2}):(\d{2})/);
    if (match) return String(parseInt(match[1])).padStart(2, '0') + 'h' + match[2];
    return str;
}

function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ====================================================================
// GÉNÉRATION DE L'AFFICHAGE
// ====================================================================
function genererAffichage() {
    jours.forEach(jour => {
        const container = document.getElementById('jour-' + jour);
        const items = programmeData[jour] || [];
        items.forEach(it => { it._cat = categoriserItem(it); });

        const groupes = {};
        items.forEach(item => {
            const key = item.heureDebut + '-' + item.heureFin;
            if (!groupes[key]) groupes[key] = { horaire: key, items: [] };
            groupes[key].items.push(item);
        });

        let html = '<div class="space-y-4">';
        for (const key in groupes) {
            const groupe = groupes[key];
            const [debut, fin] = groupe.horaire.split('-');
            const heureF = extraireHeure(debut) + ' — ' + extraireHeure(fin);

            const confItem = groupe.items.find(i => i._cat.cat === 'conf');
            const atelier1 = groupe.items.find(i => i._cat.cat === 'atelier' && i._cat.letter !== 'B');
            const atelier2 = groupe.items.find(i => i._cat.cat === 'atelier' && i._cat.letter === 'B');
            const slotId = confItem ? confItem.id : (atelier1 ? atelier1.id : (atelier2 ? atelier2.id : ''));
            const subType = confItem ? confItem._cat.subType : 'autre';

            html += '<div class="session-card glass-panel cat-' + subType + '" data-id="' + slotId + '" data-debut="' + debut + '" data-fin="' + fin + '">';
            html += '<div class="card-inner">';

            // Bandeau horaire + badge EN COURS
            html += '<div class="bg-gradient-to-r from-slate-900 via-slate-900/90 to-slate-950 px-4 py-2.5 border-b border-cyan-500/20 flex items-center justify-between">';
            html += '  <div class="flex items-center gap-3">';
            html += '    <span class="inline-flex items-center justify-center px-3 py-1 rounded-md bg-cyan-500/10 border border-cyan-400/40 text-cyan-300 font-orbitron font-bold text-xs tracking-widest">';
            html += '      <i class="fa-regular fa-clock mr-1.5 text-cyan-400 text-[11px]"></i>' + heureF;
            html += '    </span>';
            html += '  </div>';
            html += '  <span class="live-badge"><span class="dot"></span>EN COURS</span>';
            html += '</div>';

            // Bloc principal (conf / pause / déjeuner / soirée / autre)
            if (confItem) {
                const cat = confItem._cat;
                const desc = confItem.description ? '<p class="text-xs text-slate-300 mt-2 leading-relaxed">' + escapeHtml(confItem.description) + '</p>' : '';
                html += '<div class="main-block p-4">';
                html += '  <div class="flex items-center gap-2 mb-2">';
                html += '    <span class="badge-type px-2 py-0.5 rounded text-[10px] font-mono font-semibold uppercase border">' + escapeHtml(cat.badgeLabel) + '</span>';
                html += '    <i class="fa-solid ' + cat.icon + ' text-xs opacity-60"></i>';
                html += '  </div>';
                html += '  <h3 class="font-rajdhani font-bold text-base md:text-lg text-white tracking-wide">' + escapeHtml(confItem.nom) + '</h3>';
                html += desc;
                html += '</div>';
            }

            // Grille ateliers (2 colonnes)
            if (atelier1 || atelier2) {
                html += '<div class="grid grid-cols-1 md:grid-cols-2 divide-y md:divide-y-0 md:divide-x divide-slate-800/80 bg-slate-950/40">';
                if (atelier1) html += buildAtelierBlock(atelier1, 'A');
                if (atelier2) html += buildAtelierBlock(atelier2, 'B');
                html += '</div>';
            }

            html += '</div>'; // .card-inner
            html += '</div>'; // .session-card
        }
        html += '</div>';
        container.innerHTML = html;
    });
}

function buildAtelierBlock(atelier, letter) {
    const desc = atelier.description ? '<p class="text-xs font-semibold text-slate-200 leading-snug mt-1">' + escapeHtml(atelier.description) + '</p>' : '';
    return '<div class="atelier-block p-4 transition-all flex flex-col justify-between space-y-2">' +
        '  <div>' +
        '    <span class="text-[10px] text-cyan-400 font-mono uppercase tracking-wider block mb-1">' +
        '      <i class="fa-solid fa-laptop-medical mr-1"></i> Atelier ' + letter +
        '    </span>' +
        '    <p class="text-xs font-bold text-white leading-snug">' + escapeHtml(atelier.nom) + '</p>' +
        desc +
        '  </div>' +
        '</div>';
}

// ====================================================================
// NAVIGATION ENTRE JOURS (clic + swipe animé)
// ====================================================================
function afficherJour(jour, direction = null) {
    if (isAnimating) return;
    const ancienJour = jourActif;
    if (ancienJour === jour) return;
    if (!direction) {
        const ia = jours.indexOf(ancienJour);
        const in2 = jours.indexOf(jour);
        direction = in2 > ia ? 'left' : 'right';
    }
    const ancienEl = document.getElementById('jour-' + ancienJour);
    const nouveauEl = document.getElementById('jour-' + jour);
    isAnimating = true;
    jours.forEach(resetTabStyle);
    setTabActive(jour);
    nouveauEl.style.display = 'block';
    nouveauEl.style.position = 'absolute';
    nouveauEl.style.width = '100%';
    nouveauEl.style.top = '0';
    ancienEl.classList.add(direction === 'left' ? 'slide-out-left' : 'slide-out-right');
    nouveauEl.classList.add(direction === 'left' ? 'slide-in-left' : 'slide-in-right');
    setTimeout(() => {
        ancienEl.classList.remove('slide-out-left', 'slide-out-right');
        nouveauEl.classList.remove('slide-in-left', 'slide-in-right');
        ancienEl.style.display = 'none';
        nouveauEl.style.position = '';
        nouveauEl.style.width = '';
        nouveauEl.style.top = '';
        isAnimating = false;
    }, 300);
    jourActif = jour;
    updateDateLabel();
}

// ====================================================================
// SURBRILLANCE "EN COURS" (chenillard + glow + scroll auto)
// ====================================================================
function surbrillanceEnCours() {
    const maintenant = new Date();
    const hNow = maintenant.getHours() * 60 + maintenant.getMinutes();
    document.querySelectorAll('.session-card').forEach(s => s.classList.remove('en-cours'));
    if (!jourActif) return;
    const slots = document.getElementById('jour-' + jourActif).querySelectorAll('.session-card');
    slots.forEach(slot => {
        const debut = slot.dataset.debut;
        const fin = slot.dataset.fin;
        if (debut && fin) {
            const [dh, dm] = debut.split(':').map(Number);
            const [fh, fm] = fin.split(':').map(Number);
            if (hNow >= dh * 60 + dm && hNow < fh * 60 + fm) {
                slot.classList.add('en-cours');
                setTimeout(() => slot.scrollIntoView({ behavior: 'smooth', block: 'center' }), 300);
            }
        }
    });
}

// ====================================================================
// SWIPE TACTILE
// ====================================================================
let touchStartX = 0, touchStartY = 0;
document.addEventListener('DOMContentLoaded', () => {
    const zoneSwipe = document.getElementById('zoneSwipe');
    if (zoneSwipe) {
        zoneSwipe.addEventListener('touchstart', e => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });
        zoneSwipe.addEventListener('touchend', e => {
            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;
            if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
                const idx = jours.indexOf(jourActif);
                let ni = idx + (dx < 0 ? 1 : -1);
                ni = Math.max(0, Math.min(3, ni));
                if (ni !== idx) afficherJour(jours[ni], dx < 0 ? 'left' : 'right');
            }
        }, { passive: true });
    }
});

chargerProgramme();
</script>
