<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan QR Code v0.01</title>
    <link rel="manifest" href="../manifest.json">
    <script>
    if (localStorage.getItem('darkMode') === '1') { document.documentElement.classList.add('dark'); }
    </script>
    <!-- Bibliothèque html5-qrcode pour le scan -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #f5f7fa; --text: #222; --text-sub: #666; --card-bg: white;
            --page-header-bg: #1a3a6b; --primary: #1a3a6b; --success: #10b981;
            --danger: #dc3545;
        }
        body.dark {
            --bg: #181c2a; --text: #eee; --text-sub: #999; --card-bg: #242840;
            --page-header-bg: #0f1f3d; --primary: #2a5f9f;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); min-height: 100vh; }
        
        .page-header { background: var(--page-header-bg); color: white; padding: 14px 20px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 10; }
        .back-btn { background: none; border: none; color: white; font-size: 22px; cursor: pointer; }
        .page-header h2 { font-size: 18px; flex: 1; }
        .page-content { padding: 16px; max-width: 600px; margin: 0 auto; }
        
        /* Zone de scan */
        .scan-section {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .scan-section h3 {
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 10px;
            font-weight: 600;
        }
        #reader {
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
        }
        #reader video { border-radius: 10px; }
        .scan-controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .scan-controls button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-start { background: var(--success); color: white; }
        .btn-stop { background: var(--danger); color: white; }
        
        /* Infos participant scanné */
        .participant-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-left: 4px solid var(--success);
            display: none;
        }
        .participant-card.visible { display: block; }
        .participant-card h3 {
            font-size: 16px;
            color: var(--text);
            margin-bottom: 10px;
        }
        .participant-info {
            display: grid;
            gap: 6px;
            margin-bottom: 12px;
        }
        .info-row {
            display: flex;
            font-size: 13px;
        }
        .info-label {
            font-weight: 600;
            color: var(--text-sub);
            min-width: 100px;
        }
        .info-value {
            color: var(--text);
            flex: 1;
        }
        .comment-section {
            border-top: 1px solid rgba(128,128,128,0.2);
            padding-top: 12px;
        }
        .comment-section label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-sub);
            display: block;
            margin-bottom: 6px;
        }
        .comment-section textarea {
            width: 100%;
            height: 70px;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 13px;
            resize: vertical;
            outline: none;
            background: var(--bg);
            color: var(--text);
            font-family: inherit;
        }
        .comment-section textarea:focus { border-color: var(--primary); }
        .save-btn {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .save-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* Liste des scans */
        .scans-list {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .scans-list h3 {
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 10px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .scan-count {
            background: var(--primary);
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
        }
        .scan-item {
            padding: 8px;
            border-radius: 6px;
            background: var(--bg);
            margin-bottom: 6px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .scan-item .scan-name { font-weight: 600; color: var(--text); }
        .scan-item .scan-time { color: var(--text-sub); font-size: 10px; }
        
        .email-btn {
            width: 100%;
            padding: 12px;
            background: var(--success);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .email-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .status-msg {
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }
        .status-msg.success { background: #d4edda; color: #155724; display: block; }
        .status-msg.error { background: #f8d7da; color: #721c24; display: block; }
        
        .loading { text-align: center; padding: 20px; color: var(--text-sub); }
        
        @media (max-width: 480px) {
            .page-header { top: 90px; }
        }
    </style>
</head>
<body>
    <div class="page-header">
        <button class="back-btn" onclick="retourAccueil()">←</button>
        <h2>Scan QR Code</h2>
    </div>
    <div class="page-content">
        <!-- Zone de scan -->
        <div class="scan-section">
            <h3>📷 Scanner le QR code d'un participant</h3>
            <div id="reader"></div>
            <div class="scan-controls">
                <button class="btn-start" id="btnStart" onclick="demarrerScan()">▶️ Démarrer le scan</button>
                <button class="btn-stop" id="btnStop" onclick="arreterScan()" style="display:none;">⏹️ Arrêter</button>
            </div>
            <div id="scanStatus" class="status-msg"></div>
        </div>
        
        <!-- Carte participant scanné -->
        <div id="participantCard" class="participant-card">
            <h3>👤 Participant détecté</h3>
            <div class="participant-info">
                <div class="info-row"><span class="info-label">Nom :</span><span class="info-value" id="pNom">-</span></div>
                <div class="info-row"><span class="info-label">Prénom :</span><span class="info-value" id="pPrenom">-</span></div>
                <div class="info-row"><span class="info-label">Statut :</span><span class="info-value" id="pStatut">-</span></div>
                <div class="info-row"><span class="info-label">Établissement :</span><span class="info-value" id="pEtab">-</span></div>
                <div class="info-row"><span class="info-label">Email :</span><span class="info-value" id="pEmail">-</span></div>
                <div class="info-row"><span class="info-label">Téléphone :</span><span class="info-value" id="pTel">-</span></div>
            </div>
            <div class="comment-section">
                <label for="commentaire">💬 Commentaire (optionnel) :</label>
                <textarea id="commentaire" placeholder="Ajoutez un commentaire..."></textarea>
                <button class="save-btn" id="btnSave" onclick="enregistrerScan()">💾 Enregistrer le scan</button>
            </div>
        </div>
        
        <!-- Liste des scans effectués -->
        <div class="scans-list">
            <h3> Mes scans <span class="scan-count" id="scanCount">0</span></h3>
            <div id="scansListContainer">
                <div style="text-align:center;color:var(--text-sub);padding:20px;font-size:12px;">Aucun scan enregistré</div>
            </div>
            <button class="email-btn" id="btnEmail" onclick="envoyerParMail()" disabled>📧 Envoyer la liste par email</button>
        </div>
    </div>

    <script src="../js/commun.js"></script>
    <script>
        verifierConnexionOuRediriger();
        
        const adherent = chargerAdherent();
        let participants = [];
        let html5QrCode = null;
        let scanEnCours = false;
        let participantScanne = null;
        let mesScans = []; // Liste locale des scans effectués
        
        // ============================================
        // PRÉCHARGEMENT DES PARTICIPANTS
        // ============================================
        async function chargerParticipants() {
            try {
                const resp = await fetch(SCRIPT_URL + '?action=getParticipants');
                const data = await resp.json();
                
                if (data.success) {
                    participants = data.participants;
                    console.log('[ScanQR] ' + participants.length + ' participants chargés');
                }
            } catch (e) {
                console.error('[ScanQR] Erreur chargement participants:', e);
            }
        }
        
        // ============================================
        // SCAN QR CODE
        // ============================================
        function demarrerScan() {
            if (scanEnCours) return;
            
            const reader = document.getElementById('reader');
            html5QrCode = new Html5Qrcode("reader");
            
            // ✅ Zone de scan adaptative (90% de la largeur de l'écran, max 400px)
            const tailleZone = Math.min(window.innerWidth * 0.9, 400);
            
            const config = { 
                fps: 10, 
                qrbox: { width: tailleZone, height: tailleZone },
                aspectRatio: 1.0
            };
            
            html5QrCode.start(
                { facingMode: "environment" },
                config,
                onScanSuccess,
                onScanFailure
            ).then(() => {
                scanEnCours = true;
                document.getElementById('btnStart').style.display = 'none';
                document.getElementById('btnStop').style.display = 'block';
                afficherStatus('📷 Caméra active - Pointez vers un QR code', 'success');
            }).catch(err => {
                afficherStatus('❌ Erreur caméra: ' + err, 'error');
            });
        }
        
        function arreterScan() {
            if (!scanEnCours || !html5QrCode) return;
            
            html5QrCode.stop().then(() => {
                html5QrCode.clear();
                scanEnCours = false;
                document.getElementById('btnStart').style.display = 'block';
                document.getElementById('btnStop').style.display = 'none';
                afficherStatus('📷 Caméra arrêtée', 'success');
            }).catch(err => {
                console.error('Erreur arrêt scan:', err);
            });
        }
        
        function onScanSuccess(decodedText, decodedResult) {
            console.log('[ScanQR] QR code scanné:', decodedText);
            
            // Chercher le participant dans la liste préchargée
            const participant = participants.find(p => 
                String(p.id).toUpperCase() === String(decodedText).toUpperCase()
            );
            
            if (participant) {
                // Vérifier si déjà scanné
                const dejaScanne = mesScans.find(s => s.id === participant.id);
                if (dejaScanne) {
                    afficherStatus('⚠️ ' + participant.prenom + ' ' + participant.nom + ' déjà scanné(e)', 'error');
                } else {
                    afficherStatus('✅ ' + participant.prenom + ' ' + participant.nom + ' détecté(e) !', 'success');
                    afficherParticipant(participant);
                }
            } else {
                afficherStatus('❌ Code non reconnu: ' + decodedText, 'error');
            }
            
            // Arrêter le scan après détection
            arreterScan();
        }
        
        function onScanFailure(error) {
            // Silencieux - scan en cours
        }
        
        function afficherParticipant(p) {
            participantScanne = p;
            document.getElementById('pNom').textContent = p.nom;
            document.getElementById('pPrenom').textContent = p.prenom;
            document.getElementById('pStatut').textContent = p.statut;
            document.getElementById('pEtab').textContent = p.etablissement;
            document.getElementById('pEmail').textContent = p.email;
            document.getElementById('pTel').textContent = p.telephone || 'Non renseigné';
            document.getElementById('commentaire').value = '';
            document.getElementById('participantCard').classList.add('visible');
            document.getElementById('btnSave').disabled = false;
        }
        
        // ============================================
        // ENREGISTRER LE SCAN
        // ============================================
        async function enregistrerScan() {
            if (!participantScanne) return;
            
            const btn = document.getElementById('btnSave');
            btn.disabled = true;
            btn.textContent = ' Enregistrement...';
            
            const commentaire = document.getElementById('commentaire').value.trim();
            
            try {
                const params = new URLSearchParams({
                    action: 'saveScan',
                    scannedId: participantScanne.id,
                    scannerId: adherent.id,
                    commentaire: commentaire
                });
                
                const resp = await fetch(SCRIPT_URL + '?' + params);
                const data = await resp.json();
                
                if (data.success) {
                    // Ajouter à la liste locale
                    mesScans.push({
                        id: participantScanne.id,
                        nom: participantScanne.nom,
                        prenom: participantScanne.prenom,
                        statut: participantScanne.statut,
                        etablissement: participantScanne.etablissement,
                        email: participantScanne.email,
                        telephone: participantScanne.telephone,
                        commentaire: commentaire,
                        horodatage: new Date().toLocaleString('fr-FR')
                    });
                    
                    afficherStatus('✅ Scan enregistré avec succès !', 'success');
                    document.getElementById('participantCard').classList.remove('visible');
                    participantScanne = null;
                    mettreAJourListeScans();
                    
                    // Redémarrer le scan automatiquement après 2 secondes
                    setTimeout(() => {
                        if (!scanEnCours) demarrerScan();
                    }, 2000);
                } else {
                    afficherStatus('❌ Erreur: ' + data.message, 'error');
                }
            } catch (e) {
                afficherStatus(' Erreur de connexion', 'error');
                console.error(e);
            } finally {
                btn.disabled = false;
                btn.textContent = '💾 Enregistrer le scan';
            }
        }
        
        function mettreAJourListeScans() {
            const container = document.getElementById('scansListContainer');
            document.getElementById('scanCount').textContent = mesScans.length;
            document.getElementById('btnEmail').disabled = mesScans.length === 0;
            
            if (mesScans.length === 0) {
                container.innerHTML = '<div style="text-align:center;color:var(--text-sub);padding:20px;font-size:12px;">Aucun scan enregistré</div>';
                return;
            }
            
            let html = '';
            // Afficher les plus récents en premier
            [...mesScans].reverse().forEach(s => {
                html += `<div class="scan-item">
                    <div>
                        <div class="scan-name">${s.prenom} ${s.nom}</div>
                        <div style="font-size:10px;color:var(--text-sub);">${s.statut} - ${s.etablissement}</div>
                    </div>
                    <div class="scan-time">${s.horodatage.split(' ')[1] || ''}</div>
                </div>`;
            });
            
            container.innerHTML = html;
        }
        
        // ============================================
        // ENVOI PAR EMAIL
        // ============================================
        async function envoyerParMail() {
            if (mesScans.length === 0) return;
            
            const emailDest = adherent.email;
            if (!emailDest) {
                alert('Votre adresse email n\'est pas renseignée');
                return;
            }
            
            if (!confirm(`Envoyer la liste de ${mesScans.length} personne(s) scannée(s) à ${emailDest} ?`)) return;
            
            const btn = document.getElementById('btnEmail');
            btn.disabled = true;
            btn.textContent = ' Envoi en cours...';
            
            try {
                const params = new URLSearchParams({
                    action: 'sendScansByEmail',
                    scannerId: adherent.id,
                    emailDest: emailDest
                });
                
                const resp = await fetch(SCRIPT_URL + '?' + params);
                const data = await resp.json();
                
                if (data.success) {
                    alert('✅ Email envoyé avec succès !\n' + data.nbScans + ' scan(s) envoyé(s) à ' + emailDest);
                } else {
                    alert(' Erreur: ' + data.message);
                }
            } catch (e) {
                alert('❌ Erreur de connexion');
                console.error(e);
            } finally {
                btn.disabled = false;
                btn.textContent = '📧 Envoyer la liste par email';
            }
        }
        
        function afficherStatus(msg, type) {
            const el = document.getElementById('scanStatus');
            el.textContent = msg;
            el.className = 'status-msg ' + type;
            setTimeout(() => { el.style.display = 'none'; }, 4000);
        }
        
        // Nettoyage à la fermeture
        window.addEventListener('beforeunload', () => {
            if (scanEnCours && html5QrCode) {
                html5QrCode.stop().catch(() => {});
            }
        });
        
        // Initialisation
        chargerParticipants();
    </script>
</body>
</html>
