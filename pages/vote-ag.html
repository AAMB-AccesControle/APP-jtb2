<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vote AG + Chat — AAMB JTB 2026</title>
    <link rel="manifest" href="../manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background-color: #050811;
            background-image:
                radial-gradient(circle at 15% 15%, rgba(0, 242, 254, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 60%, rgba(255, 0, 127, 0.06) 0%, transparent 40%),
                linear-gradient(to bottom, rgba(5, 8, 17, 0.95), rgba(5, 8, 17, 0.98));
            background-attachment: fixed;
            color: #e2e8f0;
        }
        body::before {
            content: '';
            position: fixed; inset: 0;
            pointer-events: none; z-index: 0;
            background-size: 40px 40px;
            background-image:
                linear-gradient(to right, rgba(56, 189, 248, 0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(56, 189, 248, 0.04) 1px, transparent 1px);
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #070b14; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #00f2fe; }

        .glass-panel {
            background: rgba(13, 22, 41, 0.65);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(56, 189, 248, 0.18);
        }

        /* ==== HEADER ==== */
        .page-header {
            position: relative; z-index: 50;
            background: rgba(13, 22, 41, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(0, 242, 254, 0.25);
            color: white;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
        .back-btn {
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid rgba(0, 242, 254, 0.3);
            color: #00f2fe;
            width: 36px; height: 36px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.25s;
            display: flex; align-items: center; justify-content: center;
        }
        .back-btn:hover { background: rgba(0, 242, 254, 0.25); color: white; box-shadow: 0 0 12px rgba(0, 242, 254, 0.4); }
        .page-header h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            letter-spacing: 2px;
            text-transform: uppercase;
            flex: 1;
        }
        .page-header h2 .cyan { color: #00f2fe; text-shadow: 0 0 10px rgba(0, 242, 254, 0.6); }

        /* ==== SPLIT VIEW ==== */
        .split-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            flex: 1;
            overflow: hidden;
            gap: 0;
            position: relative;
            z-index: 1;
        }
        .split-panel {
            overflow-y: auto;
            padding: 16px;
            border-right: 1px solid rgba(0, 242, 254, 0.15);
            min-height: 0;
        }
        .split-panel:last-child { border-right: none; }

        /* ==== CARDS ==== */
        .card {
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 15px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(56, 189, 248, 0.18);
            background: rgba(13, 22, 41, 0.65);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .card h3 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #00f2fe;
            margin-bottom: 12px;
            font-weight: 700;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(0, 242, 254, 0.15);
        }

        /* ==== PRÉSENCE ==== */
        .presence-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .presence-col { display: flex; flex-direction: column; gap: 8px; }

        .presence-btn {
            width: 100%;
            padding: 11px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            color: #e2e8f0;
            background: rgba(13, 22, 41, 0.65);
            transition: all 0.25s;
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 0.5px;
        }
        .presence-btn:hover:not(:disabled) {
            background: rgba(0, 242, 254, 0.1);
            border-color: #00f2fe;
        }
        .presence-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .presence-btn.physique.active {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #0a0f1f;
            border-color: #00f2fe;
            box-shadow: 0 0 18px rgba(0, 242, 254, 0.5);
        }
        .presence-btn.distance.active {
            background: linear-gradient(135deg, #10b981 0%, #34d399 100%);
            color: white;
            border-color: #10b981;
            box-shadow: 0 0 18px rgba(16, 185, 129, 0.5);
        }

        .stats-compact {
            display: flex;
            gap: 6px;
            padding: 10px 8px;
            border-radius: 10px;
            border: 1px solid;
        }
        .stats-compact .stat-box { flex: 1; text-align: center; padding: 4px 2px; }
        .stats-compact .stat-box .number {
            font-family: 'JetBrains Mono', monospace;
            font-size: 17px;
            font-weight: 700;
            line-height: 1.2;
        }
        .stats-compact .stat-box .label {
            font-size: 9px;
            color: #94a3b8;
            line-height: 1.3;
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .stats-compact.physique {
            background: rgba(0, 242, 254, 0.08);
            border-color: rgba(0, 242, 254, 0.25);
        }
        .stats-compact.physique .number { color: #00f2fe; text-shadow: 0 0 6px rgba(0, 242, 254, 0.5); }
        .stats-compact.distance {
            background: rgba(16, 185, 129, 0.08);
            border-color: rgba(16, 185, 129, 0.25);
        }
        .stats-compact.distance .number { color: #6ee7b7; text-shadow: 0 0 6px rgba(16, 185, 129, 0.5); }
        .stats-compact.total {
            background: rgba(255, 0, 127, 0.08);
            border-color: rgba(255, 0, 127, 0.25);
        }
        .stats-compact.total .number { color: #ff8ec7; text-shadow: 0 0 6px rgba(255, 0, 127, 0.5); }
        .stats-compact.mode {
            background: rgba(255, 183, 3, 0.08);
            border-color: rgba(255, 183, 3, 0.25);
        }
        .stats-compact.mode .number { color: #ffd866; text-shadow: 0 0 6px rgba(255, 183, 3, 0.5); }

        /* ==== CRÉATION THÈME ==== */
        .theme-creation { margin-bottom: 10px; }
        .theme-creation input[type="text"] {
            width: 100%;
            padding: 11px 13px;
            border: 2px solid rgba(0, 242, 254, 0.25);
            border-radius: 8px;
            font-size: 14px;
            background: rgba(5, 8, 17, 0.6);
            color: #e2e8f0;
            margin-bottom: 10px;
            font-family: inherit;
            transition: border-color 0.25s, box-shadow 0.25s;
        }
        .theme-creation input[type="text"]:focus {
            outline: none;
            border-color: #00f2fe;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.25);
        }
        .theme-creation input[type="text"]::placeholder { color: #475569; }

        .btn-creer {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #0a0f1f;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-size: 14px;
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
            transition: all 0.25s;
        }
        .btn-creer:hover { transform: translateY(-1px); box-shadow: 0 0 22px rgba(0, 242, 254, 0.5); }

        .options-config {
            margin-top: 10px;
            padding: 12px;
            background: rgba(5, 8, 17, 0.5);
            border-radius: 10px;
            border: 1px solid rgba(56, 189, 248, 0.15);
        }
        .options-config label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: #e2e8f0;
            cursor: pointer;
            margin-bottom: 10px;
            font-family: 'Rajdhani', sans-serif;
        }
        .options-config input[type="checkbox"] {
            width: 18px; height: 18px;
            accent-color: #00f2fe;
            cursor: pointer;
        }

        .custom-options { margin-top: 10px; }
        .custom-option-row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
        .custom-option-row input {
            flex: 1;
            padding: 9px 12px;
            border: 1.5px solid rgba(0, 242, 254, 0.25);
            border-radius: 8px;
            font-size: 13px;
            background: rgba(5, 8, 17, 0.6);
            color: #e2e8f0;
            font-family: inherit;
        }
        .custom-option-row input:focus { outline: none; border-color: #00f2fe; box-shadow: 0 0 10px rgba(0, 242, 254, 0.2); }
        .custom-option-row .btn-remove {
            background: rgba(255, 0, 127, 0.2);
            color: #ff8ec7;
            border: 1px solid rgba(255, 0, 127, 0.4);
            border-radius: 8px;
            width: 34px; height: 34px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            transition: all 0.2s;
        }
        .custom-option-row .btn-remove:hover { background: rgba(255, 0, 127, 0.35); box-shadow: 0 0 10px rgba(255, 0, 127, 0.4); }
        .btn-add-option {
            width: 100%;
            padding: 9px;
            background: rgba(16, 185, 129, 0.2);
            color: #6ee7b7;
            border: 1px solid rgba(16, 185, 129, 0.4);
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            margin-top: 6px;
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.2s;
        }
        .btn-add-option:hover { background: rgba(16, 185, 129, 0.35); box-shadow: 0 0 12px rgba(16, 185, 129, 0.3); }

        /* ==== THEME CARDS ==== */
        .theme-card {
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 15px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(56, 189, 248, 0.18);
            border-left: 5px solid #64748b;
            background: rgba(13, 22, 41, 0.65);
            backdrop-filter: blur(10px);
        }
        .theme-card.actif {
            border-left-color: #10b981;
            box-shadow: 0 4px 18px rgba(16, 185, 129, 0.2), 0 0 20px rgba(16, 185, 129, 0.08);
        }
        .theme-card.cloture { border-left-color: #ff007f; opacity: 0.88; }
        .theme-card.brouillon { border-left-color: #ffb703; }

        .theme-texte {
            font-size: 15px;
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 10px;
            line-height: 1.4;
        }
        .theme-statut {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-family: 'Rajdhani', sans-serif;
            margin-bottom: 10px;
            border: 1px solid;
        }
        .theme-statut.actif {
            background: rgba(16, 185, 129, 0.2);
            color: #6ee7b7;
            border-color: rgba(16, 185, 129, 0.5);
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.3);
        }
        .theme-statut.brouillon {
            background: rgba(255, 183, 3, 0.2);
            color: #ffd866;
            border-color: rgba(255, 183, 3, 0.5);
        }
        .theme-statut.cloture {
            background: rgba(255, 0, 127, 0.2);
            color: #ff8ec7;
            border-color: rgba(255, 0, 127, 0.5);
        }

        /* ==== VOTE BUTTONS ==== */
        .vote-buttons { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
        .vote-btn {
            flex: 1;
            min-width: 80px;
            padding: 12px 8px;
            border: 1.5px solid rgba(56, 189, 248, 0.25);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            color: #e2e8f0;
            background: rgba(13, 22, 41, 0.5);
            transition: all 0.2s;
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 0.5px;
        }
        .vote-btn:hover:not(:disabled) { border-color: #00f2fe; background: rgba(0, 242, 254, 0.08); }
        .vote-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .vote-btn.standard-pour.active {
            background: linear-gradient(135deg, #10b981 0%, #34d399 100%);
            color: white;
            border-color: #10b981;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
        }
        .vote-btn.standard-contre.active {
            background: linear-gradient(135deg, #ff007f 0%, #ff4da6 100%);
            color: white;
            border-color: #ff007f;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
        }
        .vote-btn.standard-abstention.active {
            background: linear-gradient(135deg, #ffb703 0%, #ffd866 100%);
            color: #0a0f1f;
            border-color: #ffb703;
            box-shadow: 0 0 15px rgba(255, 183, 3, 0.4);
        }
        .vote-btn.custom.active {
            background: linear-gradient(135deg, #a855f7 0%, #c084fc 100%);
            color: white;
            border-color: #a855f7;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
        }

        .vote-results {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(56, 189, 248, 0.12);
            flex-wrap: wrap;
        }
        .result-box {
            flex: 1;
            min-width: 70px;
            text-align: center;
            padding: 10px 6px;
            background: rgba(5, 8, 17, 0.5);
            border-radius: 8px;
            border: 1px solid rgba(56, 189, 248, 0.12);
        }
        .result-box .number {
            font-family: 'JetBrains Mono', monospace;
            font-size: 20px;
            font-weight: 700;
        }
        .result-box .label {
            font-size: 10px;
            color: #94a3b8;
            word-break: break-word;
            margin-top: 2px;
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 0.3px;
        }
        .result-box.pour .number { color: #6ee7b7; text-shadow: 0 0 8px rgba(16, 185, 129, 0.5); }
        .result-box.contre .number { color: #ff8ec7; text-shadow: 0 0 8px rgba(255, 0, 127, 0.5); }
        .result-box.abstention .number { color: #ffd866; text-shadow: 0 0 8px rgba(255, 183, 3, 0.5); }
        .result-box.custom .number { color: #c084fc; text-shadow: 0 0 8px rgba(168, 85, 247, 0.5); }
        .result-box.total-box {
            background: rgba(0, 242, 254, 0.1);
            border-color: rgba(0, 242, 254, 0.3);
        }
        .result-box.total-box .number { color: #00f2fe; font-size: 22px; text-shadow: 0 0 8px rgba(0, 242, 254, 0.6); }

        .admin-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
        .admin-btn {
            padding: 9px 14px;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            color: white;
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.2s;
        }
        .admin-btn.cloturer {
            background: linear-gradient(135deg, #ff007f 0%, #ff4da6 100%);
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.3);
        }
        .admin-btn.cloturer:hover { box-shadow: 0 0 18px rgba(255, 0, 127, 0.5); }
        .admin-btn.supprimer {
            background: rgba(107, 114, 128, 0.3);
            border: 1px solid rgba(107, 114, 128, 0.5);
        }
        .admin-btn.supprimer:hover { background: rgba(107, 114, 128, 0.5); }
        .admin-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* ==== CHAT ==== */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-height: 100%;
        }
        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(0, 242, 254, 0.2);
            flex-shrink: 0;
        }
        .chat-header h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            color: #f1f5f9;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .chat-status {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-family: 'Rajdhani', sans-serif;
            border: 1px solid;
        }
        .chat-status.ouvert {
            background: rgba(16, 185, 129, 0.2);
            color: #6ee7b7;
            border-color: rgba(16, 185, 129, 0.5);
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.3);
        }
        .chat-status.ferme {
            background: rgba(255, 0, 127, 0.2);
            color: #ff8ec7;
            border-color: rgba(255, 0, 127, 0.5);
        }

        .btn-toggle-chat {
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            color: white;
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-left: 6px;
            transition: all 0.2s;
        }
        .btn-toggle-chat.ouvert {
            background: linear-gradient(135deg, #ff007f 0%, #ff4da6 100%);
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.3);
        }
        .btn-toggle-chat.ferme {
            background: linear-gradient(135deg, #10b981 0%, #34d399 100%);
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
        }
        .btn-toggle-chat:hover { transform: translateY(-1px); }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            background: rgba(5, 8, 17, 0.5);
            border-radius: 10px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 0;
            border: 1px solid rgba(56, 189, 248, 0.12);
        }

        .chat-message {
            padding: 10px 12px;
            background: rgba(13, 22, 41, 0.6);
            border-radius: 8px;
            border-left: 3px solid rgba(0, 242, 254, 0.5);
        }
        .chat-message.organisateur {
            border-left-color: #ff007f;
            background: rgba(255, 0, 127, 0.08);
            box-shadow: 0 0 8px rgba(255, 0, 127, 0.15);
        }

        .chat-message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .chat-message-author {
            font-size: 12px;
            font-weight: 700;
            color: #f1f5f9;
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 0.3px;
        }
        .chat-message-statut {
            font-size: 10px;
            color: #ff8ec7;
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .chat-message-time {
            font-size: 10px;
            color: #64748b;
            font-family: 'JetBrains Mono', monospace;
        }
        .chat-message-text {
            font-size: 13px;
            color: #e2e8f0;
            line-height: 1.5;
            word-break: break-word;
        }

        .chat-input-container {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        .chat-input {
            flex: 1;
            padding: 12px 14px;
            border: 2px solid rgba(0, 242, 254, 0.25);
            border-radius: 10px;
            font-size: 14px;
            background: rgba(5, 8, 17, 0.6);
            color: #e2e8f0;
            min-width: 0;
            font-family: inherit;
            transition: border-color 0.25s, box-shadow 0.25s;
        }
        .chat-input:focus { outline: none; border-color: #00f2fe; box-shadow: 0 0 15px rgba(0, 242, 254, 0.25); }
        .chat-input:disabled { opacity: 0.4; cursor: not-allowed; }
        .chat-input::placeholder { color: #475569; }

        .btn-send-chat {
            padding: 11px 18px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #0a0f1f;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            flex-shrink: 0;
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 13px;
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.3);
            transition: all 0.25s;
        }
        .btn-send-chat:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 0 18px rgba(0, 242, 254, 0.5); }
        .btn-send-chat:disabled { opacity: 0.4; cursor: not-allowed; }

        .chat-closed-message {
            text-align: center;
            padding: 20px;
            color: #64748b;
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 12px;
            background: rgba(5, 8, 17, 0.5);
            border-radius: 8px;
            border: 1px dashed rgba(255, 0, 127, 0.3);
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #64748b;
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 13px;
        }
        .loading::before {
            content: '';
            display: inline-block;
            width: 40px; height: 40px;
            border: 3px solid rgba(0, 242, 254, 0.15);
            border-top-color: #00f2fe;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: #64748b;
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 1px;
            background: rgba(5, 8, 17, 0.5);
            border-radius: 10px;
            border: 1px dashed rgba(56, 189, 248, 0.2);
        }
        .error-msg {
            background: rgba(255, 0, 127, 0.12);
            color: #ff8ec7;
            padding: 12px 14px;
            border-radius: 10px;
            margin: 10px 0;
            border-left: 4px solid #ff007f;
            border: 1px solid rgba(255, 0, 127, 0.35);
            font-size: 13px;
        }
        .non-adherent-msg {
            text-align: center;
            color: #fbbf24;
            padding: 12px;
            background: rgba(255, 183, 3, 0.08);
            border-radius: 10px;
            margin: 12px 0;
            border: 1px dashed rgba(255, 183, 3, 0.4);
            font-family: 'Rajdhani', sans-serif;
            font-size: 13px;
            letter-spacing: 0.3px;
        }

        #userInfo {
            font-size: 13px;
            color: #94a3b8;
            padding: 10px 12px;
            background: rgba(5, 8, 17, 0.5);
            border-radius: 8px;
            border: 1px solid rgba(56, 189, 248, 0.12);
            margin-bottom: 12px;
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 0.3px;
        }
        #userInfo strong { color: #00f2fe; font-weight: 700; }

        @media (max-width: 768px) {
            .page-header { padding: 10px 15px; }
            .page-header h2 { font-size: 14px; }
            .presence-grid { grid-template-columns: 1fr; }
            .split-container {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 1fr;
            }
            .split-panel {
                border-right: none;
                border-bottom: 1px solid rgba(0, 242, 254, 0.15);
            }
        }
    </style>
</head>
<body>
    <div class="page-header">
        <button class="back-btn" onclick="retourAccueil()"><i class="fa-solid fa-arrow-left"></i></button>
        <h2>🗳️ Vote <span class="cyan">AG</span> + Chat</h2>
    </div>
    
    <div class="split-container">
        <!-- PANNEAU GAUCHE : CHAT -->
        <div class="split-panel">
            <div class="chat-container">
                <div class="chat-header">
                    <h3><i class="fa-regular fa-comments"></i> Chat AG</h3>
                    <div style="display:flex;align-items:center;">
                        <span id="chatStatus" class="chat-status ferme">Fermé</span>
                        <button id="btnToggleChat" class="btn-toggle-chat ferme" onclick="toggleChat()" style="display:none;">Ouvrir</button>
                    </div>
                </div>
                
                <div id="chatMessages" class="chat-messages">
                    <div class="chat-closed-message">Le chat est fermé</div>
                </div>
                
                <div class="chat-input-container">
                    <input type="text" id="chatInput" class="chat-input" placeholder="Votre message..." disabled onkeypress="if(event.key==='Enter')sendChat()">
                    <button id="btnSendChat" class="btn-send-chat" onclick="sendChat()" disabled><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
        
        <!-- PANNEAU DROIT : VOTE -->
        <div class="split-panel">
            <div id="loading" class="loading">Chargement...</div>
            <div id="errorContainer"></div>
            
            <div id="voteContent" style="display:none;">
                <div class="card">
                    <h3><i class="fa-solid fa-clipboard-check"></i> Validation de présence</h3>
                    <div id="userInfo"></div>
                    
                    <div class="presence-grid">
                        <div class="presence-col">
                            <button id="btnPhysique" class="presence-btn physique" onclick="enregistrerPresence('Physique')">
                                <i class="fa-solid fa-building"></i> Présent physiquement
                            </button>
                            <div class="stats-compact physique">
                                <div class="stat-box"><div class="number" id="countPhysiqueAdh">0</div><div class="label">Adhérents</div></div>
                                <div class="stat-box"><div class="number" id="countPhysiqueNonAdh">0</div><div class="label">Non adh.</div></div>
                                <div class="stat-box"><div class="number" id="countPhysique">0</div><div class="label">Total</div></div>
                            </div>
                        </div>
                        <div class="presence-col">
                            <button id="btnDistance" class="presence-btn distance" onclick="enregistrerPresence('Distance')">
                                <i class="fa-solid fa-laptop"></i> À distance
                            </button>
                            <div class="stats-compact distance">
                                <div class="stat-box"><div class="number" id="countDistanceAdh">0</div><div class="label">Adhérents</div></div>
                                <div class="stat-box"><div class="number" id="countDistanceNonAdh">0</div><div class="label">Non adh.</div></div>
                                <div class="stat-box"><div class="number" id="countDistance">0</div><div class="label">Total</div></div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="presence-grid">
                        <div class="presence-col">
                            <div class="stats-compact total">
                                <div class="stat-box"><div class="number" id="countTotalAdh">0</div><div class="label">Adhérents</div></div>
                                <div class="stat-box"><div class="number" id="countTotalNonAdh">0</div><div class="label">Non adh.</div></div>
                                <div class="stat-box"><div class="number" id="countTotal">0</div><div class="label">Total</div></div>
                            </div>
                        </div>
                        <div class="presence-col">
                            <div class="stats-compact mode">
                                <div class="stat-box"><div class="number" id="countPhysiqueTotal">0</div><div class="label"><i class="fa-solid fa-building"></i> Sur place</div></div>
                                <div class="stat-box"><div class="number" id="countDistanceTotal">0</div><div class="label"><i class="fa-solid fa-laptop"></i> Distance</div></div>
                                <div class="stat-box"><div class="number" id="countTotalGeneral">0</div><div class="label">Total</div></div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div id="adminSection" class="card" style="display:none;">
                    <h3><i class="fa-solid fa-plus-circle"></i> Créer un thème de vote</h3>
                    <div class="theme-creation">
                        <input type="text" id="newThemeText" placeholder="Saisissez le thème du vote...">
                        
                        <div class="options-config">
                            <label>
                                <input type="checkbox" id="useStandardOptions" checked onchange="toggleOptionsMode()">
                                <span>Utiliser les options standard (Pour / Contre / Abstention)</span>
                            </label>
                            
                            <div id="customOptionsSection" style="display:none;">
                                <div style="font-size:12px;color:#94a3b8;margin-bottom:8px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;">Options personnalisées :</div>
                                <div id="customOptionsList"></div>
                                <button class="btn-add-option" onclick="addCustomOption()"><i class="fa-solid fa-plus"></i> Ajouter une option</button>
                            </div>
                        </div>
                        
                        <button class="btn-creer" onclick="creerTheme()" style="margin-top:12px;"><i class="fa-solid fa-bolt"></i> Créer et ouvrir</button>
                    </div>
                </div>
                
                <div id="themesContainer"></div>
            </div>
        </div>
    </div>

    <script src="../js/commun.js"></script>
    <script>
        verifierConnexionOuRediriger();
        
        let userData = null;
        let isOrganisateur = false;
        let isAdherent = false;
        let refreshInterval = null;
        let chatRefreshInterval = null;
        
        let localVotes = {};
        let localCounters = {};
        let localCountersExpiry = {};
        let lastActionTime = 0;
        let modeParticipation = null;
        let customOptionsCounter = 0;
        
        let chatOuvert = false;
        let lastChatMessageCount = 0;
        
        async function chargerDonnees() {
            try {
                const adherentData = localStorage.getItem('aamb_adherent');
                if (!adherentData) {
                    showError('⚠️ Veuillez vous connecter d\'abord via la page d\'accueil.');
                    document.getElementById('loading').style.display = 'none';
                    return;
                }
                
                userData = JSON.parse(adherentData);
                isOrganisateur = userData.statut === 'Organisateur';
                isAdherent = userData.typeAdhesion === 'Adhérent';
                
                document.getElementById('userInfo').innerHTML = 
                    '<i class="fa-solid fa-user"></i> <strong>' + escapeHtml(userData.prenom) + ' ' + escapeHtml(userData.nom) + '</strong><br>' +
                    '<i class="fa-solid fa-envelope"></i> ' + escapeHtml(userData.email) + ' | ' + 
                    (isOrganisateur ? '<i class="fa-solid fa-key"></i> Organisateur' : '<i class="fa-solid fa-user"></i> Participant') + ' | ' +
                    (isAdherent ? '<i class="fa-solid fa-check-double" style="color:#10b981;"></i> Adhérent (droit de vote)' : '<i class="fa-solid fa-triangle-exclamation" style="color:#fbbf24;"></i> Non adhérent');
                
                if (isOrganisateur) {
                    document.getElementById('adminSection').style.display = 'block';
                    document.getElementById('btnToggleChat').style.display = 'inline-block';
                }
                
                const cacheVote = localStorage.getItem('aamb_voteag_cache');
                const cacheChat = localStorage.getItem('aamb_chatag_cache');
                let donneesInitiales = false;
                
                if (cacheVote && cacheChat) {
                    try {
                        const dataVote = JSON.parse(cacheVote);
                        const dataChat = JSON.parse(cacheChat);
                        const ageCache = Date.now() - dataVote.timestamp;
                        
                        if (ageCache < 30000) {
                            console.log('[VoteAG] Affichage instantané depuis le cache (âge:', Math.round(ageCache/1000), 's)');
                            afficherDonneesVote(dataVote.data);
                            afficherDonneesChat(dataChat.data);
                            donneesInitiales = true;
                        }
                    } catch (e) { console.error('[VoteAG] Erreur lecture cache:', e); }
                }
                
                if (!donneesInitiales) {
                    console.log('[VoteAG] Pas de cache valide, chargement depuis le serveur...');
                    await chargerVoteData();
                    await chargerChatData();
                }
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('voteContent').style.display = 'block';
                
                refreshInterval = setInterval(() => {
                    if (Date.now() - lastActionTime < 5000) return;
                    chargerVoteData();
                }, 2000);
                chatRefreshInterval = setInterval(chargerChatData, 2000);
                
            } catch (e) {
                console.error('[VoteAG] Erreur:', e);
                showError('Erreur de chargement : ' + e.message);
                document.getElementById('loading').style.display = 'none';
            }
        }
        
        function afficherDonneesVote(data) {
            const p = data.presence;
            document.getElementById('countPhysiqueAdh').textContent = p.physiqueAdherent || 0;
            document.getElementById('countPhysiqueNonAdh').textContent = p.physiqueNonAdherent || 0;
            document.getElementById('countPhysique').textContent = p.physique || 0;
            document.getElementById('countDistanceAdh').textContent = p.distanceAdherent || 0;
            document.getElementById('countDistanceNonAdh').textContent = p.distanceNonAdherent || 0;
            document.getElementById('countDistance').textContent = p.distance || 0;
            document.getElementById('countTotalAdh').textContent = p.adherent || 0;
            document.getElementById('countTotalNonAdh').textContent = p.nonAdherent || 0;
            document.getElementById('countTotal').textContent = p.total || 0;
            document.getElementById('countPhysiqueTotal').textContent = p.physique || 0;
            document.getElementById('countDistanceTotal').textContent = p.distance || 0;
            document.getElementById('countTotalGeneral').textContent = (p.physique || 0) + (p.distance || 0);
            afficherThemes(data.themes);
        }
        
        function afficherDonneesChat(data) {
            chatOuvert = data.chatOuvert;
            const isOrg = data.isOrganisateur;
            const statusBadge = document.getElementById('chatStatus');
            const toggleBtn = document.getElementById('btnToggleChat');
            
            if (chatOuvert) {
                statusBadge.textContent = 'Ouvert'; statusBadge.className = 'chat-status ouvert';
                if (isOrg) { toggleBtn.textContent = 'Fermer'; toggleBtn.className = 'btn-toggle-chat ouvert'; }
            } else {
                statusBadge.textContent = 'Fermé'; statusBadge.className = 'chat-status ferme';
                if (isOrg) { toggleBtn.textContent = 'Ouvrir'; toggleBtn.className = 'btn-toggle-chat ferme'; }
            }
            document.getElementById('chatInput').disabled = !chatOuvert;
            document.getElementById('btnSendChat').disabled = !chatOuvert;
            afficherMessages(data.messages);
            lastChatMessageCount = data.messages.length;
        }
        
        function showError(msg) {
            document.getElementById('errorContainer').innerHTML = '<div class="error-msg">❌ ' + msg + '</div>';
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function toggleOptionsMode() {
            const useStandard = document.getElementById('useStandardOptions').checked;
            document.getElementById('customOptionsSection').style.display = useStandard ? 'none' : 'block';
            if (!useStandard && document.getElementById('customOptionsList').children.length === 0) {
                addCustomOption();
                addCustomOption();
                addCustomOption();
            }
        }
        
        function addCustomOption() {
            customOptionsCounter++;
            const list = document.getElementById('customOptionsList');
            const row = document.createElement('div');
            row.className = 'custom-option-row';
            row.id = 'option-row-' + customOptionsCounter;
            row.innerHTML = `
                <input type="text" placeholder="Libellé de l'option" class="custom-option-input">
                <button class="btn-remove" onclick="removeCustomOption(${customOptionsCounter})"><i class="fa-solid fa-xmark"></i></button>
            `;
            list.appendChild(row);
        }
        
        function removeCustomOption(id) {
            const row = document.getElementById('option-row-' + id);
            if (row) row.remove();
        }
        
        function getSelectedOptions() {
            const useStandard = document.getElementById('useStandardOptions').checked;
            if (useStandard) return 'Pour,Contre,Abstention';
            
            const inputs = document.querySelectorAll('.custom-option-input');
            const options = [];
            inputs.forEach(input => {
                const val = input.value.trim();
                if (val) options.push(val);
            });
            return options.length >= 2 ? options.join(',') : 'Pour,Contre,Abstention';
        }
        
        async function chargerVoteData() {
            try {
                const resp = await fetch(SCRIPT_URL + '?action=getVoteAGData&userId=' + encodeURIComponent(userData.id));
                const data = await resp.json();
                if (data.success) {
                    const p = data.presence;
                    
                    document.getElementById('countPhysiqueAdh').textContent = p.physiqueAdherent || 0;
                    document.getElementById('countPhysiqueNonAdh').textContent = p.physiqueNonAdherent || 0;
                    document.getElementById('countPhysique').textContent = p.physique || 0;
                    
                    document.getElementById('countDistanceAdh').textContent = p.distanceAdherent || 0;
                    document.getElementById('countDistanceNonAdh').textContent = p.distanceNonAdherent || 0;
                    document.getElementById('countDistance').textContent = p.distance || 0;
                    
                    document.getElementById('countTotalAdh').textContent = p.adherent || 0;
                    document.getElementById('countTotalNonAdh').textContent = p.nonAdherent || 0;
                    document.getElementById('countTotal').textContent = p.total || 0;
                    document.getElementById('countPhysiqueTotal').textContent = p.physique || 0;
                    document.getElementById('countDistanceTotal').textContent = p.distance || 0;
                    document.getElementById('countTotalGeneral').textContent = (p.physique || 0) + (p.distance || 0);
                    
                    data.themes.forEach(theme => {
                        if (localVotes[theme.themeId]) {
                            theme.monVote = localVotes[theme.themeId];
                        }
                        if (localCounters[theme.themeId] && localCountersExpiry[theme.themeId] > Date.now()) {
                            theme.compteurs = localCounters[theme.themeId];
                            theme.total = Object.values(localCounters[theme.themeId]).reduce((a, b) => a + b, 0);
                        } else {
                            delete localCounters[theme.themeId];
                            delete localCountersExpiry[theme.themeId];
                        }
                    });
                    
                    afficherThemes(data.themes);
                }
            } catch (e) {
                console.error('[VoteAG] Erreur refresh:', e);
            }
        }
        
        function isStandardOptions(options) {
            return options.length === 3 && 
                   options.includes('Pour') && 
                   options.includes('Contre') && 
                   options.includes('Abstention');
        }
        
        function afficherThemes(themes) {
            const container = document.getElementById('themesContainer');
            if (themes.length === 0) {
                container.innerHTML = '<div class="empty-state"><i class="fa-regular fa-folder-open" style="font-size:32px;display:block;margin-bottom:10px;color:rgba(0,242,254,0.35);"></i>Aucun thème de vote pour le moment.</div>';
                return;
            }
            
            let html = '';
            themes.forEach(theme => {
                const statutClass = theme.statut.toLowerCase();
                const isActif = theme.statut === 'ACTIF';
                const isCloture = theme.statut === 'CLOTURE';
                const isBrouillon = theme.statut === 'BROUILLON';
                const standard = isStandardOptions(theme.options);
                
                html += '<div class="theme-card ' + statutClass + '" data-theme-id="' + theme.themeId + '">';
                html += '<span class="theme-statut ' + statutClass + '">' + theme.statut + '</span>';
                html += '<div class="theme-texte">' + escapeHtml(theme.texte) + '</div>';
                
                if (isActif) {
                    if (isAdherent) {
                        html += '<div class="vote-buttons">';
                        theme.options.forEach(opt => {
                            const isActive = theme.monVote === opt;
                            let btnClass = 'vote-btn';
                            if (standard) {
                                btnClass += ' standard-' + opt.toLowerCase();
                            } else {
                                btnClass += ' custom';
                            }
                            if (isActive) btnClass += ' active';
                            html += '<button class="' + btnClass + '" onclick="voter(\'' + theme.themeId + '\', \'' + escapeHtml(opt).replace(/'/g, "\\'") + '\')">' + escapeHtml(opt) + '</button>';
                        });
                        html += '</div>';
                    } else {
                        html += '<div class="non-adherent-msg"><i class="fa-solid fa-circle-info"></i> Le vote est réservé aux adhérents. Vous pouvez consulter les résultats ci-dessous.</div>';
                    }
                } else if (isCloture) {
                    html += '<div style="text-align:center;color:#ff8ec7;padding:10px;font-family:Rajdhani,sans-serif;letter-spacing:1px;"><i class="fa-solid fa-lock"></i> Vote clôturé</div>';
                } else if (isBrouillon) {
                    html += '<div style="text-align:center;color:#ffd866;padding:10px;font-family:Rajdhani,sans-serif;letter-spacing:1px;"><i class="fa-solid fa-hourglass-half"></i> En cours de modification...</div>';
                }
                
                html += '<div class="vote-results">';
                theme.options.forEach(opt => {
                    const count = theme.compteurs[opt] || 0;
                    let boxClass = 'result-box';
                    if (standard) {
                        boxClass += ' ' + opt.toLowerCase();
                    } else {
                        boxClass += ' custom';
                    }
                    html += '<div class="' + boxClass + '"><div class="number">' + count + '</div><div class="label">' + escapeHtml(opt) + '</div></div>';
                });
                html += '<div class="result-box total-box"><div class="number">' + theme.total + '</div><div class="label">Total</div></div>';
                html += '</div>';
                
                if (isOrganisateur) {
                    html += '<div class="admin-actions">';
                    if (isActif) {
                        html += '<button class="admin-btn cloturer" onclick="cloturerVote(\'' + theme.themeId + '\')"><i class="fa-solid fa-lock"></i> Clôturer</button>';
                    }
                    html += '<button class="admin-btn supprimer" onclick="supprimerTheme(\'' + theme.themeId + '\')"><i class="fa-solid fa-trash"></i> Supprimer</button>';
                    html += '</div>';
                }
                html += '</div>';
            });
            container.innerHTML = html;
        }
        
        async function voter(themeId, choix) {
            const userId = userData.id;
            lastActionTime = Date.now();
            
            const themeCard = document.querySelector(`.theme-card[data-theme-id="${themeId}"]`);
            if (!themeCard) return;
            
            const resultBoxes = themeCard.querySelectorAll('.result-box:not(.total-box)');
            const newCounters = {};
            resultBoxes.forEach(box => {
                const label = box.querySelector('.label').textContent.trim();
                const count = parseInt(box.querySelector('.number').textContent || 0);
                newCounters[label] = count;
            });
            
            const ancienChoix = localVotes[themeId];
            if (ancienChoix && ancienChoix !== choix) {
                newCounters[ancienChoix] = Math.max(0, (newCounters[ancienChoix] || 0) - 1);
            }
            newCounters[choix] = (newCounters[choix] || 0) + 1;
            
            localVotes[themeId] = choix;
            localCounters[themeId] = newCounters;
            localCountersExpiry[themeId] = Date.now() + 5000;
            
            const buttons = themeCard.querySelectorAll('.vote-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            const clickedBtn = Array.from(buttons).find(btn => btn.textContent.trim() === choix);
            if (clickedBtn) clickedBtn.classList.add('active');
            
            resultBoxes.forEach(box => {
                const label = box.querySelector('.label').textContent.trim();
                if (newCounters[label] !== undefined) {
                    box.querySelector('.number').textContent = newCounters[label];
                }
            });
            const totalBox = themeCard.querySelector('.result-box.total-box .number');
            if (totalBox) {
                totalBox.textContent = Object.values(newCounters).reduce((a, b) => a + b, 0);
            }
            
            try {
                const resp = await fetch(SCRIPT_URL + '?action=enregistrerVote&userId=' + encodeURIComponent(userId) + '&themeId=' + encodeURIComponent(themeId) + '&choix=' + encodeURIComponent(choix));
                const data = await resp.json();
                if (!data.success) {
                    console.error('Erreur vote:', data.message);
                    delete localVotes[themeId];
                    delete localCounters[themeId];
                    delete localCountersExpiry[themeId];
                    setTimeout(() => chargerVoteData(), 1000);
                }
            } catch (e) {
                console.error('[VoteAG] Erreur:', e);
            }
        }
        
        async function enregistrerPresence(mode) {
            lastActionTime = Date.now();
            const userId = userData.id;
            const btnPhysique = document.getElementById('btnPhysique');
            const btnDistance = document.getElementById('btnDistance');
            
            btnPhysique.disabled = true;
            btnDistance.disabled = true;
            btnPhysique.innerHTML = '<i class="fa-solid fa-hourglass-half"></i> Enregistrement...';
            btnDistance.innerHTML = '<i class="fa-solid fa-hourglass-half"></i> Enregistrement...';
            
            try {
                const resp = await fetch(SCRIPT_URL + '?action=enregistrerPresenceAG&userId=' + encodeURIComponent(userId) + '&mode=' + encodeURIComponent(mode));
                const data = await resp.json();
                
                if (data.success) {
                    modeParticipation = mode;
                    if (mode === 'Physique') {
                        btnPhysique.classList.add('active');
                        btnDistance.classList.remove('active');
                        btnPhysique.innerHTML = '<i class="fa-solid fa-check"></i> Présent physiquement';
                        btnDistance.innerHTML = '<i class="fa-solid fa-laptop"></i> À distance';
                        btnDistance.disabled = false;
                    } else {
                        btnDistance.classList.add('active');
                        btnPhysique.classList.remove('active');
                        btnDistance.innerHTML = '<i class="fa-solid fa-check"></i> Participant à distance';
                        btnPhysique.innerHTML = '<i class="fa-solid fa-building"></i> Présent physiquement';
                        btnPhysique.disabled = false;
                    }
                    await chargerVoteData();
                } else {
                    alert('❌ ' + data.message);
                    btnPhysique.disabled = false;
                    btnDistance.disabled = false;
                    btnPhysique.innerHTML = '<i class="fa-solid fa-building"></i> Présent physiquement';
                    btnDistance.innerHTML = '<i class="fa-solid fa-laptop"></i> À distance';
                }
            } catch (e) {
                alert('Erreur de connexion: ' + e.message);
                btnPhysique.disabled = false;
                btnDistance.disabled = false;
                btnPhysique.innerHTML = '<i class="fa-solid fa-building"></i> Présent physiquement';
                btnDistance.innerHTML = '<i class="fa-solid fa-laptop"></i> À distance';
            }
        }
        
        async function creerTheme() {
            lastActionTime = Date.now();
            const texte = document.getElementById('newThemeText').value.trim();
            if (!texte) { alert('Veuillez saisir un thème'); return; }
            
            const options = getSelectedOptions();
            
            try {
                const resp = await fetch(SCRIPT_URL + '?action=creerThemeVote&userId=' + encodeURIComponent(userData.id) + '&themeTexte=' + encodeURIComponent(texte) + '&options=' + encodeURIComponent(options));
                const data = await resp.json();
                if (data.success) {
                    document.getElementById('newThemeText').value = '';
                    document.getElementById('useStandardOptions').checked = true;
                    document.getElementById('customOptionsList').innerHTML = '';
                    toggleOptionsMode();
                    await chargerVoteData();
                } else {
                    alert('❌ ' + data.message);
                }
            } catch (e) {
                alert('Erreur de connexion');
            }
        }
        
        async function supprimerTheme(themeId) {
            if (!confirm('⚠️ Supprimer ce vote et tous les votes associés ?\n\nCette action est irréversible.')) return;
            lastActionTime = Date.now();
            try {
                const resp = await fetch(SCRIPT_URL + '?action=supprimerThemeVote&userId=' + encodeURIComponent(userData.id) + '&themeId=' + encodeURIComponent(themeId));
                const data = await resp.json();
                if (data.success) {
                    delete localVotes[themeId];
                    delete localCounters[themeId];
                    delete localCountersExpiry[themeId];
                    await chargerVoteData();
                } else {
                    alert('❌ ' + data.message);
                }
            } catch (e) {
                console.error('[VoteAG] Erreur:', e);
                alert('Erreur de connexion');
            }
        }
        
        async function cloturerVote(themeId) {
            lastActionTime = Date.now();
            if (!confirm('Clôturer définitivement ce vote ?')) return;
            try {
                const resp = await fetch(SCRIPT_URL + '?action=cloturerVote&userId=' + encodeURIComponent(userData.id) + '&themeId=' + encodeURIComponent(themeId));
                const data = await resp.json();
                if (data.success) {
                    delete localVotes[themeId];
                    delete localCounters[themeId];
                    delete localCountersExpiry[themeId];
                    await chargerVoteData();
                } else {
                    alert('❌ ' + data.message);
                }
            } catch (e) {
                alert('Erreur de connexion');
            }
        }
        
        async function chargerChatData() {
            try {
                const resp = await fetch(SCRIPT_URL + '?action=getChatAG&userId=' + encodeURIComponent(userData.id));
                const data = await resp.json();
                
                if (data.success) {
                    chatOuvert = data.chatOuvert;
                    const isOrganisateur = data.isOrganisateur;
                    
                    const statusBadge = document.getElementById('chatStatus');
                    const toggleBtn = document.getElementById('btnToggleChat');
                    
                    if (chatOuvert) {
                        statusBadge.textContent = 'Ouvert';
                        statusBadge.className = 'chat-status ouvert';
                        if (isOrganisateur) {
                            toggleBtn.textContent = 'Fermer';
                            toggleBtn.className = 'btn-toggle-chat ouvert';
                        }
                    } else {
                        statusBadge.textContent = 'Fermé';
                        statusBadge.className = 'chat-status ferme';
                        if (isOrganisateur) {
                            toggleBtn.textContent = 'Ouvrir';
                            toggleBtn.className = 'btn-toggle-chat ferme';
                        }
                    }
                    
                    const chatInput = document.getElementById('chatInput');
                    const btnSend = document.getElementById('btnSendChat');
                    chatInput.disabled = !chatOuvert;
                    btnSend.disabled = !chatOuvert;
                    
                    afficherMessages(data.messages);
                }
            } catch (e) {
                console.error('[ChatAG] Erreur:', e);
            }
        }
        
        function afficherMessages(messages) {
            const container = document.getElementById('chatMessages');
            
            if (messages.length === 0) {
                container.innerHTML = '<div class="chat-closed-message">Aucun message pour le moment</div>';
                return;
            }
            
            let html = '';
            
            if (!chatOuvert) {
                html += '<div class="chat-closed-message" style="margin-bottom:10px;"><i class="fa-solid fa-lock"></i> Le chat est fermé - Les messages précédents restent visibles</div>';
            }
            
            messages.forEach(msg => {
                const isOrganisateur = msg.statut === 'Organisateur';
                const msgClass = isOrganisateur ? 'chat-message organisateur' : 'chat-message';
                
                html += '<div class="' + msgClass + '">';
                html += '<div class="chat-message-header">';
                html += '<span class="chat-message-author">' + escapeHtml(msg.prenom) + ' ' + escapeHtml(msg.nom) + '</span>';
                html += '<span class="chat-message-time">' + escapeHtml(msg.horodatage) + '</span>';
                html += '</div>';
                if (isOrganisateur) {
                    html += '<div class="chat-message-statut"><i class="fa-solid fa-key"></i> Organisateur</div>';
                }
                html += '<div class="chat-message-text">' + escapeHtml(msg.message) + '</div>';
                html += '</div>';
            });
            
            container.innerHTML = html;
            
            if (messages.length > lastChatMessageCount) {
                container.scrollTop = container.scrollHeight;
            }
            lastChatMessageCount = messages.length;
        }
        
        async function toggleChat() {
            if (!confirm(chatOuvert ? 'Fermer le chat ?' : 'Ouvrir le chat ?')) return;
            
            try {
                const resp = await fetch(SCRIPT_URL + '?action=toggleChatAG&userId=' + encodeURIComponent(userData.id));
                const data = await resp.json();
                
                if (data.success) {
                    await chargerChatData();
                } else {
                    alert('❌ ' + data.message);
                }
            } catch (e) {
                console.error('[ChatAG] Erreur:', e);
                alert('Erreur de connexion');
            }
        }
        
        async function sendChat() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            try {
                const resp = await fetch(SCRIPT_URL + '?action=sendChatAG&userId=' + encodeURIComponent(userData.id) + '&message=' + encodeURIComponent(message));
                const data = await resp.json();
                
                if (data.success) {
                    input.value = '';
                    await chargerChatData();
                } else {
                    alert('❌ ' + data.message);
                }
            } catch (e) {
                console.error('[ChatAG] Erreur:', e);
                alert('Erreur de connexion');
            }
        }
        
        window.addEventListener('beforeunload', () => {
            if (refreshInterval) clearInterval(refreshInterval);
            if (chatRefreshInterval) clearInterval(chatRefreshInterval);
        });
        
        chargerDonnees();
    </script>
</body>
