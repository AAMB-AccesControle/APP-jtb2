<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vote AG + Chat v0.17</title>
    <link rel="manifest" href="../manifest.json">
    <script>
    if (localStorage.getItem('darkMode') === '1') { document.documentElement.classList.add('dark'); }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #f5f7fa; --text: #222; --text-sub: #666; --card-bg: white;
            --page-header-bg: #1a3a6b; --primary: #1a3a6b;
            --pour: #10b981; --contre: #ef4444; --abstention: #f59e0b;
            --btn-gris: #9ca3af;
            --physique: #2563eb;
            --distance: #10b981;
            --total: #ef4444;
        }
        body.dark {
            --bg: #181c2a; --text: #eee; --text-sub: #999; --card-bg: #242840;
            --page-header-bg: #0f1f3d; --primary: #2a5f9f;
            --btn-gris: #4b5563;
        }
        
        /* ✅ Layout global : empêche le scroll de la page entière, mais permet le scroll interne */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; 
            background: var(--bg); 
            height: 100vh;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
        }
        
        .page-header { 
            background: var(--page-header-bg); 
            color: white; 
            padding: 14px 20px; 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            flex-shrink: 0; 
        }
        .back-btn { background: none; border: none; color: white; font-size: 22px; cursor: pointer; }
        .page-header h2 { font-size: 18px; flex: 1; }
        
        /* ✅ Conteneur principal : prend tout l'espace restant sous le header */
        .split-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            flex: 1; 
            overflow: hidden; 
            gap: 0;
        }
        
        /* ✅ Chaque panneau a son propre ascenseur */
        .split-panel {
            overflow-y: auto;
            padding: 16px;
            border-right: 1px solid #e5e7eb;
            min-height: 0;
        }
        .split-panel:last-child {
            border-right: none;
        }
        
        .card { background: var(--card-bg); border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .card h3 { font-size: 14px; color: var(--text); margin-bottom: 10px; font-weight: 700; }
        
        .presence-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .presence-col { display: flex; flex-direction: column; gap: 8px; }
        
        .presence-btn {
            width: 100%; padding: 10px; border: none; border-radius: 10px;
            font-size: 13px; font-weight: bold; cursor: pointer; color: white;
            transition: all 0.2s;
        }
        .presence-btn.physique { background: #9ca3af; }
        .presence-btn.distance { background: #9ca3af; }
        .presence-btn:disabled { opacity: 0.7; cursor: not-allowed; }
        .presence-btn.physique.active { background: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.5); }
        .presence-btn.distance.active { background: #10b981; box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.5); }
        
        .stats-compact { display: flex; gap: 6px; padding: 8px; border-radius: 8px; }
        .stats-compact .stat-box { flex: 1; text-align: center; padding: 4px 2px; }
        .stats-compact .stat-box .number { font-size: 16px; font-weight: bold; line-height: 1.2; }
        .stats-compact .stat-box .label { font-size: 9px; color: var(--text-sub); line-height: 1.2; }
        .stats-compact.physique { background: rgba(37, 99, 235, 0.10); }
        .stats-compact.physique .number { color: var(--physique); }
        .stats-compact.distance { background: rgba(16, 185, 129, 0.10); }
        .stats-compact.distance .number { color: var(--distance); }
        .stats-compact.total { background: rgba(239, 68, 68, 0.10); }
        .stats-compact.total .number { color: var(--total); }
        .stats-compact.mode { background: rgba(245, 158, 11, 0.12); }
        .stats-compact.mode .number { color: #d97706; }
        
        .theme-creation { margin-bottom: 10px; }
        .theme-creation input[type="text"] { width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px; background: var(--bg); color: var(--text); margin-bottom: 10px; }
        .theme-creation .btn-creer { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; }
        
        .options-config { margin-top: 10px; padding: 10px; background: var(--bg); border-radius: 8px; }
        .options-config label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text); cursor: pointer; margin-bottom: 10px; }
        .options-config input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
        
        .custom-options { margin-top: 10px; }
        .custom-option-row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
        .custom-option-row input { flex: 1; padding: 8px; border: 2px solid #ddd; border-radius: 6px; font-size: 13px; background: var(--card-bg); color: var(--text); }
        .custom-option-row .btn-remove { background: #ef4444; color: white; border: none; border-radius: 6px; width: 32px; height: 32px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .btn-add-option { width: 100%; padding: 8px; background: var(--pour); color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; margin-top: 6px; }
        
        .theme-card { background: var(--card-bg); border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); border-left: 5px solid var(--btn-gris); }
        .theme-card.actif { border-left-color: var(--pour); }
        .theme-card.cloture { border-left-color: var(--contre); opacity: 0.85; }
        .theme-card.brouillon { border-left-color: var(--abstention); }
        
        .theme-texte { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 10px; }
        .theme-statut { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; color: white; margin-bottom: 10px; }
        .theme-statut.actif { background: var(--pour); }
        .theme-statut.brouillon { background: var(--abstention); }
        .theme-statut.cloture { background: var(--contre); }
        
        .vote-buttons { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
        .vote-btn { flex: 1; min-width: 80px; padding: 12px 8px; border: none; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; color: white; transition: all 0.15s; background: var(--btn-gris); }
        .vote-btn.standard-pour.active { background: var(--pour); }
        .vote-btn.standard-contre.active { background: var(--contre); }
        .vote-btn.standard-abstention.active { background: var(--abstention); }
        .vote-btn.custom.active { background: #eab308; color: #1a1a1a; }
        .vote-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .vote-results { display: flex; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(128,128,128,0.2); flex-wrap: wrap; }
        .result-box { flex: 1; min-width: 70px; text-align: center; padding: 8px 4px; background: var(--bg); border-radius: 8px; }
        .result-box .number { font-size: 18px; font-weight: bold; }
        .result-box .label { font-size: 10px; color: var(--text-sub); word-break: break-word; }
        .result-box.pour .number { color: var(--pour); }
        .result-box.contre .number { color: var(--contre); }
        .result-box.abstention .number { color: var(--abstention); }
        .result-box.custom .number { color: #eab308; }
        .result-box.total-box .number { color: var(--text); font-size: 20px; }
        
        .admin-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .admin-btn { padding: 8px 14px; border: none; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; color: white; }
        .admin-btn.cloturer { background: var(--contre); }
        .admin-btn.supprimer { background: #6b7280; }
        .admin-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* ✅ CHAT STYLES */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-height: 100%;
        }
        
        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--primary);
            flex-shrink: 0;
        }
        
        .chat-header h3 { font-size: 16px; color: var(--text); }
        
        .chat-status {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            color: white;
        }
        .chat-status.ouvert { background: var(--pour); }
        .chat-status.ferme { background: var(--contre); }
        
        .btn-toggle-chat {
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            background: var(--primary);
        }
        .btn-toggle-chat.ouvert { background: var(--contre); }
        .btn-toggle-chat.ferme { background: var(--pour); }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            background: var(--card-bg);
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 0; /* ✅ CRUCIAL pour le scroll flex */
        }
        
        .chat-message {
            padding: 8px 12px;
            background: var(--bg);
            border-radius: 8px;
            border-left: 3px solid var(--primary);
        }
        .chat-message.organisateur {
            border-left-color: var(--pour);
            background: rgba(16, 185, 129, 0.05);
        }
        
        .chat-message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .chat-message-author { font-size: 12px; font-weight: bold; color: var(--text); }
        .chat-message-statut { font-size: 10px; color: var(--text-sub); font-style: italic; }
        .chat-message-time { font-size: 10px; color: var(--text-sub); }
        .chat-message-text { font-size: 13px; color: var(--text); line-height: 1.4; word-break: break-word; }
        
        .chat-input-container {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        
        .chat-input {
            flex: 1;
            padding: 12px 14px; /* ✅ Taille normale restaurée */
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            background: var(--bg);
            color: var(--text);
            min-width: 0;
        }
        .chat-input:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .btn-send-chat {
            padding: 10px 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            flex-shrink: 0;
        }
        .btn-send-chat:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .chat-closed-message {
            text-align: center;
            padding: 20px;
            color: var(--text-sub);
            font-style: italic;
            background: var(--bg);
            border-radius: 8px;
        }
        
        .loading { text-align: center; padding: 20px; color: var(--text-sub); }
        .empty-state { text-align: center; padding: 30px; color: var(--text-sub); font-style: italic; }
        .error-msg { background: #fee; color: #c00; padding: 10px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #c00; }
        .non-adherent-msg { text-align: center; color: var(--text-sub); font-style: italic; padding: 12px; background: var(--bg); border-radius: 8px; margin: 12px 0; border: 1px dashed var(--btn-gris); }
        
        @media (max-width: 768px) { 
            .page-header { padding: 10px 15px; }
            .presence-grid { grid-template-columns: 1fr; }
            .split-container {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 1fr;
            }
            .split-panel {
                border-right: none;
                border-bottom: 1px solid #e5e7eb;
            }
        }
    </style>
</head>
<body>
    <div class="page-header">
        <button class="back-btn" onclick="retourAccueil()">←</button>
        <h2>🗳️ Vote AG + Chat</h2>
    </div>
    
    <div class="split-container">
        <!-- ✅ PANNEAU GAUCHE : CHAT -->
        <div class="split-panel">
            <div class="chat-container">
                <div class="chat-header">
                    <h3>💬 Chat AG</h3>
                    <div>
                        <span id="chatStatus" class="chat-status ferme">Fermé</span>
                        <button id="btnToggleChat" class="btn-toggle-chat ferme" onclick="toggleChat()" style="display:none;">Ouvrir le chat</button>
                    </div>
                </div>
                
                <div id="chatMessages" class="chat-messages">
                    <div class="chat-closed-message">Le chat est fermé</div>
                </div>
                
                <div class="chat-input-container">
                    <input type="text" id="chatInput" class="chat-input" placeholder="Votre message..." disabled onkeypress="if(event.key==='Enter')sendChat()">
                    <button id="btnSendChat" class="btn-send-chat" onclick="sendChat()" disabled>Envoyer</button>
                </div>
            </div>
        </div>
        
        <!-- ✅ PANNEAU DROIT : VOTE -->
        <div class="split-panel">
            <div id="loading" class="loading">Chargement...</div>
            <div id="errorContainer"></div>
            
            <div id="voteContent" style="display:none;">
                <div class="card">
                    <h3>📋 Validation de présence</h3>
                    <div id="userInfo" style="margin-bottom:10px;font-size:13px;color:var(--text-sub);"></div>
                    
                    <div class="presence-grid">
                        <div class="presence-col">
                            <button id="btnPhysique" class="presence-btn physique" onclick="enregistrerPresence('Physique')">
                                🏢 Présent physiquement
                            </button>
                            <div class="stats-compact physique">
                                <div class="stat-box"><div class="number" id="countPhysiqueAdh">0</div><div class="label">Adhérents</div></div>
                                <div class="stat-box"><div class="number" id="countPhysiqueNonAdh">0</div><div class="label">Non adh.</div></div>
                                <div class="stat-box"><div class="number" id="countPhysique">0</div><div class="label">Total</div></div>
                            </div>
                        </div>
                        <div class="presence-col">
                            <button id="btnDistance" class="presence-btn distance" onclick="enregistrerPresence('Distance')">
                                💻 À distance
                            </button>
                            <div class="stats-compact distance">
                                <div class="stat-box"><div class="number" id="countDistanceAdh">0</div><div class="label">Adhérents</div></div>
                                <div class="stat-box"><div class="number" id="countDistanceNonAdh">0</div><div class="label">Non adh.</div></div>
                                <div class="stat-box"><div class="number" id="countDistance">0</div><div class="label">Total</div></div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="presence-grid">
                        <div class="presence-col">
                            <div class="stats-compact total">
                                <div class="stat-box"><div class="number" id="countTotalAdh">0</div><div class="label">Adhérents</div></div>
                                <div class="stat-box"><div class="number" id="countTotalNonAdh">0</div><div class="label">Non adh.</div></div>
                                <div class="stat-box"><div class="number" id="countTotal">0</div><div class="label">Total</div></div>
                            </div>
                        </div>
                        <div class="presence-col">
                            <div class="stats-compact mode">
                                <div class="stat-box"><div class="number" id="countPhysiqueTotal">0</div><div class="label">🏢 Sur place</div></div>
                                <div class="stat-box"><div class="number" id="countDistanceTotal">0</div><div class="label">💻 À distance</div></div>
                                <div class="stat-box"><div class="number" id="countTotalGeneral">0</div><div class="label">Total général</div></div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div id="adminSection" class="card" style="display:none;">
                    <h3>➕ Créer un thème de vote</h3>
                    <div class="theme-creation">
                        <input type="text" id="newThemeText" placeholder="Saisissez le thème du vote...">
                        
                        <div class="options-config">
                            <label>
                                <input type="checkbox" id="useStandardOptions" checked onchange="toggleOptionsMode()">
                                Utiliser les options standard (Pour / Contre / Abstention)
                            </label>
                            
                            <div id="customOptionsSection" style="display:none;">
                                <div style="font-size:12px;color:var(--text-sub);margin-bottom:8px;">Options personnalisées :</div>
                                <div id="customOptionsList"></div>
                                <button class="btn-add-option" onclick="addCustomOption()">+ Ajouter une option</button>
                            </div>
                        </div>
                        
                        <button class="btn-creer" onclick="creerTheme()" style="margin-top:10px;">Créer et ouvrir</button>
                    </div>
                </div>
                
                <div id="themesContainer"></div>
            </div>
        </div>
    </div>

    <script src="../js/commun.js"></script>
    <script>
        verifierConnexionOuRediriger();
        
        let userData = null;
        let isOrganisateur = false;
        let isAdherent = false;
        let refreshInterval = null;
        let chatRefreshInterval = null;
        
        let localVotes = {};
        let localCounters = {};
        let localCountersExpiry = {};
        let lastActionTime = 0;
        let modeParticipation = null;
        let customOptionsCounter = 0;
        
        let chatOuvert = false;
        let lastChatMessageCount = 0;
        
        async function chargerDonnees() {
            try {
                const adherentData = localStorage.getItem('aamb_adherent');
                if (!adherentData) {
                    showError('⚠️ Veuillez vous connecter d\'abord via la page d\'accueil.');
                    document.getElementById('loading').style.display = 'none';
                    return;
                }
                
                userData = JSON.parse(adherentData);
                isOrganisateur = userData.statut === 'Organisateur';
                isAdherent = userData.typeAdhesion === 'Adhérent';
                
                document.getElementById('userInfo').innerHTML = 
                    '👤 <strong>' + escapeHtml(userData.prenom) + ' ' + escapeHtml(userData.nom) + '</strong><br>' +
                    '📧 ' + escapeHtml(userData.email) + ' | ' + 
                    (isOrganisateur ? '🔑 Organisateur' : '👤 Participant') + ' | ' +
                    (isAdherent ? '✅ Adhérent (droit de vote)' : '⚠️ Non adhérent');
                
                if (isOrganisateur) {
                    document.getElementById('adminSection').style.display = 'block';
                    document.getElementById('btnToggleChat').style.display = 'inline-block';
                }
                
                await chargerVoteData();
                await chargerChatData();
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('voteContent').style.display = 'block';
                
                refreshInterval = setInterval(() => {
                    if (Date.now() - lastActionTime < 5000) return;
                    chargerVoteData();
                }, 2000);
                
                chatRefreshInterval = setInterval(chargerChatData, 2000);
            } catch (e) {
                console.error('[VoteAG] Erreur:', e);
                showError('Erreur de chargement : ' + e.message);
                document.getElementById('loading').style.display = 'none';
            }
        }
        
        function showError(msg) {
            document.getElementById('errorContainer').innerHTML = '<div class="error-msg">' + msg + '</div>';
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function toggleOptionsMode() {
            const useStandard = document.getElementById('useStandardOptions').checked;
            document.getElementById('customOptionsSection').style.display = useStandard ? 'none' : 'block';
            if (!useStandard && document.getElementById('customOptionsList').children.length === 0) {
                addCustomOption();
                addCustomOption();
                addCustomOption();
            }
        }
        
        function addCustomOption() {
            customOptionsCounter++;
            const list = document.getElementById('customOptionsList');
            const row = document.createElement('div');
            row.className = 'custom-option-row';
            row.id = 'option-row-' + customOptionsCounter;
            row.innerHTML = `
                <input type="text" placeholder="Libellé de l'option" class="custom-option-input">
                <button class="btn-remove" onclick="removeCustomOption(${customOptionsCounter})">×</button>
            `;
            list.appendChild(row);
        }
        
        function removeCustomOption(id) {
            const row = document.getElementById('option-row-' + id);
            if (row) row.remove();
        }
        
        function getSelectedOptions() {
            const useStandard = document.getElementById('useStandardOptions').checked;
            if (useStandard) return 'Pour,Contre,Abstention';
            
            const inputs = document.querySelectorAll('.custom-option-input');
            const options = [];
            inputs.forEach(input => {
                const val = input.value.trim();
                if (val) options.push(val);
            });
            return options.length >= 2 ? options.join(',') : 'Pour,Contre,Abstention';
        }
        
        async function chargerVoteData() {
            try {
                const resp = await fetch(SCRIPT_URL + '?action=getVoteAGData&userId=' + encodeURIComponent(userData.id));
                const data = await resp.json();
                if (data.success) {
                    const p = data.presence;
                    
                    document.getElementById('countPhysiqueAdh').textContent = p.physiqueAdherent || 0;
                    document.getElementById('countPhysiqueNonAdh').textContent = p.physiqueNonAdherent || 0;
                    document.getElementById('countPhysique').textContent = p.physique || 0;
                    
                    document.getElementById('countDistanceAdh').textContent = p.distanceAdherent || 0;
                    document.getElementById('countDistanceNonAdh').textContent = p.distanceNonAdherent || 0;
                    document.getElementById('countDistance').textContent = p.distance || 0;
                    
                    document.getElementById('countTotalAdh').textContent = p.adherent || 0;
                    document.getElementById('countTotalNonAdh').textContent = p.nonAdherent || 0;
                    document.getElementById('countTotal').textContent = p.total || 0;
                    document.getElementById('countPhysiqueTotal').textContent = p.physique || 0;
                    document.getElementById('countDistanceTotal').textContent = p.distance || 0;
                    document.getElementById('countTotalGeneral').textContent = (p.physique || 0) + (p.distance || 0);
                    
                    data.themes.forEach(theme => {
                        if (localVotes[theme.themeId]) {
                            theme.monVote = localVotes[theme.themeId];
                        }
                        if (localCounters[theme.themeId] && localCountersExpiry[theme.themeId] > Date.now()) {
                            theme.compteurs = localCounters[theme.themeId];
                            theme.total = Object.values(localCounters[theme.themeId]).reduce((a, b) => a + b, 0);
                        } else {
                            delete localCounters[theme.themeId];
                            delete localCountersExpiry[theme.themeId];
                        }
                    });
                    
                    afficherThemes(data.themes);
                }
            } catch (e) {
                console.error('[VoteAG] Erreur refresh:', e);
            }
        }
        
        function isStandardOptions(options) {
            return options.length === 3 && 
                   options.includes('Pour') && 
                   options.includes('Contre') && 
                   options.includes('Abstention');
        }
        
        function afficherThemes(themes) {
            const container = document.getElementById('themesContainer');
            if (themes.length === 0) {
                container.innerHTML = '<div class="empty-state">Aucun thème de vote pour le moment.</div>';
                return;
            }
            
            let html = '';
            themes.forEach(theme => {
                const statutClass = theme.statut.toLowerCase();
                const isActif = theme.statut === 'ACTIF';
                const isCloture = theme.statut === 'CLOTURE';
                const isBrouillon = theme.statut === 'BROUILLON';
                const standard = isStandardOptions(theme.options);
                
                html += '<div class="theme-card ' + statutClass + '" data-theme-id="' + theme.themeId + '">';
                html += '<span class="theme-statut ' + statutClass + '">' + theme.statut + '</span>';
                html += '<div class="theme-texte">' + escapeHtml(theme.texte) + '</div>';
                
                if (isActif) {
                    if (isAdherent) {
                        html += '<div class="vote-buttons">';
                        theme.options.forEach(opt => {
                            const isActive = theme.monVote === opt;
                            let btnClass = 'vote-btn';
                            if (standard) {
                                btnClass += ' standard-' + opt.toLowerCase();
                            } else {
                                btnClass += ' custom';
                            }
                            if (isActive) btnClass += ' active';
                            html += '<button class="' + btnClass + '" onclick="voter(\'' + theme.themeId + '\', \'' + escapeHtml(opt).replace(/'/g, "\\'") + '\')">' + escapeHtml(opt) + '</button>';
                        });
                        html += '</div>';
                    } else {
                        html += '<div class="non-adherent-msg">ℹ️ Le vote est réservé aux adhérents. Vous pouvez consulter les résultats ci-dessous.</div>';
                    }
                } else if (isCloture) {
                    html += '<div style="text-align:center;color:var(--text-sub);font-style:italic;padding:10px;">🔒 Vote clôturé</div>';
                } else if (isBrouillon) {
                    html += '<div style="text-align:center;color:var(--text-sub);font-style:italic;padding:10px;">⏳ En cours de modification...</div>';
                }
                
                html += '<div class="vote-results">';
                theme.options.forEach(opt => {
                    const count = theme.compteurs[opt] || 0;
                    let boxClass = 'result-box';
                    if (standard) {
                        boxClass += ' ' + opt.toLowerCase();
                    } else {
                        boxClass += ' custom';
                    }
                    html += '<div class="' + boxClass + '"><div class="number">' + count + '</div><div class="label">' + escapeHtml(opt) + '</div></div>';
                });
                html += '<div class="result-box total-box"><div class="number">' + theme.total + '</div><div class="label">Total</div></div>';
                html += '</div>';
                
                if (isOrganisateur) {
                    html += '<div class="admin-actions">';
                    if (isActif) {
                        html += '<button class="admin-btn cloturer" onclick="cloturerVote(\'' + theme.themeId + '\')">🔒 Clôturer</button>';
                    }
                    html += '<button class="admin-btn supprimer" onclick="supprimerTheme(\'' + theme.themeId + '\')">🗑️ Supprimer le vote</button>';
                    html += '</div>';
                }
                html += '</div>';
            });
            container.innerHTML = html;
        }
        
        async function voter(themeId, choix) {
            const userId = userData.id;
            lastActionTime = Date.now();
            
            const themeCard = document.querySelector(`.theme-card[data-theme-id="${themeId}"]`);
            if (!themeCard) return;
            
            const resultBoxes = themeCard.querySelectorAll('.result-box:not(.total-box)');
            const newCounters = {};
            resultBoxes.forEach(box => {
                const label = box.querySelector('.label').textContent.trim();
                const count = parseInt(box.querySelector('.number').textContent || 0);
                newCounters[label] = count;
            });
            
            const ancienChoix = localVotes[themeId];
            if (ancienChoix && ancienChoix !== choix) {
                newCounters[ancienChoix] = Math.max(0, (newCounters[ancienChoix] || 0) - 1);
            }
            newCounters[choix] = (newCounters[choix] || 0) + 1;
            
            localVotes[themeId] = choix;
            localCounters[themeId] = newCounters;
            localCountersExpiry[themeId] = Date.now() + 5000;
            
            const buttons = themeCard.querySelectorAll('.vote-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            const clickedBtn = Array.from(buttons).find(btn => btn.textContent.trim() === choix);
            if (clickedBtn) clickedBtn.classList.add('active');
            
            resultBoxes.forEach(box => {
                const label = box.querySelector('.label').textContent.trim();
                if (newCounters[label] !== undefined) {
                    box.querySelector('.number').textContent = newCounters[label];
                }
            });
            const totalBox = themeCard.querySelector('.result-box.total-box .number');
            if (totalBox) {
                totalBox.textContent = Object.values(newCounters).reduce((a, b) => a + b, 0);
            }
            
            try {
                const resp = await fetch(SCRIPT_URL + '?action=enregistrerVote&userId=' + encodeURIComponent(userId) + '&themeId=' + encodeURIComponent(themeId) + '&choix=' + encodeURIComponent(choix));
                const data = await resp.json();
                if (!data.success) {
                    console.error('Erreur vote:', data.message);
                    delete localVotes[themeId];
                    delete localCounters[themeId];
                    delete localCountersExpiry[themeId];
                    setTimeout(() => chargerVoteData(), 1000);
                }
            } catch (e) {
                console.error('[VoteAG] Erreur:', e);
            }
        }
        
        async function enregistrerPresence(mode) {
            lastActionTime = Date.now();
            const userId = userData.id;
            const btnPhysique = document.getElementById('btnPhysique');
            const btnDistance = document.getElementById('btnDistance');
            
            btnPhysique.disabled = true;
            btnDistance.disabled = true;
            btnPhysique.textContent = '⏳ Enregistrement...';
            btnDistance.textContent = '⏳ Enregistrement...';
            
            try {
                const resp = await fetch(SCRIPT_URL + '?action=enregistrerPresenceAG&userId=' + encodeURIComponent(userId) + '&mode=' + encodeURIComponent(mode));
                const data = await resp.json();
                
                if (data.success) {
                    modeParticipation = mode;
                    if (mode === 'Physique') {
                        btnPhysique.classList.add('active');
                        btnDistance.classList.remove('active');
                        btnPhysique.textContent = '✅ Présent physiquement';
                        btnDistance.textContent = '💻 À distance';
                        btnDistance.disabled = false;
                    } else {
                        btnDistance.classList.add('active');
                        btnPhysique.classList.remove('active');
                        btnDistance.textContent = '✅ Participant à distance';
                        btnPhysique.textContent = '🏢 Présent physiquement';
                        btnPhysique.disabled = false;
                    }
                    await chargerVoteData();
                } else {
                    alert('❌ ' + data.message);
                    btnPhysique.disabled = false;
                    btnDistance.disabled = false;
                    btnPhysique.textContent = '🏢 Présent physiquement';
                    btnDistance.textContent = '💻 À distance';
                }
            } catch (e) {
                alert('Erreur de connexion: ' + e.message);
                btnPhysique.disabled = false;
                btnDistance.disabled = false;
                btnPhysique.textContent = '🏢 Présent physiquement';
                btnDistance.textContent = '💻 À distance';
            }
        }
        
        async function creerTheme() {
            lastActionTime = Date.now();
            const texte = document.getElementById('newThemeText').value.trim();
            if (!texte) { alert('Veuillez saisir un thème'); return; }
            
            const options = getSelectedOptions();
            
            try {
                const resp = await fetch(SCRIPT_URL + '?action=creerThemeVote&userId=' + encodeURIComponent(userData.id) + '&themeTexte=' + encodeURIComponent(texte) + '&options=' + encodeURIComponent(options));
                const data = await resp.json();
                if (data.success) {
                    document.getElementById('newThemeText').value = '';
                    document.getElementById('useStandardOptions').checked = true;
                    document.getElementById('customOptionsList').innerHTML = '';
                    toggleOptionsMode();
                    await chargerVoteData();
                } else {
                    alert('❌ ' + data.message);
                }
            } catch (e) {
                alert('Erreur de connexion');
            }
        }
        
        async function supprimerTheme(themeId) {
            if (!confirm('⚠️ Supprimer ce vote et tous les votes associés ?\n\nCette action est irréversible.')) return;
            lastActionTime = Date.now();
            try {
                const resp = await fetch(SCRIPT_URL + '?action=supprimerThemeVote&userId=' + encodeURIComponent(userData.id) + '&themeId=' + encodeURIComponent(themeId));
                const data = await resp.json();
                if (data.success) {
                    delete localVotes[themeId];
                    delete localCounters[themeId];
                    delete localCountersExpiry[themeId];
                    await chargerVoteData();
                } else {
                    alert('❌ ' + data.message);
                }
            } catch (e) {
                console.error('[VoteAG] Erreur:', e);
                alert('Erreur de connexion');
            }
        }
        
        async function cloturerVote(themeId) {
            lastActionTime = Date.now();
            if (!confirm('Clôturer définitivement ce vote ?')) return;
            try {
                const resp = await fetch(SCRIPT_URL + '?action=cloturerVote&userId=' + encodeURIComponent(userData.id) + '&themeId=' + encodeURIComponent(themeId));
                const data = await resp.json();
                if (data.success) {
                    delete localVotes[themeId];
                    delete localCounters[themeId];
                    delete localCountersExpiry[themeId];
                    await chargerVoteData();
                } else {
                    alert('❌ ' + data.message);
                }
            } catch (e) {
                alert('Erreur de connexion');
            }
        }
        
        // ✅ FONCTIONS CHAT
        async function chargerChatData() {
            try {
                const resp = await fetch(SCRIPT_URL + '?action=getChatAG&userId=' + encodeURIComponent(userData.id));
                const data = await resp.json();
                
                if (data.success) {
                    chatOuvert = data.chatOuvert;
                    const isOrganisateur = data.isOrganisateur;
                    
                    const statusBadge = document.getElementById('chatStatus');
                    const toggleBtn = document.getElementById('btnToggleChat');
                    
                    if (chatOuvert) {
                        statusBadge.textContent = 'Ouvert';
                        statusBadge.className = 'chat-status ouvert';
                        if (isOrganisateur) {
                            toggleBtn.textContent = 'Fermer le chat';
                            toggleBtn.className = 'btn-toggle-chat ouvert';
                        }
                    } else {
                        statusBadge.textContent = 'Fermé';
                        statusBadge.className = 'chat-status ferme';
                        if (isOrganisateur) {
                            toggleBtn.textContent = 'Ouvrir le chat';
                            toggleBtn.className = 'btn-toggle-chat ferme';
                        }
                    }
                    
                    const chatInput = document.getElementById('chatInput');
                    const btnSend = document.getElementById('btnSendChat');
                    chatInput.disabled = !chatOuvert;
                    btnSend.disabled = !chatOuvert;
                    
                    afficherMessages(data.messages);
                }
            } catch (e) {
                console.error('[ChatAG] Erreur:', e);
            }
        }
        
        function afficherMessages(messages) {
            const container = document.getElementById('chatMessages');
            
            if (!chatOuvert) {
                container.innerHTML = '<div class="chat-closed-message">Le chat est fermé</div>';
                return;
            }
            
            if (messages.length === 0) {
                container.innerHTML = '<div class="chat-closed-message">Aucun message pour le moment</div>';
                return;
            }
            
            let html = '';
            messages.forEach(msg => {
                const isOrganisateur = msg.statut === 'Organisateur';
                const msgClass = isOrganisateur ? 'chat-message organisateur' : 'chat-message';
                
                html += '<div class="' + msgClass + '">';
                html += '<div class="chat-message-header">';
                html += '<span class="chat-message-author">' + escapeHtml(msg.prenom) + ' ' + escapeHtml(msg.nom) + '</span>';
                html += '<span class="chat-message-time">' + escapeHtml(msg.horodatage) + '</span>';
                html += '</div>';
                if (isOrganisateur) {
                    html += '<div class="chat-message-statut">🔑 Organisateur</div>';
                }
                html += '<div class="chat-message-text">' + escapeHtml(msg.message) + '</div>';
                html += '</div>';
            });
            
            container.innerHTML = html;
            
            if (messages.length > lastChatMessageCount) {
                container.scrollTop = container.scrollHeight;
            }
            lastChatMessageCount = messages.length;
        }
        
        async function toggleChat() {
            if (!confirm(chatOuvert ? 'Fermer le chat ?' : 'Ouvrir le chat ?')) return;
            
            try {
                const resp = await fetch(SCRIPT_URL + '?action=toggleChatAG&userId=' + encodeURIComponent(userData.id));
                const data = await resp.json();
                
                if (data.success) {
                    await chargerChatData();
                } else {
                    alert('❌ ' + data.message);
                }
            } catch (e) {
                console.error('[ChatAG] Erreur:', e);
                alert('Erreur de connexion');
            }
        }
        
        async function sendChat() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            try {
                const resp = await fetch(SCRIPT_URL + '?action=sendChatAG&userId=' + encodeURIComponent(userData.id) + '&message=' + encodeURIComponent(message));
                const data = await resp.json();
                
                if (data.success) {
                    input.value = '';
                    await chargerChatData();
                } else {
                    alert('❌ ' + data.message);
                }
            } catch (e) {
                console.error('[ChatAG] Erreur:', e);
                alert('Erreur de connexion');
            }
        }
        
        window.addEventListener('beforeunload', () => {
            if (refreshInterval) clearInterval(refreshInterval);
            if (chatRefreshInterval) clearInterval(chatRefreshInterval);
        });
        
        chargerDonnees();
    </script>
